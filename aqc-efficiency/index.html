<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>79號碼頭智慧管理系統</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",sans-serif;background:#f3f4f6;display:flex;align-items:center;justify-content:center;padding:24px;color:#111827}
.card{width:100%;max-width:560px;background:#fff;border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.12);overflow:hidden}
.header{background:#111827;color:#fff;padding:26px;text-align:center}
.header h1{margin:0 0 6px;font-size:28px}
.version{font-size:12px;color:#cbd5e1}
.body{padding:26px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.choice{padding:18px 12px;border:2px solid #d1d5db;background:#fff;border-radius:14px;cursor:pointer;font-size:17px;font-weight:800}
.choice.active{border-color:#4f46e5;background:#eef2ff;color:#3730a3}
.panel{display:none;border-top:1px solid #e5e7eb;padding-top:20px}
.panel.show{display:block}
.field{margin-bottom:15px}
label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}
select,input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
.status{margin-bottom:15px;padding:11px 13px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:14px;white-space:pre-line}
.status.error{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.status.success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.hint{font-size:13px;color:#64748b;line-height:1.6}
.go{width:100%;padding:13px;margin-top:6px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.destinations{display:none;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}
.destinations.show{display:block}
.destinations h3{margin:0 0 12px;text-align:center}
.destinations a{display:block;text-decoration:none;text-align:center;padding:15px;margin-top:10px;border-radius:12px;font-weight:800;border:1px solid #cbd5e1;color:#1f2937;background:#f8fafc}
.destinations a.locked{
  opacity:.58;
  cursor:not-allowed;
  background:#f1f5f9!important;
  color:#64748b!important;
  border-style:dashed!important;
}
.destinations .system-note{
  display:block;
  margin-top:4px;
  font-size:12px;
  font-weight:500;
  opacity:.78;
}


/* ===== 淺色 / 暗色模式 ===== */
:root{
  color-scheme: light;
  --page-bg:#f3f4f6;
  --card-bg:#ffffff;
  --text:#111827;
  --muted:#64748b;
  --header-bg:#111827;
  --header-text:#ffffff;
  --border:#d1d5db;
  --input-bg:#ffffff;
  --choice-active-bg:#eef2ff;
  --choice-active-text:#3730a3;
  --link-bg:#f8fafc;
  --link-text:#1f2937;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --page-bg:#0b1120;
  --card-bg:#111827;
  --text:#f8fafc;
  --muted:#94a3b8;
  --header-bg:#020617;
  --header-text:#ffffff;
  --border:#334155;
  --input-bg:#0f172a;
  --choice-active-bg:#312e81;
  --choice-active-text:#eef2ff;
  --link-bg:#0f172a;
  --link-text:#f8fafc;
}
body{background:var(--page-bg)!important;color:var(--text)!important;transition:background .2s,color .2s}
.card{background:var(--card-bg)!important}
.header{background:var(--header-bg)!important;color:var(--header-text)!important;position:relative}
.choice{background:var(--card-bg)!important;border-color:var(--border)!important;color:var(--text)!important}
.choice.active{background:var(--choice-active-bg)!important;color:var(--choice-active-text)!important}
.panel{border-color:var(--border)!important}
select,input{
  background:var(--input-bg)!important;
  color:var(--text)!important;
  border-color:var(--border)!important;
}
.hint{color:var(--muted)!important}
.destinations{border-color:var(--border)!important}
.destinations a{
  background:var(--link-bg)!important;
  color:var(--link-text)!important;
  border-color:var(--border)!important
}
.theme-toggle{
  position:absolute;
  top:14px;
  right:14px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);
  color:#fff;
  border-radius:999px;
  padding:8px 11px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
html[data-theme="dark"] .status{
  background:#172554;
  border-color:#1d4ed8;
  color:#bfdbfe;
}
html[data-theme="dark"] .status.error{
  background:#3f0d18;
  border-color:#9f1239;
  color:#fecdd3;
}
html[data-theme="dark"] .status.success{
  background:#052e24;
  border-color:#047857;
  color:#a7f3d0;
}
@media (max-width:600px){
  body{padding:14px}
  .body{padding:22px 18px}
  .header{padding:30px 52px 24px 18px}
  .header h1{font-size:23px;line-height:1.3}
  .theme-toggle{top:12px;right:10px}
}

</style>
</head>
<body>
<div class="card">
  <div class="header">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="切換顯示模式">🌙 暗色</button>
    <h1>79號碼頭智慧管理系統</h1>
    <div class="version">正式版｜管理功能僅限超級管理員</div>
  </div>

  <div class="body">
    <div class="mode-grid">
      <button id="employeeMode" class="choice" type="button">一般員工</button>
      <button id="adminMode" class="choice" type="button">超級管理員</button>
    </div>

    <div id="employeePanel" class="panel">
      <div class="status success">一般員工模式</div>
      <p class="hint">按 Enter 或按下方按鈕，直接進入考勤系統。</p>
      <button id="employeeEnterBtn" class="go" type="button">進入考勤系統</button>
    </div>

    <div id="adminPanel" class="panel">
      <div id="status" class="status">超級管理員登入</div>
      <div class="field">
        <label for="adminAccount">帳號</label>
        <input id="adminAccount" type="text" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>

      <button id="adminLoginBtn" class="go" type="button">登入</button>

      <div id="destinations" class="destinations">
        <h3>超級管理員登入成功，請選擇系統</h3>
        <a href="./attendance/?v=20260923-session-login-v5">進入考勤系統</a>
        <a href="./schedule/?v=20260923-session-login-v5">進入排班系統</a>
        <a id="gcEfficiencyLink" href="./aqc-efficiency/?v=20260923-session-login-v5" class="locked" aria-disabled="true">
          進入船舶效率統計中心
          <span id="gcEfficiencyNote" class="system-note">僅限超級管理員</span>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
// 手機防快取：第一次用舊網址開啟時，自動補上版本參數，
// 讓 Safari / Chrome Mobile 將它視為新網址重新抓取頁面。
(function ensureFreshVersion(){
  const BUILD_VERSION = "20260923-session-login-v5";
  try{
    const url = new URL(window.location.href);
    if(url.searchParams.get("v") !== BUILD_VERSION){
      url.searchParams.set("v", BUILD_VERSION);
      window.location.replace(url.toString());
      return;
    }
  }catch(e){
    console.warn("版本參數更新失敗", e);
  }
})();

const GAS_URL = "https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec";
let currentMode = "";
let adminLoggedIn = false;

const employeeMode = document.getElementById("employeeMode");
const adminMode = document.getElementById("adminMode");
const employeePanel = document.getElementById("employeePanel");
const adminPanel = document.getElementById("adminPanel");
const employeeEnterBtn = document.getElementById("employeeEnterBtn");
const adminAccount = document.getElementById("adminAccount");
const adminLoginBtn = document.getElementById("adminLoginBtn");
const password = document.getElementById("password");
const statusBox = document.getElementById("status");
const destinations = document.getElementById("destinations");
const gcEfficiencyLink = document.getElementById("gcEfficiencyLink");
const gcEfficiencyNote = document.getElementById("gcEfficiencyNote");


const themeToggle = document.getElementById("themeToggle");

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("smart_terminal_theme", theme);
  themeToggle.textContent = theme === "dark" ? "☀️ 淺色" : "🌙 暗色";
}

(function initTheme(){
  const saved = localStorage.getItem("smart_terminal_theme");
  const preferredDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (preferredDark ? "dark" : "light"));
})();

themeToggle.addEventListener("click", ()=>{
  const now = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(now === "dark" ? "light" : "dark");
});


employeeMode.addEventListener("click",()=>setMode("employee"));
adminMode.addEventListener("click",()=>setMode("admin"));
employeeEnterBtn.addEventListener("click",()=>window.location.href="./attendance/?v=20260923-session-login-v5");
adminLoginBtn.addEventListener("click", loginAdmin);
if(gcEfficiencyLink){
  gcEfficiencyLink.addEventListener("click",(e)=>{
    if(gcEfficiencyLink.classList.contains("locked")){
      e.preventDefault();
      statusBox.className="status error";
      statusBox.textContent="船舶效率統計中心僅限超級管理員使用。";
    }
  });
}

// 正式版允許超級管理員使用英數工號／帳號登入。
document.addEventListener("keydown",(e)=>{
  if(e.key!=="Enter") return;

  if(currentMode==="employee"){
    e.preventDefault();
    window.location.href="./attendance/?v=20260923-session-login-v5";
    return;
  }

  if(currentMode==="admin" && !adminLoggedIn){
    e.preventDefault();
    loginAdmin();
  }
});

async function setMode(mode){
  currentMode=mode;
  employeeMode.classList.toggle("active",mode==="employee");
  adminMode.classList.toggle("active",mode==="admin");
  employeePanel.classList.toggle("show",mode==="employee");
  adminPanel.classList.toggle("show",mode==="admin");
}


async function readGasJson(response, label){
  const raw = await response.text();
  const cleaned = String(raw || "").replace(/^\uFEFF/, "").trim();

  try{
    return JSON.parse(cleaned);
  }catch(e){
    // iPhone/Safari 若收到 Google HTML 頁面，直接顯示較清楚的原因
    const looksHtml = /^<!doctype html|^<html/i.test(cleaned);
    if(looksHtml){
      throw new Error(label+"收到 Google 網頁而不是 JSON。請確認 GAS 已部署為「網頁應用程式」，執行身分為擁有者，存取權限允許網站使用者存取。");
    }
    throw new Error(label+"回傳格式錯誤。回傳內容："+cleaned.slice(0,120));
  }
}

async function verifyAdminFromGas(loginId, pwd){
  // 第一次：原本 JSON POST
  let response = await fetch(GAS_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"verifyAdmin",loginId:loginId,attNo:loginId,password:pwd}),
    cache:"no-store",
    redirect:"follow"
  });

  try{
    return await readGasJson(response, "GAS 登入驗證");
  }catch(firstError){
    // 第二次：兼容部分 GAS doPost 使用 e.parameter 的寫法。
    // 密碼仍放在 POST body，不會放到網址列。
    const formBody = new URLSearchParams({
      action:"verifyAdmin",
      loginId:loginId,
      attNo:loginId,
      password:pwd
    });

    response = await fetch(GAS_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
      body:formBody.toString(),
      cache:"no-store",
      redirect:"follow"
    });

    try{
      return await readGasJson(response, "GAS 登入驗證");
    }catch(secondError){
      throw secondError;
    }
  }
}


async function createGcSuperAdminToken(loginId,pwd){
  // 僅保留舊程式相容；正式登入流程已改由 verifyAdmin 同一次回應取得 gcToken。
  const existing=String(
    sessionStorage.getItem("port79_gc_superadmin_token")||
    sessionStorage.getItem("port79_gc_token")||
    ''
  ).trim();
  if(existing)return existing;
  throw new Error("目前未取得 GC Token，請重新登入超級管理員");
}

function updateDestinationVisibility(role){
  const isSuper = String(role||"").toLowerCase() === "superadmin";

  // 正式版：管理入口僅允許超級管理員。
  // 只有超級管理員登入成功後，才顯示三個系統入口。
  document.querySelectorAll("#destinations a").forEach(a=>{
    a.style.display = isSuper ? "block" : "none";
  });

  if(gcEfficiencyLink){
    if(isSuper){
      gcEfficiencyLink.classList.remove("locked");
      gcEfficiencyLink.setAttribute("aria-disabled","false");
      gcEfficiencyLink.href = "./aqc-efficiency/?v=20260923-session-login-v5";
      if(gcEfficiencyNote) gcEfficiencyNote.textContent = "超級管理員可使用";
    }else{
      gcEfficiencyLink.classList.add("locked");
      gcEfficiencyLink.setAttribute("aria-disabled","true");
      gcEfficiencyLink.removeAttribute("href");
      if(gcEfficiencyNote) gcEfficiencyNote.textContent = "🔒 僅限超級管理員";
    }
  }
}

async function loginAdmin(){
  const loginId=adminAccount.value.trim();
  const pwd=password.value.trim();

  if(!loginId){
    statusBox.className="status error";
    statusBox.textContent="帳號格式錯誤";
    adminAccount.focus();
    return;
  }
  if(!pwd){
    statusBox.className="status error";
    statusBox.textContent="請輸入密碼。";
    password.focus();
    return;
  }

  adminLoginBtn.disabled=true;
  adminLoginBtn.textContent="登入中...";
  statusBox.className="status";
  statusBox.textContent="正在登入...";

  try{
    const data=await verifyAdminFromGas(loginId,pwd);

    if(!data.ok || !data.admin) throw new Error(data.error||"帳號或密碼錯誤");

    const role=String(data.adminRole||"").toLowerCase();
    if(role!=="superadmin") throw new Error("此系統僅限超級管理員登入");

    const sessionData={
      empId:String(data.empId||loginId).trim().toUpperCase(),
      name:data.name||"",
      dept:data.dept||"",
      adminRole:role,
      loginAt:new Date().toISOString()
    };

    // 入口本身使用
    sessionStorage.setItem("admin_session",JSON.stringify(sessionData));

    // 考勤系統 attendance/ 使用：
    // 管理員 / 超級管理員在入口登入一次後，進入考勤系統直接沿用，
    // 不需要再跳一次管理員登入視窗。
    sessionStorage.setItem("aqc_admin_logged_in","1");
    sessionStorage.setItem("aqc_admin_id",sessionData.empId);
    sessionStorage.setItem("aqc_admin_role",role);
    sessionStorage.setItem("aqc_admin_name",sessionData.name||"");


    // 新正式版：verifyAdmin 同一次回應就會帶回 gcToken，
    // 不再送第二次 gcSuperAdminLogin 請求。
    const gcToken=String(data.gcToken||data.token||'').trim();
    if(!gcToken){
      throw new Error(
        "超級管理員驗證成功，但目前線上 GAS 尚未更新到「單次登入核發 GC 憑證」版本。請先重新部署新版 GAS。"
      );
    }

    sessionStorage.setItem("port79_gc_token",gcToken);
    sessionStorage.setItem("port79_gc_superadmin_token",gcToken);


    updateDestinationVisibility(role);

    adminLoggedIn=true;
    adminAccount.disabled=true;
    password.disabled=true;
    adminLoginBtn.disabled=true;

    statusBox.className="status success";
    statusBox.textContent="登入成功。超級管理員可進入全部三個系統。";
    destinations.classList.add("show");

    adminLoginBtn.textContent="已登入";
    adminLoginBtn.disabled=true;

  }catch(err){
    statusBox.className="status error";
    statusBox.textContent="登入失敗："+(err?.message||err);
    password.select();

    adminLoginBtn.disabled=false;
    adminLoginBtn.textContent="登入";
  }
}

(function restoreExistingAdminSession(){
  // 正確流程：
  // 1. 第一次進入本分頁：沒有 session -> 要求登入。
  // 2. 登入成功後，在同一分頁進入考勤 / 排班 / 船舶效率，再回首頁：
  //    sessionStorage 仍存在 -> 不需要重新登入。
  // 3. 關閉分頁 / 瀏覽器後，sessionStorage 自動消失 -> 下次重新要求登入。
  let s=null;
  try{
    s=JSON.parse(sessionStorage.getItem("admin_session")||"null");
  }catch(e){
    s=null;
  }

  const role=String(
    s?.adminRole ||
    sessionStorage.getItem("aqc_admin_role") ||
    ""
  ).toLowerCase();

  const gcToken=String(
    sessionStorage.getItem("port79_gc_superadmin_token") ||
    sessionStorage.getItem("port79_gc_token") ||
    ""
  ).trim();

  if(role==="superadmin" && s && gcToken){
    adminLoggedIn=true;

    // 回首頁時維持超級管理員頁籤與已登入狀態
    setMode("admin");

    if(adminAccount){
      adminAccount.value=String(s.empId||"");
      adminAccount.disabled=true;
    }
    if(password){
      password.value="";
      password.disabled=true;
    }

    updateDestinationVisibility("superadmin");

    if(statusBox){
      statusBox.className="status success";
      statusBox.textContent="超級管理員已登入，可直接選擇系統。";
    }

    if(destinations){
      destinations.style.display="";
      destinations.classList.add("show");
    }

    if(adminLoginBtn){
      adminLoginBtn.disabled=true;
      adminLoginBtn.textContent="已登入";
    }
    return;
  }

  // 沒有有效工作階段才顯示登入畫面
  adminLoggedIn=false;

  // 清除可能殘留的不完整 sessionStorage，但不影響真正第一次登入
  [
    "admin_session",
    "aqc_admin_logged_in",
    "aqc_admin_id",
    "aqc_admin_role",
    "aqc_admin_name",
    "port79_gc_token",
    "port79_gc_superadmin_token"
  ].forEach(key=>sessionStorage.removeItem(key));

  // 舊版本曾把登入資訊寫入 localStorage；
  // 只清掉「登入憑證」舊資料，避免被舊版誤判為已登入。
  [
    "admin_session",
    "aqc_admin_logged_in",
    "aqc_admin_id",
    "aqc_admin_role",
    "aqc_admin_name",
    "port79_gc_token",
    "port79_gc_superadmin_token"
  ].forEach(key=>localStorage.removeItem(key));

  if(adminAccount){
    adminAccount.disabled=false;
    adminAccount.value="";
  }
  if(password){
    password.disabled=false;
    password.value="";
  }

  if(adminLoginBtn){
    adminLoginBtn.disabled=false;
    adminLoginBtn.textContent="登入";
  }

  if(statusBox){
    statusBox.textContent="請先輸入超級管理員帳號與密碼";
    statusBox.className="status";
  }

  if(destinations){
    destinations.classList.remove("show");
    destinations.style.display="none";
  }

  updateDestinationVisibility("");
})();

</script>
</body>
</html>
