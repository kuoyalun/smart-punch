<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全月智慧排班管理系統 - 永久儲存與智慧代班版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (Excel 匯入匯出) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    
    .sticky-col-left { 
      position: sticky; 
      left: 0; 
      background-color: #ffffff; 
      z-index: 20; 
      box-shadow: 2px 0 6px -2px rgba(0, 0, 0, 0.08);
    }
    .sticky-col-left-header { 
      position: sticky; 
      left: 0; 
      background-color: #f8fafc; 
      z-index: 30; 
      box-shadow: 2px 0 6px -2px rgba(0, 0, 0, 0.08);
    }

    select.clean-shift-select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align: center;
      text-align-last: center;
      background-image: none !important;
      padding: 0 !important;
    }

    .custom-scrollbar::-webkit-scrollbar { height: 10px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @media print {
      .no-print { display: none !important; }
      body { overflow: visible !important; height: auto !important; background: white; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- 1. 頂部控制列 -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50 shadow-sm no-print">
    <div class="max-w-[1920px] mx-auto flex flex-wrap justify-between items-center gap-4">
      
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl font-bold shadow-md shadow-indigo-100">
          <i class="fa-solid fa-calendar-days text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-800">全月智慧排班管理系統</h1>
          <p class="text-xs text-slate-500">已啟用本機永久儲存 | 國定假日標示 | 請假與智慧代班指派</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <!-- 月份選擇器 -->
        <div class="flex items-center bg-slate-50 rounded-xl p-1.5 border border-slate-200">
          <label class="text-xs font-bold text-slate-600 px-1"><i class="fa-regular fa-calendar-check text-indigo-500"></i> 月份：</label>
          <input type="month" id="month-picker" value="2026-09" onchange="onMonthOrRuleChange()" class="bg-white text-sm font-bold text-slate-700 px-2 py-1 rounded-lg border border-slate-300 outline-none">
        </div>

        <!-- 輪班模式選擇 -->
        <div class="flex items-center bg-slate-50 rounded-xl p-1.5 border border-slate-200">
          <label class="text-xs font-bold text-slate-600 px-1"><i class="fa-solid fa-sliders text-indigo-500"></i> 預設輪班：</label>
          <select id="schedule-algorithm" onchange="toggleRuleInputsVisibility()" class="bg-white text-xs font-bold text-slate-700 px-2 py-1 rounded-lg border border-slate-300 outline-none">
            <option value="CUSTOM_DAYS">自訂班別天數輪播 (依下方天數)</option>
            <option value="TWO_TWO">做二休二 (2早 2休 2晚 2休)</option>
            <option value="FOUR_TWO">做四休二 (4早 2休 4中 2休 4晚 2休)</option>
            <option value="WEEKEND_OFF">週休二日常日班 (一~五早班，六日休)</option>
            <option value="FIXED_EARLY">全月固定早班</option>
          </select>
        </div>

        <!-- 天數設定列 -->
        <div id="rule-inputs-container" class="flex items-center bg-indigo-50/80 rounded-xl p-2 border border-indigo-200 shadow-sm gap-2">
          <span class="text-xs font-black text-indigo-900 flex items-center gap-1">
            <i class="fa-solid fa-rotate text-indigo-600"></i> 天數：
          </span>

          <div class="flex items-center bg-white px-2 py-1 rounded-lg border border-emerald-300 shadow-sm">
            <span class="text-sm font-black text-emerald-700">早</span>
            <input type="number" id="early-work-input" min="0" max="10" value="2" onchange="onMonthOrRuleChange()" class="w-9 text-center text-sm font-black text-emerald-800 bg-emerald-50/50 rounded mx-1 border border-emerald-200 outline-none">
            <span class="text-xs font-bold text-slate-500">休</span>
            <input type="number" id="early-off-input" min="0" max="10" value="1" onchange="onMonthOrRuleChange()" class="w-9 text-center text-sm font-black text-slate-700 bg-slate-100 rounded mx-1 border border-slate-300 outline-none">
          </div>

          <div class="flex items-center bg-white px-2 py-1 rounded-lg border border-amber-300 shadow-sm">
            <span class="text-sm font-black text-amber-700">中</span>
            <input type="number" id="mid-work-input" min="0" max="10" value="2" onchange="onMonthOrRuleChange()" class="w-9 text-center text-sm font-black text-amber-800 bg-amber-50/50 rounded mx-1 border border-amber-200 outline-none">
            <span class="text-xs font-bold text-slate-500">休</span>
            <input type="number" id="mid-off-input" min="0" max="10" value="1" onchange="onMonthOrRuleChange()" class="w-9 text-center text-sm font-black text-slate-700 bg-slate-100 rounded mx-1 border border-slate-300 outline-none">
          </div>

          <div class="flex items-center bg-white px-2 py-1 rounded-lg border border-purple-300 shadow-sm">
            <span class="text-sm font-black text-purple-700">晚</span>
            <input type="number" id="night-work-input" min="0" max="10" value="0" onchange="onMonthOrRuleChange()" class="w-9 text-center text-sm font-black text-purple-800 bg-purple-50/50 rounded mx-1 border border-purple-200 outline-none">
            <span class="text-xs font-bold text-slate-500">休</span>
            <input type="number" id="night-off-input" min="0" max="10" value="0" onchange="onMonthOrRuleChange()" class="w-9 text-center text-sm font-black text-slate-700 bg-slate-100 rounded mx-1 border border-slate-300 outline-none">
          </div>
        </div>

        <label class="px-3 py-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition flex items-center gap-1.5 border border-slate-300 cursor-pointer">
          <i class="fa-solid fa-file-import text-emerald-600"></i> 匯入 Excel
          <input type="file" id="excel-import-input" accept=".xlsx, .xls, .csv" onchange="importExcelEmployees(event)" class="hidden">
        </label>

        <button onclick="exportScheduleToExcel()" class="px-3 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-excel"></i> 匯出班表
        </button>

        <button onclick="resetToDefaultData()" class="px-3 py-2 text-sm bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl border border-rose-200 transition" title="清除本機儲存並恢復預設">
          <i class="fa-solid fa-rotate-right"></i> 重設資料
        </button>
      </div>

    </div>
  </header>

  <!-- 2. 圖例與統計列 -->
  <div class="max-w-[1920px] mx-auto w-full px-6 pt-4 pb-2 no-print">
    <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-wrap justify-between items-center text-xs gap-3">
      <div class="flex items-center space-x-2 font-bold text-slate-700">
        <i class="fa-solid fa-circle-info text-indigo-500"></i>
        <span>班別與假別說明：</span>
      </div>
      <div class="flex flex-wrap items-center gap-2 font-semibold">
        <span class="px-2 py-1 rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300"><b>早</b>：早班</span>
        <span class="px-2 py-1 rounded-md bg-amber-100 text-amber-800 border border-amber-300"><b>中</b>：中班</span>
        <span class="px-2 py-1 rounded-md bg-purple-100 text-purple-800 border border-purple-300"><b>晚</b>：晚班</span>
        <span class="px-2 py-1 rounded-md bg-slate-200 text-slate-600 border border-slate-300"><b>休</b>：例休</span>
        <span class="px-2 py-1 rounded-md bg-rose-100 text-rose-800 border border-rose-300"><b>特/事/病/公/喪</b>：各類假別</span>
        <span class="px-2 py-1 rounded-md bg-red-100 text-red-700 border border-red-300 font-bold"><i class="fa-solid fa-flag"></i> 紅字：國定假日</span>
      </div>
      <div id="overall-summary-badge" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-bold">
        載入中...
      </div>
    </div>
  </div>

  <!-- 3. 主頁籤選單 -->
  <div class="max-w-[1920px] mx-auto w-full px-6 pt-2 no-print">
    <div id="main-role-tabs-container" class="flex flex-wrap items-center gap-2 border-b border-slate-300 pb-2">
      <!-- 動態生成 -->
    </div>
  </div>

  <!-- 4. 主要顯示區 -->
  <main class="max-w-[1920px] mx-auto w-full px-6 py-4 flex-1" id="app-main-container">
    <!-- 動態內容 -->
  </main>

  <!-- 5. 模態框：新增 / 編輯員工 -->
  <div id="employee-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-6">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800">新增員工資料</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="employee-form" onsubmit="saveEmployee(event)" class="mt-4 space-y-3 text-sm">
        <input type="hidden" id="emp-edit-original-id">
        <div>
          <label class="block font-bold text-slate-700 mb-1">工號 / 考勤號</label>
          <input type="text" id="emp-id-input" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">員工姓名</label>
          <input type="text" id="emp-name-input" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">所屬單位 / 職稱</label>
          <select id="emp-role-input" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="領班">領班</option>
            <option value="指揮手">指揮手</option>
            <option value="AQC" selected>AQC</option>
            <option value="ARMG">ARMG</option>
            <option value="F/L">F/L</option>
            <option value="課長">課長</option>
            <option value="主任">主任</option>
            <option value="副理">副理</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">組別</label>
          <select id="emp-group-input" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
            <!-- 動態插入 -->
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">排班屬性 (支援固定人員鎖定)</label>
          <select id="emp-lock-input" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="ROTATION" selected>參與自動輪班</option>
            <option value="FIXED_LOCKED" class="font-bold text-purple-700">🔒 固定人員 / 鎖定不參與自動輪班</option>
          </select>
        </div>
        <div class="pt-4 flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg">取消</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md">儲存員工</button>
        </div>
      </form>
    </div>
  </div>

    function loadDataFromLocalStorage() {
      const savedEmps = localStorage.getItem('port_schedule_employees_v3');
      const savedGroups = localStorage.getItem('port_schedule_groups_v3');
      const savedSched = localStorage.getItem('port_schedule_data_v3');

      if (savedEmps) {
        try { employees = JSON.parse(savedEmps); } catch(e) { employees = [...DEFAULT_EMPLOYEES]; }
      } else {
        employees = [...DEFAULT_EMPLOYEES];
      }

      if (savedGroups) {
        try { availableGroups = JSON.parse(savedGroups); } catch(e) { availableGroups = ['不分組', '不輪班']; }
      } else {
        availableGroups = ['不分組', '不輪班'];
      }

      if (savedSched) {
        try { monthlyScheduleData = JSON.parse(savedSched); } catch(e) { monthlyScheduleData = {}; }
      } else {
        monthlyScheduleData = {};
      }
    }

    function calculateShiftForDay(emp, empIndexInRole, dayNum, dayOfWeek) {
      if (emp.lockType === 'FIXED_LOCKED') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }
      if (emp.group === '不輪班') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }

      const algo = document.getElementById('schedule-algorithm').value;
      if (algo === 'WEEKEND_OFF') return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      if (algo === 'FIXED_EARLY') return '早';

      const offset = empIndexInRole * 2; 

      if (algo === 'TWO_TWO') {
        const cycle = ['早', '早', '休', '休', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      if (algo === 'FOUR_TWO') {
        const cycle = ['早', '早', '早', '早', '休', '休', '中', '中', '中', '中', '休', '休', '晚', '晚', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      const ew = parseInt(document.getElementById('early-work-input').value) || 0;
      const eo = parseInt(document.getElementById('early-off-input').value) || 0;
      const mw = parseInt(document.getElementById('mid-work-input').value) || 0;
      const mo = parseInt(document.getElementById('mid-off-input').value) || 0;
      const nw = parseInt(document.getElementById('night-work-input').value) || 0;
      const no = parseInt(document.getElementById('night-off-input').value) || 0;

      const cycleLength = ew + eo + mw + mo + nw + no;
      if (cycleLength === 0) return '休';

      const pos = (dayNum - 1 + offset) % cycleLength;

      const p1 = ew;
      const p2 = p1 + eo;
      const p3 = p2 + mw;
      const p4 = p3 + mo;
      const p5 = p4 + nw;

      if (pos < p1) return '早';
      if (pos < p2) return '休';
      if (pos < p3) return '中';
      if (pos < p4) return '休';
      if (pos < p5) return '晚';
      return '休';
    }

    function initDefaultScheduleData(yearMonth) {
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = employees.filter(e => e.role === roleName);
        roleEmps.forEach((emp, idx) => {
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            // 如果該天沒有值才自動計算，保留手動調整過或請假的班別
            if(!monthlyScheduleData[emp.id][dayStr]) {
              monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
            }
          }
        });
      });
      saveAllDataToLocalStorage();
    }

        const roleEmps = employees.filter(e => e.role === emp.role);
        roleEmps.forEach((eObj, idx) => {

          for(let d = 1; d <= totalDays; d++) {

      filteredEmps.sort((a, b) => {
        let comp = 0;
        if (mgmtSortKey === 'id') {
          comp = a.id.localeCompare(b.id);
        } else if (mgmtSortKey === 'name') {
          comp = a.name.localeCompare(b.name, 'zh-Hant');
        } else if (mgmtSortKey === 'role') {
          comp = getRolePriority(a.role) - getRolePriority(b.role);

          if (rDiff !== 0) return rDiff;
          const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
          if (gDiff !== 0) return gDiff;
          return a.id.localeCompare(b.id);

    function updateEmpLockType(empId, lockVal) {
      const emp = employees.find(e => e.id === empId);
      if(emp) {

      }
    }

    function updateDailyShift(empId, dayStr, val) {
      if(!monthlyScheduleData[empId]) monthlyScheduleData[empId] = {};
      monthlyScheduleData[empId][dayStr] = val;
      saveAllDataToLocalStorage();
      renderRoleScheduleView();
    }

    function autoScheduleCurrentTab() {
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = employees.filter(e => e.role === roleName);
        roleEmps.forEach((emp, idx) => {
          if (emp.lockType === 'FIXED_LOCKED') return;
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
          }
        });
      });

      saveAllDataToLocalStorage();
      renderRoleScheduleView();
      alert(`✨ 已完成智慧錯開排班並自動儲存！`);
    }

      document.getElementById('modal-title').innerText = "新增員工資料";

      document.getElementById('emp-id-input').value = "";
      document.getElementById('emp-name-input').value = "";
      document.getElementById('emp-role-input').value = "AQC";
      document.getElementById('emp-lock-input').value = "ROTATION";

      groupSelect.innerHTML = getGroupOptionsHtml('不分組');

    function openEditModal(empId) {
      const emp = employees.find(e => e.id === empId);

      document.getElementById('modal-title').innerText = "編輯員工資料";
      document.getElementById('emp-edit-original-id').value = emp.id;
      document.getElementById('emp-id-input').value = emp.id;
      document.getElementById('emp-name-input').value = emp.name;
      document.getElementById('emp-role-input').value = emp.role;
      document.getElementById('emp-lock-input').value = emp.lockType || 'ROTATION';
      
      const groupSelect = document.getElementById('emp-group-input');
      groupSelect.innerHTML = getGroupOptionsHtml(emp.group || '不分組');

    function closeModal() {
      document.getElementById('employee-modal').classList.add('hidden');
    }

    function saveEmployee(e) {
      e.preventDefault();
      const origId = document.getElementById('emp-edit-original-id').value;
      const id = document.getElementById('emp-id-input').value.trim();
      const name = document.getElementById('emp-name-input').value.trim();
      const role = document.getElementById('emp-role-input').value;
      const group = document.getElementById('emp-group-input').value;
      const lockType = document.getElementById('emp-lock-input').value;

      if(origId) {
        const emp = employees.find(e => e.id === origId);
        if(emp) {
          emp.id = id;
          emp.name = name;
          emp.role = role;
          emp.group = group;
          emp.lockType = lockType;
        }
      } else {
        if(employees.some(e => e.id === id)) {
          alert("工號已存在！");
          return;
        }
        employees.push({ id, name, role, group, lockType });
        const yearMonth = document.getElementById('month-picker').value;
        initDefaultScheduleData(yearMonth);
      }

      saveAllDataToLocalStorage();
      closeModal();
      buildRoleTabsAndRender();
      alert("✅ 已成功儲存員工資料！");
    }

    function deleteEmployee(empId) {
      if(confirm(`確定要刪除員工 [${empId}] 嗎？`)) {
        employees = employees.filter(e => e.id !== empId);
        saveAllDataToLocalStorage();
        buildRoleTabsAndRender();
      }
    }

    function importExcelEmployees(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(worksheet);

          if(json.length === 0) {
            alert("匯入失敗：檔案無資料！");
            return;
          }

          employees = [];
          json.forEach((row, idx) => {
            const name = String(row['姓名'] || row['員工姓名'] || `員工${idx+1}`);
            const role = String(row['職務'] || row['職稱'] || 'AQC');
            const group = String(row['組別'] || row['班組'] || `不分組`);
            const id = String(row['工號'] || row['考勤號'] || `E${idx+1}`);
            const lockType = String(row['鎖定'] || '').includes('固定') ? 'FIXED_LOCKED' : 'ROTATION';

            let mappedRole = role;
            if(role.includes('領班')) mappedRole = '領班';
            else if(role.includes('指揮')) mappedRole = '指揮手';
            else if(role.includes('AQC')) mappedRole = 'AQC';
            else if(role.includes('ARMG')) mappedRole = 'ARMG';
            else if(role.includes('F/L') || role.includes('FL')) mappedRole = 'F/L';

            employees.push({ id: id, name: name, role: mappedRole, group: group, lockType: lockType });
          });

          const yearMonth = document.getElementById('month-picker').value;
          initDefaultScheduleData(yearMonth);
          saveAllDataToLocalStorage();
          buildRoleTabsAndRender();
          alert(`🎉 成功匯入 ${employees.length} 位人員資料並儲存！`);
        } catch(err) {
          console.error(err);
          alert("讀取 Excel 失敗！");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function exportScheduleToExcel() {
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      const sortedEmps = [...employees].sort((a, b) => {
        const rDiff = getRolePriority(a.role) - getRolePriority(b.role);
        if (rDiff !== 0) return rDiff;
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return a.id.localeCompare(b.id);
      });

      const exportRows = [];
      sortedEmps.forEach(emp => {
        const row = {
          '工號': emp.id,
          '姓名': emp.name,
          '職稱': emp.role,
          '組別': emp.group,
          '排班屬性': emp.lockType === 'FIXED_LOCKED' ? '固定鎖定' : '自動輪班'
        };

        for(let d = 1; d <= totalDays; d++) {
          const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
          row[`${d}日`] = (monthlyScheduleData[emp.id] && monthlyScheduleData[emp.id][dayStr]) || '休';
        }

        exportRows.push(row);
      });

      const ws = XLSX.utils.json_to_sheet(exportRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${yearMonth}全廠班表`);
      XLSX.writeFile(wb, `${yearMonth}_全月排班表.xlsx`);
    }
  </script>
</body>
