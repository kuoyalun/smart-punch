    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';

    function getScheduleGasUrl(){
      try{
        const hash=String(location.hash||'').replace(/^#/,'');
        const params=new URLSearchParams(hash);
        const fromHash=String(params.get('gasurl')||'').trim();
        if(/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/i.test(fromHash)){
          sessionStorage.setItem('port79_gas_url',fromHash);
          return fromHash;
        }
      }catch(e){}
      return String(sessionStorage.getItem('port79_gas_url')||DEFAULT_GAS_URL).trim();
    }

    const GAS_URL = getScheduleGasUrl();

    let scheduleAccessLevel = 'none';
    let lastScheduleCloudError = '';

    function normalizeSchedulePermissionLevel(value, fallback='none') {
      const text = String(value ?? '').toLowerCase();
      return ['none','view','manage'].includes(text) ? text : fallback;
    }

    function getSchedulePermissionFromData(data) {
      const role = String(data?.adminRole || '').toLowerCase();
      if (role === 'superadmin') return 'manage';
      return normalizeSchedulePermissionLevel(data?.systemPermissions?.schedule, 'none');
    }

    function canManageSchedule() {
      return scheduleAccessLevel === 'manage';
    }

    const SCHEDULE_LOCK_HEARTBEAT_MS = 12000;
    const SCHEDULE_LOCK_FETCH_TIMEOUT_MS = 6500;
    let scheduleEditLockTimer = null;
    let scheduleLockLastError = '';
    let scheduleEditLockState = { locked:false, mine:false, ownerName:'', ownerEmpId:'', expiresAt:0 };

    function getScheduleClientId() {
      let id = String(sessionStorage.getItem('port79_schedule_client_id') || '').trim();
      if (!id) {
        try { id = crypto.randomUUID(); }
        catch (e) { id = 'SCH-' + Date.now() + '-' + Math.random().toString(36).slice(2,10); }
        sessionStorage.setItem('port79_schedule_client_id', id);
      }
      return id;
    }

    function currentScheduleSession() {
      try { return JSON.parse(sessionStorage.getItem('admin_session') || 'null') || {}; }
      catch (e) { return {}; }
    }

    function scheduleCanEditNow() {
      return canManageSchedule() && !!scheduleEditLockState.mine;

    function scheduleLockOwnerLabel() {
      const name = String(scheduleEditLockState.ownerName || '').trim();
      const empId = String(scheduleEditLockState.ownerEmpId || '').trim();
      return name ? `${name}${empId ? `（${empId}）` : ''}` : (empId || '其他人員');

    function requireScheduleEditLock(showAlert=true) {
      if (scheduleCanEditNow()) return true;
      let message = '目前不可修改排班。';
      if (!canManageSchedule()) message = '此帳號只有排班查看權限，不能修改班表。';
      else if (scheduleEditLockState.locked && !scheduleEditLockState.mine) message = `目前由 ${scheduleLockOwnerLabel()} 正在更改班表，為避免多人同時修改造成錯亂，已禁止修改。`;
      else message = '尚未取得排班編輯權，正在等待雲端編輯鎖。';
      if (showAlert) alert('🔒 ' + message);

    function updateScheduleLockBadge() {
      const el = document.getElementById('scheduleEditLockStatus');
      if (!el) return;

      } else if (scheduleEditLockState.mine) {
        const me = currentScheduleSession();
        const who = String(me.name || scheduleEditLockState.ownerName || me.empId || '目前帳號');
        el.className = 'px-3 py-2 rounded-xl border border-emerald-200 dark:border-emerald-900 bg-emerald-50 dark:bg-emerald-950/30 text-xs font-black text-emerald-700 dark:text-emerald-300';
        el.innerHTML = `<i class="fa-solid fa-pen-to-square mr-1"></i> ${scheduleEscapeHtml(who)} 正在編輯｜其他人已禁止修改`;

        el.innerHTML = `<i class="fa-solid fa-lock mr-1"></i> 禁止修改｜${scheduleEscapeHtml(scheduleLockOwnerLabel())} 正在更改班表`;

          : '<i class="fa-solid fa-clock mr-1"></i> 正在取得編輯權...';
      }
    }

    function setScheduleEditLockState(data) {
      const previousMine = !!scheduleEditLockState.mine;
      scheduleEditLockState = {
        locked: !!data?.locked,
        mine: !!data?.mine || !!data?.acquired,
        ownerName: String(data?.ownerName || ''),
        ownerEmpId: String(data?.ownerEmpId || ''),
        expiresAt: Number(data?.expiresAt || 0)
      };
      updateScheduleLockBadge();
      applyScheduleAccessUi();
      if (previousMine && !scheduleEditLockState.mine) {
        try { closeSubstituteAssignment(); } catch(e) {}
      }
    }

    async function scheduleLockFetch(url, options = {}, timeoutMs = SCHEDULE_LOCK_FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
      } catch (e) {
        if (e && e.name === 'AbortError') throw new Error('雲端編輯鎖連線逾時，系統會自動重試');
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    async function scheduleLockGet() {
      const token = currentPort79SsoToken();
      const url = GAS_URL + '?action=scheduleGetEditLock&gcToken=' + encodeURIComponent(token) + '&scheduleClientId=' + encodeURIComponent(getScheduleClientId()) + '&t=' + Date.now();
      const res = await scheduleLockFetch(url, { cache:'no-store', redirect:'follow' });
      return await readScheduleSsoJson(res);
    }

    async function scheduleLockPost(action, keepalive=false) {
      const token = currentPort79SsoToken();
      const payload = { action, gcToken:token, token, scheduleClientId:getScheduleClientId() };
      const res = await scheduleLockFetch(GAS_URL, { method:'POST', body:JSON.stringify(payload), redirect:'follow', keepalive:!!keepalive });
      return await readScheduleSsoJson(res);
    }

    async function refreshOrAcquireScheduleEditLock() {
      try {
        if (canManageSchedule()) {
          const action = scheduleEditLockState.mine ? 'scheduleHeartbeatEditLock' : 'scheduleAcquireEditLock';
          const data = await scheduleLockPost(action);
          scheduleLockLastError = '';
          setScheduleEditLockState(data);
          if (!scheduleEditLockState.mine && !scheduleEditLockState.locked) {
            const status = await scheduleLockGet();
            scheduleLockLastError = '';
            setScheduleEditLockState(status);
          }
        } else {
          const data = await scheduleLockGet();
          scheduleLockLastError = '';
          setScheduleEditLockState(data);
        }
      } catch (e) {
        scheduleLockLastError = String(e?.message || e || '編輯鎖連線失敗');
        console.warn('排班編輯鎖同步失敗：', e);
        if (scheduleEditLockState.mine) scheduleEditLockState.mine = false;
        updateScheduleLockBadge();
        applyScheduleAccessUi();
      }
    }

    async function initializeScheduleEditLock() {
      await refreshOrAcquireScheduleEditLock();
      if (scheduleEditLockTimer) clearInterval(scheduleEditLockTimer);
      scheduleEditLockTimer = setInterval(refreshOrAcquireScheduleEditLock, SCHEDULE_LOCK_HEARTBEAT_MS);
    }

    async function releaseScheduleEditLock(keepalive=false) {
      if (!scheduleEditLockState.mine) return;
      try { await scheduleLockPost('scheduleReleaseEditLock', keepalive); } catch(e) {
        console.warn('釋放排班編輯鎖失敗，下一次同帳號登入會自動接管：', e);
      }
      scheduleLockLastError = '';
      scheduleEditLockState.mine = false;
      scheduleEditLockState.locked = false;
      updateScheduleLockBadge();
    }

    function readPort79SsoTokenFromHash() {
      try {
        const hash = String(location.hash || '').replace(/^#/, '');
        const params = new URLSearchParams(hash);
        return String(params.get('port79sso') || '').trim();
      } catch (e) {
        return '';
      }
    }

    function clearPort79SsoHash() {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }

    function currentPort79SsoToken() {
      return String(
        readPort79SsoTokenFromHash() ||
        sessionStorage.getItem('port79_gc_superadmin_token') ||
        sessionStorage.getItem('port79_admin_token') ||
        sessionStorage.getItem('port79_gc_token') ||
        ''
      ).trim();
    }

    function hasLocalScheduleSession() {
      let session = null;
      try { session = JSON.parse(sessionStorage.getItem('admin_session') || 'null'); } catch (e) {}
      const role = String(session?.adminRole || sessionStorage.getItem('aqc_admin_role') || '').toLowerCase();
      const level = role === 'superadmin'
        ? 'manage'
        : normalizeSchedulePermissionLevel(session?.systemPermissions?.schedule, 'none');
      return ['admin','superadmin'].includes(role) && level !== 'none' && !!currentPort79SsoToken();
    }

      if (message) { try { sessionStorage.setItem('port79_return_message', message); } catch (e) {} }
      location.replace(`../?v=${PORT79_BUILD_VERSION}`);

    async function readScheduleSsoJson(response) {
      const raw = await response.text();
      const text = String(raw || '').replace(/^\uFEFF/, '').trim();
      if (!response.ok) throw new Error(`SSO HTTP ${response.status}`);
      if (!text) throw new Error('SSO 驗證回傳空白內容');
      if (/^<!doctype html|^<html/i.test(text)) throw new Error('SSO 驗證回傳 Google HTML，不是 JSON');
      try { return JSON.parse(text); } catch (e) { throw new Error('SSO 驗證未收到有效 JSON'); }
    }

    async function verifyScheduleSsoToken(token) {
      let lastError = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), 12000) : null;
        try {
          const res = await fetch(
            GAS_URL + '?action=gcGetSyncMeta&gcToken=' + encodeURIComponent(token) + '&t=' + Date.now(),
            { cache:'no-store', redirect:'follow', signal: controller?.signal }
          );
          const data = await readScheduleSsoJson(res);
          const role = String(data?.adminRole || '').toLowerCase();
          const access = getSchedulePermissionFromData(data);
          if (!data?.ok || !['admin','superadmin'].includes(role) || access === 'none') {
            const authError = new Error(data?.error || '此帳號沒有排班系統權限');
            authError.ssoAuthRejected = true;
            throw authError;
          }
          data.scheduleAccessLevel = access;
          return data;
        } catch (e) {
          lastError = e;
          if (e?.ssoAuthRejected) break;
          if (attempt < 3) await new Promise(r => setTimeout(r, 450 * attempt));
        } finally {
          if (timer) clearTimeout(timer);
        }
      }
      throw lastError || new Error('SSO 驗證失敗');
    }

    async function consumePort79SsoHandoff() {
      const token = currentPort79SsoToken();
      if (!token) return false;

      try {
        const data = await verifyScheduleSsoToken(token);
        const empId = String(data.empId || '').trim().toUpperCase();
        const name = String(data.name || '');
        const role = String(data.adminRole || 'admin').toLowerCase();
        scheduleAccessLevel = data.scheduleAccessLevel || getSchedulePermissionFromData(data);
        const systemPermissions = data.systemPermissions || { schedule: scheduleAccessLevel };

        sessionStorage.setItem('admin_session', JSON.stringify({
          empId, name, adminRole:role, systemPermissions, loginAt:new Date().toISOString(), sso:true
        }));
        sessionStorage.setItem('aqc_admin_logged_in','1');
        sessionStorage.setItem('aqc_admin_id',empId);
        sessionStorage.setItem('aqc_admin_role',role);
        sessionStorage.setItem('aqc_admin_name',name);
        sessionStorage.setItem('port79_admin_token',token);
        sessionStorage.setItem('port79_gc_token',token);
        if (role === 'superadmin') sessionStorage.setItem('port79_gc_superadmin_token',token);
        else sessionStorage.removeItem('port79_gc_superadmin_token');
        sessionStorage.setItem('port79_sso_verified','1');
        sessionStorage.setItem('port79_gas_url',GAS_URL);
        clearPort79SsoHash();
        return true;
      } catch (e) {
        console.error('PORT79 Schedule SSO failed:', e);
        const fallback = !e?.ssoAuthRejected &&
          sessionStorage.getItem('port79_sso_verified') === '1' &&
          hasLocalScheduleSession();
        clearPort79SsoHash();
        if (fallback) return true;
        return false;
      }
    }

    async function loadScheduleCloudWithRetry(reason='auto', retryCount=3) {
      if (!isGasUrlConfigured()) return false;
      if (port79ScheduleAutoSyncBusy) return false;

      // 使用者剛修改排班時，先讓既有 900ms 自動儲存完成，避免拉資料蓋到尚未送出的修改。
      if (scheduleSaveTimer || personnelSaveTimer) {
        await new Promise(r => setTimeout(r, 1300));
      }

      const now = Date.now();
      if (reason !== 'login' && now - port79ScheduleLastAutoSyncAt < 8000) return true;

      port79ScheduleAutoSyncBusy = true;
      try {
        for (let attempt=1; attempt<=retryCount; attempt++) {
          const ok = await loadCloudData(false);
          if (ok) {
            port79ScheduleLastAutoSyncAt = Date.now();
            const yearMonth = document.getElementById('month-picker')?.value;
            if (yearMonth) initDefaultScheduleData(yearMonth, false);
            try { buildRoleTabsAndRender(); } catch(ignore) {}
            return true;
          }
          if (attempt < retryCount) {
            await new Promise(r => setTimeout(r, attempt * 1200));
          }
        }
        return false;
      } finally {
        port79ScheduleAutoSyncBusy = false;
      }
    }

    function startScheduleFullAutoSync() {

      port79ScheduleAutoSyncTimer = setInterval(() => {

        }
      }, 60000);

      window.addEventListener('online', () => {
        setTimeout(() => loadScheduleCloudWithRetry('online', 3), 300);
      });
      window.addEventListener('focus', () => {
        setTimeout(() => loadScheduleCloudWithRetry('focus', 2), 300);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          setTimeout(() => loadScheduleCloudWithRetry('visible', 2), 300);
        }
      });

    async function cloudPost(payload) {
      if (!isGasUrlConfigured()) throw new Error('尚未設定 GAS_URL。');
      const action = String(payload?.action || '');
      if (['saveScheduleEmployee','upsertScheduleEmployee','syncScheduleEmployees'].includes(action)) {
        throw new Error('人員主檔已統一由「考勤系統 → 員工清單管理」維護，排班系統不再新增／修改員工基本資料。');
      }
      if (!canManageSchedule()) {
        throw new Error('此帳號只有排班查看權限，不能儲存或修改排班。');
      }
      const scheduleWriteActions = ['syncSchedules','saveSchedules','saveScheduleMonth','saveScheduleGroups'];
      if (scheduleWriteActions.includes(action) && !requireScheduleEditLock(false)) {
        throw new Error(scheduleEditLockState.locked && !scheduleEditLockState.mine
          ? `目前由 ${scheduleLockOwnerLabel()} 正在更改班表，禁止同步修改`
          : '尚未取得排班編輯權，禁止同步修改');
      }
      if (scheduleWriteActions.includes(action)) payload.scheduleClientId = getScheduleClientId();
      const token = currentPort79SsoToken();
      if (token) { payload.gcToken = token; payload.token = token; }
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error('Google 雲端回傳格式錯誤：' + text.slice(0, 150)); }
      if (!data.ok) throw new Error(data.error || data.message || 'Google 雲端操作失敗');
      return data;
    }

    function cloneScheduleEmployee(emp) {
      return {
        id: String(emp?.id || '').trim().toUpperCase(),
        name: String(emp?.name || ''),
        role: String(emp?.role || 'AQC'),
        group: String(emp?.group || '不分組'),
        lockType: String(emp?.lockType || 'ROTATION')
      };
    }

    function currentScheduleMonthKey() {
      return String(document.getElementById('month-picker')?.value || '').trim();
    }

    function savePersonnelOverrideForCurrentMonth(emp) {
      const month = currentScheduleMonthKey();
      const id = String(emp?.id || '').trim().toUpperCase();
      if (!month || !id) return;
      if (!schedulePersonnelOverrides[month]) schedulePersonnelOverrides[month] = {};
      schedulePersonnelOverrides[month][id] = {
        role: String(emp.role || 'AQC'),
        group: String(emp.group || '不分組'),
        lockType: String(emp.lockType || 'ROTATION')
      };
    }

    function applySchedulePersonnelOverrides(yearMonth) {
      const month = String(yearMonth || currentScheduleMonthKey()).trim();
      const base = (employeeMasterBase.length ? employeeMasterBase : employees).map(cloneScheduleEmployee);
      const overrides = schedulePersonnelOverrides[month] || {};
      employees = base.map(emp => {
        const ov = overrides[emp.id];
        return ov ? Object.assign(emp, {
          role: ov.role || emp.role,
          group: ov.group || emp.group,
          lockType: ov.lockType || emp.lockType
        }) : emp;
      });
    }

    async function loadCloudData(showAlert = false) {
      if (!isGasUrlConfigured()) {
        if (showAlert) alert('⚠️ 請先在 HTML 程式上方設定 GAS_URL。');
        return false;
      }
      try {
        const token = currentPort79SsoToken();
        const res = await fetch(GAS_URL + '?action=getScheduleDataSecure&gcToken=' + encodeURIComponent(token) + '&_=' + Date.now(), { redirect: 'follow', cache:'no-store' });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '讀取失敗');

        const cloudEmployees = (data.employees || [])
          .filter(emp => String(emp.empId || '').toUpperCase() !== 'ADMIN' && (emp.empId || emp.name))
          .map(emp => ({
            id: String(emp.empId || '').trim().toUpperCase(),
            name: emp.name || '',
            role: emp.jobTitle || emp.deptDetail || emp.role || emp.dept || 'AQC',
            group: emp.group || '不分組',
            lockType: emp.lockType || 'ROTATION'
          }))
          .filter(emp => emp.id);

        if (cloudEmployees.length) employeeMasterBase = cloudEmployees.map(cloneScheduleEmployee);
        else if (!employeeMasterBase.length) employeeMasterBase = employees.map(cloneScheduleEmployee);

        leaveRecords = Array.isArray(data.leaveRecords) ? data.leaveRecords : [];
        monthlyScheduleData = {};
        monthlyScheduleMeta = {};
        schedulePersonnelOverrides = {};

        (data.schedules || []).forEach(row => {
          const empId = String(row.empId || '').trim().toUpperCase();
          const month = String(row.month || '').trim();
          const schedule = row.schedule && typeof row.schedule === 'object' ? Object.assign({}, row.schedule) : {};
          if (!empId) return;

          const personnel = schedule.__personnel && typeof schedule.__personnel === 'object'
            ? Object.assign({}, schedule.__personnel)
            : {};
          if (month) {
            if (!schedulePersonnelOverrides[month]) schedulePersonnelOverrides[month] = {};
            schedulePersonnelOverrides[month][empId] = {
              role: String(personnel.role || row.role || ''),
              group: String(personnel.group || row.group || '不分組'),
              lockType: String(personnel.lockType || 'ROTATION')
            };
          }
          delete schedule.__personnel;

          if (!monthlyScheduleData[empId]) monthlyScheduleData[empId] = {};
          if (!monthlyScheduleMeta[empId]) monthlyScheduleMeta[empId] = {};
          const meta = schedule.__meta && typeof schedule.__meta === 'object' ? schedule.__meta : {};
          delete schedule.__meta;
          Object.assign(monthlyScheduleData[empId], schedule);
          Object.assign(monthlyScheduleMeta[empId], meta);
        });

        applySchedulePersonnelOverrides(currentScheduleMonthKey());

        const groupSet = new Set(['不分組']);
        (data.scheduleGroups || []).forEach(g => { if(g) groupSet.add(g); });
        employees.forEach(emp => { if(emp.group) groupSet.add(emp.group); });
        groupSet.delete('不輪班');
        availableGroups = [...groupSet, '不輪班'];

        cloudLoaded = true;
        saveAllDataToLocalStorage();
        if (showAlert) alert('✅ 已重新載入 Google 雲端最新資料！');
        return true;
      } catch (err) {
        console.error(err);
        if (showAlert) alert('❌ 無法讀取 Google 雲端：\n' + err.message + '\n\n請確認 GAS 網址、部署版本與存取權限。');
        return false;
      }
    }

    async function saveScheduleMonthToCloud(showAlert = true) {
      const yearMonth = document.getElementById('month-picker').value;
      const schedules = employees.map(emp => {
        const monthData = {};
        const allEmp = monthlyScheduleData[emp.id] || {};
        Object.keys(allEmp).forEach(dateKey => {
          if (dateKey.startsWith(yearMonth + '-')) monthData[dateKey] = allEmp[dateKey];
        });
        const allMeta = monthlyScheduleMeta[emp.id] || {};
        const monthMeta = {};
        Object.keys(allMeta).forEach(dateKey => {
          if (dateKey.startsWith(yearMonth + '-') && allMeta[dateKey] && typeof allMeta[dateKey] === 'object') {
            monthMeta[dateKey] = allMeta[dateKey];
          }
        });
        if (Object.keys(monthMeta).length) monthData.__meta = monthMeta;
        monthData.__personnel = {
          role: emp.role || 'AQC',
          group: emp.group || '不分組',
          lockType: emp.lockType || 'ROTATION'
        };
        savePersonnelOverrideForCurrentMonth(emp);
        return { empId: emp.id, name: emp.name, role: emp.role, group: emp.group, month: yearMonth, schedule: monthData };
      });
      try {
        const result = await cloudPost({ action: 'syncSchedules', month: yearMonth, schedules });
        saveAllDataToLocalStorage();
        if (showAlert) alert(`☁️ ${result.message || '排班已同步 Google 雲端'}`);
        return true;
      } catch (err) {
        lastScheduleCloudError = String(err?.message || err || '未知錯誤');
        console.error('排班雲端儲存失敗：', err);
        if (showAlert) alert('❌ 排班雲端儲存失敗：\n' + lastScheduleCloudError);
        return false;
      }
    }

    async function saveScheduleEmployeesToCloud(showAlert = true) {
      try {
        employees.forEach(savePersonnelOverrideForCurrentMonth);
        const scheduleOk = await saveScheduleMonthToCloud(false);
        if (!scheduleOk) throw new Error(lastScheduleCloudError || '排班資料儲存失敗');
        await cloudPost({ action: 'saveScheduleGroups', groups: availableGroups });
        saveAllDataToLocalStorage();

    async function resetToDefaultData() {
      if (!requireScheduleEditLock()) return;
      const yearMonth = document.getElementById('month-picker').value;

      const confirmed = confirm(
        `⚠️ 確定要重設 ${yearMonth} 的排班資料嗎？\n\n` +
        `這會依照目前畫面上的輪班規則重新產生整個月份，\n` +
        `並直接覆蓋 Google 雲端「排班資料」中 ${yearMonth} 的班表。\n\n` +
        `員工清單、考勤紀錄、請假紀錄都不會被刪除。`
      );

      if (!confirmed) return;

      try {
        const [year, month] = yearMonth.split('-').map(Number);
        const totalDays = getDaysInMonth(year, month);

        employees.forEach(emp => {
          if (!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};

          Object.keys(monthlyScheduleData[emp.id]).forEach(dateKey => {
            if (dateKey.startsWith(yearMonth + '-')) {
              delete monthlyScheduleData[emp.id][dateKey];
            }
          });
        });

        MAIN_ROLES.forEach(roleName => {
          const roleEmps = employees.filter(e => e.role === roleName);

          roleEmps.forEach((emp, idx) => {
            if (!monthlyScheduleData[emp.id]) {
              monthlyScheduleData[emp.id] = {};
            }

            for (let d = 1; d <= totalDays; d++) {
              const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
              const dateObj = new Date(year, month - 1, d);

              monthlyScheduleData[emp.id][dayStr] =
                calculateShiftForDay(emp, idx, d, dateObj.getDay());
            }
          });
        });

        const cloudOk = await saveScheduleMonthToCloud(false);

        if (!cloudOk) {
          throw new Error('Google 雲端寫入失敗');
        }

        buildRoleTabsAndRender();

        alert(
          `☁️ ${yearMonth} 排班已重設完成！\n\n` +
          `新的班表已同步到 Google 雲端。`
        );

      } catch (err) {
        console.error(err);
        alert(
          '❌ 重設雲端排班失敗：\n' +
          (err && err.message ? err.message : err)
        );
      }
    }

    function calculateShiftForDay(emp, empIndexInRole, dayNum, dayOfWeek) {
      if (emp.lockType === 'FIXED_LOCKED') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }
      if (emp.group === '不輪班') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }

      const algo = document.getElementById('schedule-algorithm').value;
      if (algo === 'WEEKEND_OFF') return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      if (algo === 'FIXED_EARLY') return '早';

      const offset = empIndexInRole * 2; 

      if (algo === 'TWO_TWO') {
        const cycle = ['早', '早', '休', '休', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      if (algo === 'FOUR_TWO') {
        const cycle = ['早', '早', '早', '早', '休', '休', '中', '中', '中', '中', '休', '休', '晚', '晚', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      const ew = parseInt(document.getElementById('early-work-input').value) || 0;
      const eo = parseInt(document.getElementById('early-off-input').value) || 0;
      const mw = parseInt(document.getElementById('mid-work-input').value) || 0;
      const mo = parseInt(document.getElementById('mid-off-input').value) || 0;
      const nw = parseInt(document.getElementById('night-work-input').value) || 0;
      const no = parseInt(document.getElementById('night-off-input').value) || 0;

      const cycleLength = ew + eo + mw + mo + nw + no;
      if (cycleLength === 0) return '休';

      const pos = (dayNum - 1 + offset) % cycleLength;

      const p1 = ew;
      const p2 = p1 + eo;
      const p3 = p2 + mw;
      const p4 = p3 + mo;
      const p5 = p4 + nw;

      if (pos < p1) return '早';
      if (pos < p2) return '休';
      if (pos < p3) return '中';
      if (pos < p4) return '休';
      if (pos < p5) return '晚';
      return '休';
    }

          for(let d = 1; d <= totalDays; d++) {

            }
          }
        });
      });

    }

    function scheduleEscapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function normalizeScheduleDate(value) {
      const s = String(value || '').trim();
      const m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';
    }

    function approvedLeaveRecordsOnDate(dayStr) {
      return (leaveRecords || []).filter(item => {
        if (String(item?.status || '') !== '已核准') return false;
        const start = normalizeScheduleDate(item?.startTime || item?.startDate);
        const end = normalizeScheduleDate(item?.endTime || item?.endDate);
        return !!start && !!end && dayStr >= start && dayStr <= end;
      });
    }

    function approvedLeaveForEmployee(empId, dayStr) {
      const id = String(empId || '').trim().toUpperCase();
      return approvedLeaveRecordsOnDate(dayStr).find(item => String(item?.empId || '').trim().toUpperCase() === id) || null;
    }

    function getScheduleDayMeta(empId, dayStr) {
      const id = String(empId || '').trim().toUpperCase();
      const meta = monthlyScheduleMeta[id] && monthlyScheduleMeta[id][dayStr];
      return meta && typeof meta === 'object' ? meta : null;
    }

    function openSubstituteAssignment(empId, dayStr) {
      if (!requireScheduleEditLock()) return;
      if (!canManageSchedule()) { alert('此帳號只有排班查看權限。'); return; }
      ensureSubstituteModal();
      const emp = employees.find(e => e.id === empId);
      if (!emp) return;
      const modal = document.getElementById('substitute-assignment-modal');
      const existing = getScheduleDayMeta(empId, dayStr) || {};
      const leaves = approvedLeaveRecordsOnDate(dayStr);
      const byId = new Map(employees.map(e => [String(e.id || '').toUpperCase(), e]));
      const leaveIds = new Set(leaves.map(l => String(l.empId || '').toUpperCase()));
      const choices = employees
        .filter(e => e.id !== empId)
        .sort((a,b) => (leaveIds.has(String(b.id).toUpperCase())?1:0) - (leaveIds.has(String(a.id).toUpperCase())?1:0) || String(a.role).localeCompare(String(b.role)) || String(a.name).localeCompare(String(b.name)));
      const select = document.getElementById('substitute-for-emp');
      select.innerHTML = '<option value="">— 只標記加班，不指定代替人員 —</option>' + choices.map(e => {
        const leave = leaves.find(l => String(l.empId || '').toUpperCase() === String(e.id || '').toUpperCase());
        const leaveText = leave ? `｜✅ ${leave.leaveType || '請假'}已核准` : '';
        return `<option value="${scheduleEscapeHtml(e.id)}">${scheduleEscapeHtml(e.name)}（${scheduleEscapeHtml(e.id)}｜${scheduleEscapeHtml(e.role)}）${scheduleEscapeHtml(leaveText)}</option>`;
      }).join('');
      document.getElementById('substitute-cover-emp-id').value = empId;
      document.getElementById('substitute-date-key').value = dayStr;
      document.getElementById('substitute-cover-name').textContent = `${emp.name}（${emp.id}）`;
      document.getElementById('substitute-modal-subtitle').textContent = `${dayStr}｜${emp.role}｜目前班別：${(monthlyScheduleData[empId] || {})[dayStr] || '未排'}`;

      document.getElementById('substitute-overtime').checked = existing.overtime !== false;
      document.getElementById('substitute-note').value = String(existing.note || '');
      const hint = document.getElementById('substitute-leave-hint');
      if (leaves.length) hint.innerHTML = `📝 當日已核准請假：${leaves.map(l => `<strong>${scheduleEscapeHtml(l.name || l.empId)}（${scheduleEscapeHtml(l.leaveType || '請假')}）</strong>`).join('、')}`;
      else hint.textContent = '當日目前沒有已核准請假紀錄；仍可手動指定代班或只標記加班。';
      modal.classList.remove('hidden');
    }

    function saveSubstituteAssignment() {
      if (!requireScheduleEditLock()) return;
      const empId = String(document.getElementById('substitute-cover-emp-id')?.value || '').trim().toUpperCase();
      const dayStr = String(document.getElementById('substitute-date-key')?.value || '').trim();
      const forEmpId = String(document.getElementById('substitute-for-emp')?.value || '').trim().toUpperCase();
      const overtime = !!document.getElementById('substitute-overtime')?.checked;
      const note = String(document.getElementById('substitute-note')?.value || '').trim();
      if (!empId || !dayStr) return;
      if (!forEmpId && !overtime && !note) { clearSubstituteAssignment(); return; }
      const forEmp = employees.find(e => e.id === forEmpId);
      if (!monthlyScheduleMeta[empId]) monthlyScheduleMeta[empId] = {};
      monthlyScheduleMeta[empId][dayStr] = {
        type: forEmpId ? 'substitute' : 'overtime',
        forEmpId: forEmpId,
        forName: forEmp ? forEmp.name : '',
        overtime: overtime,
        note: note,
        assignedAt: new Date().toISOString()
      };
      queueScheduleCloudSave();
      closeSubstituteAssignment();
      renderRoleScheduleView();
    }

      if (!requireScheduleEditLock()) return;
      const empId = String(document.getElementById('substitute-cover-emp-id')?.value || '').trim().toUpperCase();
      const dayStr = String(document.getElementById('substitute-date-key')?.value || '').trim();

    function getSubstituteRecommendation(unitRole, targetEmpId, dayStr) {
      const sameRoleEmps = employees.filter(e => e.role === unitRole && e.id !== targetEmpId);
      let candidates = [];
      sameRoleEmps.forEach(cand => {
        const candShift = monthlyScheduleData[cand.id] && monthlyScheduleData[cand.id][dayStr];
        if (candShift === '休' || candShift === '特') {
          candidates.push(`${cand.name}(${cand.id}) - 當日休假`);
        }
      });
      if (candidates.length > 0) return `💡 建議代班: ${candidates.join(', ')}`;
      return '⚠️ 當日無人休假，需跨單位支援';
    }

    async function saveCurrentTabSchedule() {
      if (!requireScheduleEditLock()) return;
      const tabName = (activeRoleTab === 'ALL') ? '全廠' : activeRoleTab + '單位';
      lastScheduleCloudError = '';
      const ok = await saveScheduleMonthToCloud(false);
      if (ok) {
        alert(`☁️ 已將【${tabName}】目前月份的完整排班同步到 Google 雲端！`);
      } else {
        alert('❌ 排班雲端儲存失敗：\n' + (lastScheduleCloudError || '雲端沒有回傳詳細錯誤，請確認 Apps Script 已部署最新版。'));
      }
    }

    function setMgmtRoleFilter(roleKey) {
      mgmtRoleFilter = roleKey;
      renderEmployeeManagementView();
    }

    function handleMgmtSort(sortKey) {
      if (mgmtSortKey === sortKey) {
        mgmtSortOrder = (mgmtSortOrder === 'asc') ? 'desc' : 'asc';
      } else {
        mgmtSortKey = sortKey;
        mgmtSortOrder = 'asc';
      }
      renderEmployeeManagementView();
    }

    function renderEmployeeManagementView() {
      const container = document.getElementById('app-main-container');

      const roleCounts = {};
      employees.forEach(e => {
        roleCounts[e.role] = (roleCounts[e.role] || 0) + 1;
      });

      let filteredEmps = [...employees];
      if (mgmtRoleFilter !== 'ALL') {
        filteredEmps = filteredEmps.filter(e => e.role === mgmtRoleFilter);
      }

      filteredEmps.sort((a, b) => {
        let comp = 0;
        if (mgmtSortKey === 'id') {
          comp = a.id.localeCompare(b.id);
        } else if (mgmtSortKey === 'name') {
          comp = a.name.localeCompare(b.name, 'zh-Hant');
        } else if (mgmtSortKey === 'role') {
          comp = getRolePriority(a.role) - getRolePriority(b.role);
        } else if (mgmtSortKey === 'group') {
          comp = getGroupPriority(a.group) - getGroupPriority(b.group);
        } else {
          const rDiff = getRolePriority(a.role) - getRolePriority(b.role);
          if (rDiff !== 0) return rDiff;
          const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
          if (gDiff !== 0) return gDiff;
          return a.id.localeCompare(b.id);
        }
        return (mgmtSortOrder === 'asc') ? comp : -comp;
      });

      let roleFilterBtnsHtml = `

          <div class="flex flex-wrap justify-between items-center gap-4 mb-6 border-b pb-4">
            <div>
              <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-users-gear text-purple-600"></i> 人員名冊（來源：考勤系統員工清單）與排班設定
              </h2>
              <p class="text-xs text-slate-500 mt-1">人員基本資料由考勤系統員工清單統一維護；本頁只使用雲端人員資料進行排班。</p>
              <div class="flex flex-wrap items-center gap-2 mt-3">
                <span class="text-xs font-bold text-slate-500"><i class="fa-solid fa-filter text-purple-500"></i> 按職稱撈取：</span>
                ${roleFilterBtnsHtml}
              </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="promptAddNewGroup()" class="px-3.5 py-2 bg-teal-50 hover:bg-teal-100 text-teal-700 font-bold rounded-xl border border-teal-200 transition text-xs flex items-center gap-1">
                <i class="fa-solid fa-plus-circle"></i> ➕ 新增組別
              </button>
              <button onclick="promptDeleteGroup()" class="px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl border border-rose-200 transition text-xs flex items-center gap-1">
                <i class="fa-solid fa-trash"></i> 🗑️ 刪除組別
              </button>
              
              <button onclick="exportEmployeeListToExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm transition text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-file-excel"></i> 匯出名冊
              </button>

              <button onclick="openAddModal()" class="hidden px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-user-plus"></i> + 新增員工
              </button>
              <button onclick="saveAllPersonnelChanges()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-floppy-disk"></i> 💾 儲存變更
              </button>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-sm text-left border-collapse">
              <thead class="bg-slate-100 text-slate-700 font-bold border-b select-none">
                <tr>
                  <th class="py-3 px-4 w-12">#</th>
                  <th onclick="handleMgmtSort('id')" class="py-3 px-4 cursor-pointer hover:bg-slate-200 transition">工號/考勤號 ${getSortIcon('id')}</th>
                  <th onclick="handleMgmtSort('name')" class="py-3 px-4 cursor-pointer hover:bg-slate-200 transition">姓名 ${getSortIcon('name')}</th>
                  <th onclick="handleMgmtSort('role')" class="py-3 px-4 cursor-pointer hover:bg-slate-200 transition">所屬單位/支援 ${getSortIcon('role')}</th>
                  <th onclick="handleMgmtSort('group')" class="py-3 px-4 cursor-pointer hover:bg-slate-200 transition">組別標籤 ${getSortIcon('group')}</th>
                  <th class="py-3 px-4">排班鎖定屬性</th>
                  <th class="py-3 px-4 w-36">管理操作</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>

          <div class="mt-6 flex justify-end">
            <button onclick="saveAllPersonnelChanges()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base rounded-xl shadow-xl transition flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk text-xl"></i> ☁️ 儲存名冊與鎖定變更到雲端
            </button>
          </div>
        </div>
      `;

      container.innerHTML = html;
      applyScheduleAccessUi();
    }

    function updateEmpLockType(empId, lockVal) {
      if (!requireScheduleEditLock()) return;
      const emp = employees.find(e => e.id === empId);
      if(emp) {
        emp.lockType = lockVal;
        savePersonnelOverrideForCurrentMonth(emp);
        queuePersonnelCloudSave();
      }
    }

    async function saveAllPersonnelChanges() {
      if (!requireScheduleEditLock()) return;
      const ok = await saveScheduleEmployeesToCloud(false);
      buildRoleTabsAndRender();
      if (ok) alert("☁️ 人員調任支援、組別與固定班別鎖定已儲存到目前月份排班資料！");
      else alert("❌ 雲端儲存失敗，請稍後再試；若持續失敗請確認 Apps Script 已部署最新版。");
    }

    function updateDailyShift(empId, dayStr, val) {
      if (!requireScheduleEditLock()) return;
      if(!monthlyScheduleData[empId]) monthlyScheduleData[empId] = {};
      monthlyScheduleData[empId][dayStr] = val;
      queueScheduleCloudSave();
      renderRoleScheduleView();
    }

    function autoScheduleCurrentTab() {
      if (!requireScheduleEditLock()) return;
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = employees.filter(e => e.role === roleName);
        roleEmps.forEach((emp, idx) => {
          if (emp.lockType === 'FIXED_LOCKED') return;
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
          }
        });
      });

      saveAllDataToLocalStorage();
      queueScheduleCloudSave();
      renderRoleScheduleView();
      alert(`✨ 已完成智慧錯開排班，正在同步 Google 雲端！`);
    }

    function openAddModal() {
      document.getElementById('modal-title').innerText = "新增員工資料";
      document.getElementById('emp-edit-original-id').value = "";
      document.getElementById('emp-id-input').value = "";
      document.getElementById('emp-name-input').value = "";
      document.getElementById('emp-role-input').value = "AQC";
      document.getElementById('emp-lock-input').value = "ROTATION";
      
      const groupSelect = document.getElementById('emp-group-input');
      groupSelect.innerHTML = getGroupOptionsHtml('不分組');

      document.getElementById('employee-modal').classList.remove('hidden');
    }

    function openEditModal(empId) {
      const emp = employees.find(e => e.id === empId);
      if(!emp) return;
      document.getElementById('modal-title').innerText = "編輯員工資料";
      document.getElementById('emp-edit-original-id').value = emp.id;
      document.getElementById('emp-id-input').value = emp.id;
      document.getElementById('emp-name-input').value = emp.name;
      document.getElementById('emp-role-input').value = emp.role;
      document.getElementById('emp-lock-input').value = emp.lockType || 'ROTATION';
      
      const groupSelect = document.getElementById('emp-group-input');
      groupSelect.innerHTML = getGroupOptionsHtml(emp.group || '不分組');

      document.getElementById('employee-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('employee-modal').classList.add('hidden');
    }

    async function saveEmployee(e) {
      if (!requireScheduleEditLock()) { e.preventDefault(); return; }
      e.preventDefault();
      const origId = document.getElementById('emp-edit-original-id').value;
      const id = document.getElementById('emp-id-input').value.trim();
      const name = document.getElementById('emp-name-input').value.trim();
      const role = document.getElementById('emp-role-input').value;
      const group = document.getElementById('emp-group-input').value;
      const lockType = document.getElementById('emp-lock-input').value;

      if(origId) {
        const emp = employees.find(e => e.id === origId);
        if(emp) {
          emp.id = id;
          emp.name = name;
          emp.role = role;
          emp.group = group;
          emp.lockType = lockType;
        }
      } else {
        if(employees.some(e => e.id === id)) {
          alert("工號已存在！");
          return;
        }
        employees.push({ id, name, role, group, lockType });
        const yearMonth = document.getElementById('month-picker').value;
        initDefaultScheduleData(yearMonth);
      }

      try {
        await cloudPost({
          action: 'saveScheduleEmployee',
          originalEmpId: origId || id,
          employee: {
            empId: id,
            name: name,
            role: role,
            jobTitle: role,
            group: group,
            lockType: lockType
          }
        });
        await cloudPost({ action: 'saveScheduleGroups', groups: availableGroups });

        closeModal();
        buildRoleTabsAndRender();
        alert("☁️ 員工資料已同步到 Google 雲端！");
      } catch (err) {
        alert('❌ 員工資料 Google 雲端同步失敗：\n' + err.message);
      }
    }

    async function deleteEmployee(empId) {
      if (!requireScheduleEditLock()) return;
      if(confirm(`確定要刪除員工 [${empId}] 嗎？
這會同時從考勤系統的「員工清單」刪除此員工。`)) {
        try {
          await cloudPost({ action: 'deleteEmployee', empId });
          employees = employees.filter(e => e.id !== empId);
          delete monthlyScheduleData[empId];
          saveAllDataToLocalStorage();
          await saveScheduleMonthToCloud(false);
          buildRoleTabsAndRender();
          alert('✅ 員工已從 Google 雲端員工清單刪除。');
        } catch (err) {
          alert('❌ 刪除失敗：\n' + err.message);
        }
      }
    }

    function exportEmployeeListToExcel() {
      const exportRows = employees.map(emp => ({
        '工號': emp.id,
        '姓名': emp.name,
        '職稱': emp.role,
        '組別': emp.group,
        '鎖定': emp.lockType === 'FIXED_LOCKED' ? '固定鎖定' : '自動輪班'
      }));

      const ws = XLSX.utils.json_to_sheet(exportRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `員工名冊`);
      XLSX.writeFile(wb, `員工名冊清單.xlsx`);
    }

    function exportScheduleToExcel() {
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      const sortedEmps = [...employees].sort((a, b) => {
        const rDiff = getRolePriority(a.role) - getRolePriority(b.role);
        if (rDiff !== 0) return rDiff;
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return a.id.localeCompare(b.id);
      });

      const exportRows = [];
      sortedEmps.forEach(emp => {
        const row = {
          '工號': emp.id,
          '姓名': emp.name,
          '職稱': emp.role,
          '組別': emp.group,
          '排班屬性': emp.lockType === 'FIXED_LOCKED' ? '固定鎖定' : '自動輪班'
        };

        for(let d = 1; d <= totalDays; d++) {
          const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
          row[`${d}日`] = (monthlyScheduleData[emp.id] && monthlyScheduleData[emp.id][dayStr]) || '休';
        }

        exportRows.push(row);
      });

      const ws = XLSX.utils.json_to_sheet(exportRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${yearMonth}全廠班表`);
      XLSX.writeFile(wb, `${yearMonth}_全月排班表.xlsx`);
    }
  </script>
