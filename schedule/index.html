    // BUILD PATCH: 2026.09.24-SCHEDULE-FULL-AUTO-SYNC-V1

    // ★ 只要改這一行：貼上你部署後的 Google Apps Script /exec 網址
    // 例如：https://script.google.com/macros/s/xxxxxxxxxxxxxxxx/exec
    // ============================================================
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';

    function getScheduleGasUrl(){
      try{
        const hash=String(location.hash||'').replace(/^#/,'');
        const params=new URLSearchParams(hash);
        const fromHash=String(params.get('gasurl')||'').trim();
        if(/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/i.test(fromHash)){
          sessionStorage.setItem('port79_gas_url',fromHash);
          return fromHash;
        }
      }catch(e){}
      return String(sessionStorage.getItem('port79_gas_url')||DEFAULT_GAS_URL).trim();
    }

    const GAS_URL = getScheduleGasUrl();

    let scheduleAccessLevel = 'none';
    let lastScheduleCloudError = '';

    function normalizeSchedulePermissionLevel(value, fallback='none') {
      const text = String(value ?? '').toLowerCase();
      return ['none','view','manage'].includes(text) ? text : fallback;
    }

    function getSchedulePermissionFromData(data) {
      const role = String(data?.adminRole || '').toLowerCase();
      if (role === 'superadmin') return 'manage';
      return normalizeSchedulePermissionLevel(data?.systemPermissions?.schedule, 'none');
    }

    function canManageSchedule() {
      return scheduleAccessLevel === 'manage';
    }

    const SCHEDULE_LOCK_HEARTBEAT_MS = 30000;
    const SCHEDULE_LOCK_FETCH_TIMEOUT_MS = 8000;
    const SCHEDULE_LOCK_INITIAL_RETRIES = 2;
    let scheduleEditLockTimer = null;
    let scheduleLockLastError = '';
    let scheduleLockFailureCount = 0;
    let scheduleLockFirstFailureAt = 0;
    let scheduleLockLastSuccessAt = 0;
    let scheduleEditLockRefreshBusy = false;
    let scheduleEditLockState = { locked:false, mine:false, ownerName:'', ownerEmpId:'', expiresAt:0, startedAt:0, lastCheckedAt:0 };

    function getScheduleClientId() {
      let id = String(sessionStorage.getItem('port79_schedule_client_id') || '').trim();
      if (!id) {
        try { id = crypto.randomUUID(); }
        catch (e) { id = 'SCH-' + Date.now() + '-' + Math.random().toString(36).slice(2,10); }
        sessionStorage.setItem('port79_schedule_client_id', id);
      }
      return id;
    }

    function currentScheduleSession() {
      try { return JSON.parse(sessionStorage.getItem('admin_session') || 'null') || {}; }
      catch (e) { return {}; }
    }

    function isScheduleSuperAdmin() {
      return String(currentScheduleSession()?.adminRole || sessionStorage.getItem('aqc_admin_role') || '').toLowerCase() === 'superadmin';
    }

    function scheduleCanEditNow() {
      return canManageSchedule() && !!scheduleEditLockState.mine;
    }

    function scheduleLockOwnerLabel() {
      const name = String(scheduleEditLockState.ownerName || '').trim();
      const empId = String(scheduleEditLockState.ownerEmpId || '').trim();
      return name ? `${name}${empId ? `（${empId}）` : ''}` : (empId || '其他人員');
    }

    function requireScheduleEditLock(showAlert=true) {
      if (scheduleCanEditNow()) return true;
      let message = '目前不可修改排班。';
      if (!canManageSchedule()) message = '此帳號只有排班查看權限，不能修改班表。';
      else if (scheduleEditLockState.locked && !scheduleEditLockState.mine) message = `目前由 ${scheduleLockOwnerLabel()} 正在更改班表，為避免多人同時修改造成錯亂，已禁止修改。`;
      else message = '尚未取得排班編輯權，正在等待雲端編輯鎖。';
      if (showAlert) alert('🔒 ' + message);
      return false;
    }

    function scheduleEditorClockText(ts) {
      const n=Number(ts||0);
      if(!n)return '';
      try { return new Date(n).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }
      catch(e){ return ''; }
    }

    function updateScheduleActiveEditorBanner() {
      const banner=document.getElementById('scheduleActiveEditorBanner');
      if(!banner)return;
      const title=banner.querySelector('.schedule-editor-title');
      const sub=banner.querySelector('.schedule-editor-sub');
      const icon=banner.querySelector('.schedule-editor-icon');
      const actions=banner.querySelector('.schedule-editor-actions');
      const owner=scheduleLockOwnerLabel();
      const checked=scheduleEditorClockText(scheduleEditLockState.lastCheckedAt||Date.now());
      const me=currentScheduleSession();
      const myLabel=String(me?.name||scheduleEditLockState.ownerName||me?.empId||'目前帳號').trim();
      let state='busy',t='正在確認目前誰在編輯排班…',s='系統會自動更新，不需要手動查詢。',i='<i class="fa-solid fa-spinner fa-spin"></i>',a='';

      if(!canManageSchedule()) {
        state='view';
        if(scheduleEditLockState.locked){
          t=`👁️ 查看模式｜${scheduleEscapeHtml(owner)} 正在編輯排班`;
          s=`你目前只有查看權限｜最後確認 ${scheduleEscapeHtml(checked||'剛剛')}`;

    async function scheduleLockFetch(url, options = {}, timeoutMs = SCHEDULE_LOCK_FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
      } catch (e) {
        if (e && e.name === 'AbortError') throw new Error('雲端編輯鎖連線逾時，系統會自動重試');
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    async function scheduleLockGet() {
      const token = currentPort79SsoToken();
      const url = GAS_URL + '?action=scheduleGetEditLock&gcToken=' + encodeURIComponent(token) + '&scheduleClientId=' + encodeURIComponent(getScheduleClientId()) + '&t=' + Date.now();
      const res = await scheduleLockFetch(url, { cache:'no-store', redirect:'follow' });
      return await readScheduleSsoJson(res);
    }

    async function scheduleLockPost(action, keepalive=false) {
      const token = currentPort79SsoToken();
      const payload = { action, gcToken:token, token, scheduleClientId:getScheduleClientId() };
      const res = await scheduleLockFetch(GAS_URL, { method:'POST', body:JSON.stringify(payload), redirect:'follow', keepalive:!!keepalive });
      return await readScheduleSsoJson(res);
    }

    async function forceTakeoverScheduleEditLock() {
      if (!isScheduleSuperAdmin()) { alert('此功能僅限超級管理員使用'); return; }
      const previous = scheduleEditLockState.locked ? scheduleLockOwnerLabel() : '目前編輯者';
      if (!confirm(`確定要踢除「${previous}」並由你接管排班編輯權嗎？\n\n對方下一次操作時會立即失去儲存權限。`)) return;
      try {

        scheduleLockLastError = '';
        setScheduleEditLockState(data);
        await loadScheduleCloudWithRetry('manual', 2);
        renderTodaySchedulePanel();
        alert(`✅ 已踢除 ${previous}，目前排班編輯權已由你接管。`);
      } catch (e) {
        alert('❌ 踢除／接管失敗：\n' + (e?.message || e));

    async function refreshOrAcquireScheduleEditLock() {
      // v9.1：避免定時心跳、手動重新整理、focus/online 同時進來造成重複請求與重繪。
      if (scheduleEditLockRefreshBusy) return false;
      scheduleEditLockRefreshBusy = true;
      try {
        if (canManageSchedule()) {
          const action = scheduleEditLockState.mine ? 'scheduleHeartbeatEditLock' : 'scheduleAcquireEditLock';
          const data = await scheduleLockPost(action);
          scheduleLockLastError = ''; scheduleLockFailureCount=0; scheduleLockFirstFailureAt=0;
          setScheduleEditLockState(data);
          if (!scheduleEditLockState.mine && !scheduleEditLockState.locked) {
            const status = await scheduleLockGet();
            scheduleLockLastError = ''; scheduleLockFailureCount=0; scheduleLockFirstFailureAt=0;
            setScheduleEditLockState(status);
          }
        } else {
          const data = await scheduleLockGet();
          scheduleLockLastError = ''; scheduleLockFailureCount=0; scheduleLockFirstFailureAt=0;
          setScheduleEditLockState(data);
        }
        return true;
      } catch (e) {
        scheduleLockLastError = String(e?.message || e || '編輯鎖連線失敗');
        scheduleLockFailureCount += 1; if(!scheduleLockFirstFailureAt)scheduleLockFirstFailureAt=Date.now();
        console.warn('排班編輯鎖同步失敗：', e);
        // v10.8 穩定租約：單次/短暫連線失敗不能立刻取消自己的編輯權。
        // 只有租約已真正到期，才切回唯讀；伺服器若成功回覆「已非本人」則 setScheduleEditLockState() 會立即處理。
        const leaseExpires=Number(scheduleEditLockState.expiresAt||0);
        const leaseStillValid=!!scheduleEditLockState.mine && leaseExpires>Date.now();
        if(!leaseStillValid && scheduleEditLockState.mine){
          scheduleEditLockState.mine=false;
          scheduleEditLockState.locked=false;
        }
        updateScheduleLockBadge();
        applyScheduleAccessUi();
        return leaseStillValid;
      } finally {
        scheduleEditLockRefreshBusy = false;
      }
    }

    async function initializeScheduleEditLock() {
      // 初次最多 3 次：單次 6.5 秒上限，重試間隔 1.2 秒；約 20 秒內一定結束「等待」狀態。
      for(let i=0;i<=SCHEDULE_LOCK_INITIAL_RETRIES;i++){
        const ok=await refreshOrAcquireScheduleEditLock();
        if(ok)break;
        if(i<SCHEDULE_LOCK_INITIAL_RETRIES) await new Promise(r=>setTimeout(r,1200));
      }
      if (scheduleEditLockTimer) clearInterval(scheduleEditLockTimer);
      scheduleEditLockTimer = setInterval(refreshOrAcquireScheduleEditLock, SCHEDULE_LOCK_HEARTBEAT_MS);
    }

    async function manualRetryScheduleEditLock(){
      scheduleLockLastError='';scheduleLockFailureCount=0;scheduleLockFirstFailureAt=0;updateScheduleLockBadge();
      const ok=await refreshOrAcquireScheduleEditLock();
      if(!ok) updateScheduleLockBadge();
    }

    }

    async function readScheduleSsoJson(response) {
      const raw = await response.text();
      const text = String(raw || '').replace(/^\uFEFF/, '').trim();
      if (!response.ok) throw new Error(`SSO HTTP ${response.status}`);
      if (!text) throw new Error('SSO 驗證回傳空白內容');
      if (/^<!doctype html|^<html/i.test(text)) throw new Error('SSO 驗證回傳 Google HTML，不是 JSON');
      try { return JSON.parse(text); } catch (e) { throw new Error('SSO 驗證未收到有效 JSON'); }
    }

    async function verifyScheduleSsoToken(token) {
      let lastError = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), 12000) : null;
        try {
          const res = await fetch(
            GAS_URL + '?action=gcGetSyncMeta&gcToken=' + encodeURIComponent(token) + '&t=' + Date.now(),
            { cache:'no-store', redirect:'follow', signal: controller?.signal }
          );
          const data = await readScheduleSsoJson(res);
          const role = String(data?.adminRole || '').toLowerCase();
          const access = getSchedulePermissionFromData(data);
          if (!data?.ok || !['admin','superadmin'].includes(role) || access === 'none') {
            const authError = new Error(data?.error || '此帳號沒有排班系統權限');
            authError.ssoAuthRejected = true;
            throw authError;
          }
          data.scheduleAccessLevel = access;
          return data;
        } catch (e) {
          lastError = e;
          if (e?.ssoAuthRejected) break;
          if (attempt < 3) await new Promise(r => setTimeout(r, 450 * attempt));
        } finally {
          if (timer) clearTimeout(timer);
        }
      }
      throw lastError || new Error('SSO 驗證失敗');
    }

    async function consumePort79SsoHandoff() {
      const token = currentPort79SsoToken();
      if (!token) return false;

      try {
        const data = await verifyScheduleSsoToken(token);
        const empId = String(data.empId || '').trim().toUpperCase();
        const name = String(data.name || '');
        const role = String(data.adminRole || 'admin').toLowerCase();
        scheduleAccessLevel = data.scheduleAccessLevel || getSchedulePermissionFromData(data);
        const systemPermissions = data.systemPermissions || { schedule: scheduleAccessLevel };

        sessionStorage.setItem('admin_session', JSON.stringify({
          empId, name, adminRole:role, systemPermissions, loginAt:new Date().toISOString(), sso:true
        }));
        sessionStorage.setItem('aqc_admin_logged_in','1');
        sessionStorage.setItem('aqc_admin_id',empId);
        sessionStorage.setItem('aqc_admin_role',role);
        sessionStorage.setItem('aqc_admin_name',name);
        sessionStorage.setItem('port79_admin_token',token);
        sessionStorage.setItem('port79_gc_token',token);
        if (role === 'superadmin') sessionStorage.setItem('port79_gc_superadmin_token',token);
        else sessionStorage.removeItem('port79_gc_superadmin_token');
        sessionStorage.setItem('port79_sso_verified','1');
        sessionStorage.setItem('port79_gas_url',GAS_URL);
        clearPort79SsoHash();
        return true;
      } catch (e) {
        console.error('PORT79 Schedule SSO failed:', e);
        const fallback = !e?.ssoAuthRejected &&
          sessionStorage.getItem('port79_sso_verified') === '1' &&
          hasLocalScheduleSession();
        clearPort79SsoHash();
        if (fallback) return true;
        return false;
      }
    }

    let port79ScheduleAutoSyncTimer = null;

    let port79ScheduleLastAutoSyncAt = 0;
    // v2026.09.28.7.38：所有本機修改必須先完成雲端寫入，背景同步才允許往回拉資料。
    // 避免新增/刪除組別後，alert/prompt 關閉觸發 window.focus，舊雲端資料把新組別瞬間蓋掉。

    async function runScheduleCloudWrite(task) {
      // 同一時間只允許一個排班寫入工作；若已有寫入，先等它完成再接下一個。
      if (port79ScheduleWriteInFlight) {
        try { await port79ScheduleWriteInFlight; } catch(ignore) {}
      }
      const p = (async () => {
        try { return await task(); }
        catch (e) { console.error('排班雲端寫入失敗：', e); return false; }
      })();
      port79ScheduleWriteInFlight = p;
      try { return await p; }
      finally {
        if (port79ScheduleWriteInFlight === p) port79ScheduleWriteInFlight = null;
      }
    }

    async function flushSchedulePendingWrites() {
      // 人員/組別儲存本身已包含當月班表，因此優先處理並取消一般班表計時器。
      if (personnelSaveTimer) {
        clearTimeout(personnelSaveTimer);
        personnelSaveTimer = null;
        if (scheduleSaveTimer) { clearTimeout(scheduleSaveTimer); scheduleSaveTimer = null; }
        const ok = await runScheduleCloudWrite(() => saveScheduleEmployeesToCloud(false));
        if (ok) port79ScheduleDirty = false;
        return ok;
      }
      if (scheduleSaveTimer) {
        clearTimeout(scheduleSaveTimer);
        scheduleSaveTimer = null;
        const ok = await runScheduleCloudWrite(() => saveScheduleMonthToCloud(false));
        if (ok) port79ScheduleDirty = false;
        return ok;
      }
      if (port79ScheduleWriteInFlight) {
        const ok = await port79ScheduleWriteInFlight;
        if (ok) port79ScheduleDirty = false;
        return !!ok;
      }
      return !port79ScheduleDirty;
    }

        port79ScheduleLastAutoSyncAt = Date.now();

      return ok;

    async function loadScheduleCloudWithRetry(reason='auto', retryCount=3) {
      if (!isGasUrlConfigured()) return false;
      if (port79ScheduleAutoSyncBusy) return false;

      // 有任何尚未送出的修改時，先真正完成寫入；寫入失敗就禁止往回拉舊雲端資料。
      if (port79ScheduleDirty || scheduleSaveTimer || personnelSaveTimer || port79ScheduleWriteInFlight) {
        const writeOk = await flushSchedulePendingWrites();
        if (!writeOk) {
          console.warn('尚有未成功儲存的排班修改，本次取消背景雲端同步，避免覆蓋畫面資料。');
          return false;
        }
      }

      const now = Date.now();
      if (!['login','manual'].includes(reason) && now - port79ScheduleLastAutoSyncAt < 8000) return true;

      port79ScheduleAutoSyncBusy = true;
      try {
        for (let attempt=1; attempt<=retryCount; attempt++) {
          const ok = await loadCloudData(false);
          if (ok) {
            port79ScheduleLastAutoSyncAt = Date.now();
            const yearMonth = document.getElementById('month-picker')?.value;
            if (yearMonth) initDefaultScheduleData(yearMonth, false);
            try { buildRoleTabsAndRender(); } catch(ignore) {}
            return true;
          }
          if (attempt < retryCount) {
            await new Promise(r => setTimeout(r, attempt * 1200));
          }
        }
        return false;
      } finally {
        port79ScheduleAutoSyncBusy = false;
      }
    }

    function scheduleTaipeiTodayKey() {
      try {
        const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
        const x={}; parts.forEach(p=>x[p.type]=p.value);
        return `${x.year}-${x.month}-${x.day}`;
      } catch(e) {
        const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
    }

    function renderTodaySchedulePanel() {
      const dateKey=scheduleTaipeiTodayKey();
      const dateEl=document.getElementById('todayScheduleDate');
      const summaryEl=document.getElementById('todayScheduleSummary');
      const countsEl=document.getElementById('todayScheduleCounts');
      const detailEl=document.getElementById('todayScheduleDetail');
      if(!summaryEl||!countsEl||!detailEl)return;
      if(dateEl) dateEl.textContent=dateKey.replace(/-/g,'/');

      const leaveCodes=new Set(['休','特','事','病','公','喪','']);
      const groups={早:[],中:[],晚:[],其他:[],加班代班:[]};
      (employees||[]).forEach(emp=>{
        const shift=String(monthlyScheduleData?.[emp.id]?.[dateKey]||'').trim();
        const meta=monthlyScheduleMeta?.[emp.id]?.[dateKey]||{};
        const item={emp,shift,meta};
        if(shift==='早')groups.早.push(item);
        else if(shift==='中')groups.中.push(item);
        else if(shift==='晚')groups.晚.push(item);
        else if(!leaveCodes.has(shift))groups.其他.push(item);
        if(meta && (meta.overtime || meta.type==='substitute' || meta.forEmpId)) groups.加班代班.push(item);
      });

      const roleOrder=['領班','指揮手','AQC','ARMG','F/L','課長','主任','副理'];
      const roleRank=r=>{const i=roleOrder.indexOf(String(r||''));return i<0?99:i;};
      const sortList=list=>list.sort((a,b)=>{
        const rr=roleRank(a.emp?.role)-roleRank(b.emp?.role); if(rr)return rr;
        const ga=String(a.emp?.group||'不分組'),gb=String(b.emp?.group||'不分組');
        const gr=ga.localeCompare(gb,'zh-Hant'); if(gr)return gr;
        return String(a.emp?.name||'').localeCompare(String(b.emp?.name||''),'zh-Hant');
      });
      Object.values(groups).forEach(sortList);

      const uniqueWorking=new Map();
      [...groups.早,...groups.中,...groups.晚,...groups.其他,...groups.加班代班].forEach(x=>uniqueWorking.set(x.emp.id,x));
      const total=uniqueWorking.size;
      summaryEl.textContent=`今日實際排定出勤 ${total} 人｜早班 ${groups.早.length}｜中班 ${groups.中.length}｜晚班 ${groups.晚.length}${groups.加班代班.length?`｜加班／代班 ${groups.加班代班.length}`:''}`;

      const countCards=[
        ['今日出勤',total,'bg-indigo-50 text-indigo-700 border-indigo-200'],
        ['早班',groups.早.length,'bg-emerald-50 text-emerald-700 border-emerald-200'],
        ['中班',groups.中.length,'bg-amber-50 text-amber-700 border-amber-200'],
        ['晚班',groups.晚.length,'bg-purple-50 text-purple-700 border-purple-200'],
        ['加班／代班',groups.加班代班.length,'bg-sky-50 text-sky-700 border-sky-200'],
        ['未出勤／休假',Math.max(0,(employees||[]).length-total),'bg-slate-50 text-slate-600 border-slate-200']
      ];
      countsEl.innerHTML=countCards.map(x=>`<div class="rounded-lg border ${x[2]}"><div class="today-count-label font-bold">${x[0]}</div><div class="today-count-value font-black">${x[1]}</div></div>`).join('');

      const personRow=x=>{
        const badges=[];
        if(x.meta?.overtime)badges.push('<span class="today-person-badge bg-sky-100 text-sky-700">加</span>');
        if(x.meta?.forEmpId||x.meta?.type==='substitute')badges.push('<span class="today-person-badge bg-fuchsia-100 text-fuchsia-700">代</span>');
        return `<div class="today-person-row" title="${scheduleEscapeHtml(x.emp?.name||'')}｜${scheduleEscapeHtml(x.emp?.role||'')}｜${scheduleEscapeHtml(x.emp?.group||'不分組')}">
          <div class="today-person-name">${scheduleEscapeHtml(x.emp?.name||'—')}<span class="today-person-badges">${badges.join('')}</span></div>
          <div class="today-person-meta">${scheduleEscapeHtml(x.emp?.role||'—')}｜${scheduleEscapeHtml(x.emp?.group||'不分組')}</div>
        </div>`;
      };

      const roleSections=list=>{
        if(!list.length)return '<div class="text-sm text-slate-400 py-2">目前無人</div>';
        const byRole=new Map();
        list.forEach(x=>{const role=String(x.emp?.role||'其他');if(!byRole.has(role))byRole.set(role,[]);byRole.get(role).push(x);});
        return [...byRole.entries()].sort((a,b)=>roleRank(a[0])-roleRank(b[0])||a[0].localeCompare(b[0],'zh-Hant')).map(([role,items])=>
          `<div class="today-role-section"><div class="today-role-label"><span>${scheduleEscapeHtml(role)}</span><span>${items.length} 人</span></div><div class="today-person-grid">${items.map(personRow).join('')}</div></div>`
        ).join('');
      };

      const block=(label,list,cls,icon)=>`<div class="today-shift-block"><div class="today-shift-title ${cls}"><span><i class="fa-solid ${icon} mr-1"></i>${label}</span><span class="text-slate-400 text-xs">${list.length} 人</span></div>${roleSections(list)}</div>`;
      const blocks=[
        block('早班',groups.早,'text-emerald-700','fa-sun'),
        block('中班',groups.中,'text-amber-700','fa-cloud-sun'),
        block('晚班',groups.晚,'text-purple-700','fa-moon')
      ];
      if(groups.其他.length)blocks.push(block('其他出勤',groups.其他,'text-indigo-700','fa-user-clock'));
      if(groups.加班代班.length)blocks.push(block('加班／代班',groups.加班代班,'text-sky-700','fa-user-plus'));
      detailEl.innerHTML=blocks.join('');
      detailEl.classList.toggle('hidden',!todayScheduleExpanded);
    }

      const editable = scheduleCanEditNow();

      const owner = lockedByOther ? scheduleLockOwnerLabel() : '';
      const disabledTitle = !manage
        ? '此帳號只有排班查看權限'
        : (lockedByOther ? `目前由 ${owner} 正在更改班表，禁止修改` : '尚未取得排班編輯權');

      const mutationPatterns = [
        'resetToDefaultData','saveAllPersonnelChanges','openAddModal','openEditModal',
        'promptAddNewGroup','promptDeleteGroup','saveEmployee','deleteEmployee',
        'autoScheduleCurrentTab','saveCurrentTabSchedule','quickAssignEmpToGroup',
        'openSubstituteAssignment','saveSubstituteAssignment','clearSubstituteAssignment'
      ];
      document.querySelectorAll('[data-schedule-edit="1"]').forEach(el => {
        el.disabled = !editable;
        el.title = editable ? '' : disabledTitle;
        el.classList.toggle('opacity-40', !editable);
        el.classList.toggle('cursor-not-allowed', !editable);
      });
      document.querySelectorAll('button[onclick]').forEach(btn => {
        const code = String(btn.getAttribute('onclick') || '');
        if (mutationPatterns.some(p => code.includes(p))) {
          btn.disabled = !editable;
          btn.title = editable ? '' : disabledTitle;
          btn.classList.toggle('opacity-40', !editable);
          btn.classList.toggle('cursor-not-allowed', !editable);
        }
        if (code.includes('openAddModal') || code.includes('openEditModal') || code.includes('deleteEmployee')) {
          btn.disabled = true;
          btn.title = '人員主檔請到人資管理系統維護';
          btn.classList.add('opacity-40','cursor-not-allowed');
        }
      });
      document.querySelectorAll('select[onchange],input[onchange]').forEach(el => {
        const code = String(el.getAttribute('onchange') || '');
        const editChange = ['updateDailyShift','updateEmpRoleAndResort','updateEmpGroupAndResort','updateEmpLockType'].some(p => code.includes(p));
        if (editChange) {
          el.disabled = !editable;
          el.title = editable ? '' : disabledTitle;

      if (banner) {

    async function cloudPost(payload) {
      if (!isGasUrlConfigured()) throw new Error('尚未設定 GAS_URL。');
      const action = String(payload?.action || '');
      if (['saveScheduleEmployee','upsertScheduleEmployee','syncScheduleEmployees'].includes(action)) {
        throw new Error('人員主檔已統一由「考勤系統 → 員工清單管理」維護，排班系統不再新增／修改員工基本資料。');
      }
      if (!canManageSchedule()) {
        throw new Error('此帳號只有排班查看權限，不能儲存或修改排班。');
      }
      const scheduleWriteActions = ['syncSchedules','saveSchedules','saveScheduleMonth','saveScheduleGroups'];
      if (scheduleWriteActions.includes(action) && !requireScheduleEditLock(false)) {
        throw new Error(scheduleEditLockState.locked && !scheduleEditLockState.mine
          ? `目前由 ${scheduleLockOwnerLabel()} 正在更改班表，禁止同步修改`
          : '尚未取得排班編輯權，禁止同步修改');
      }
      if (scheduleWriteActions.includes(action)) payload.scheduleClientId = getScheduleClientId();
      const token = currentPort79SsoToken();
      if (token) { payload.gcToken = token; payload.token = token; }
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error('Google 雲端回傳格式錯誤：' + text.slice(0, 150)); }
      if (!data.ok) throw new Error(data.error || data.message || 'Google 雲端操作失敗');
      return data;
    }

    function normalizeScheduleEmploymentStatus(v) {
      const s=String(v||'active').trim().toLowerCase();
      if(['resigned','離職','terminated','inactive'].includes(s))return 'resigned';
      if(['leave','留職停薪','留停','loa'].includes(s))return 'leave';
      return 'active';
    }
    function scheduleEmployeeEligibleForMonth(emp, yearMonth) {
      const status=normalizeScheduleEmploymentStatus(emp?.employmentStatus);
      if(status==='active')return true;
      if(status==='leave')return false;
      const ym=String(yearMonth||'').slice(0,7);
      const last=String(emp?.lastWorkDate||emp?.terminationDate||'').replace(/\//g,'-').slice(0,10);
      if(!ym||!last)return false;
      // 歷史月份若仍在最後工作日前，保留舊班表人員。
      return `${ym}-01`<=last;
    }
    function cloneScheduleEmployee(emp) {
      return {
        id: String(emp?.id || '').trim().toUpperCase(),
        name: String(emp?.name || ''),
        role: String(emp?.role || 'AQC'),
        group: String(emp?.group || '不分組'),
        lockType: String(emp?.lockType || 'ROTATION'),
        order: scheduleOrderNumber(emp?.order),
        employmentStatus: normalizeScheduleEmploymentStatus(emp?.employmentStatus),
        terminationDate: String(emp?.terminationDate||''),
        lastWorkDate: String(emp?.lastWorkDate||'')
      };
    }

    function currentScheduleMonthKey() {
      return String(document.getElementById('month-picker')?.value || '').trim();
    }

    function savePersonnelOverrideForCurrentMonth(emp) {
      const month = currentScheduleMonthKey();
      const id = String(emp?.id || '').trim().toUpperCase();
      if (!month || !id) return;
      if (!schedulePersonnelOverrides[month]) schedulePersonnelOverrides[month] = {};
      schedulePersonnelOverrides[month][id] = {
        role: String(emp.role || 'AQC'),
        group: String(emp.group || '不分組'),
        lockType: String(emp.lockType || 'ROTATION'),
        order: scheduleOrderNumber(emp.order)
      };
    }

    function applySchedulePersonnelOverrides(yearMonth) {
      const month = String(yearMonth || currentScheduleMonthKey()).trim();
      const base = (employeeMasterBase.length ? employeeMasterBase : employees)
        .map(cloneScheduleEmployee)
        .filter(emp=>scheduleEmployeeEligibleForMonth(emp,month));
      const overrides = schedulePersonnelOverrides[month] || {};
      employees = base.map(emp => {
        const ov = overrides[emp.id];
        return ov ? Object.assign(emp, {
          role: ov.role || emp.role,
          group: ov.group || emp.group,
          lockType: ov.lockType || emp.lockType,
          order: scheduleOrderNumber(ov.order) !== null ? scheduleOrderNumber(ov.order) : emp.order
        }) : emp;
      });
    }

    async function loadCloudData(showAlert = false) {
      if (!isGasUrlConfigured()) {
        if (showAlert) alert('⚠️ 請先在 HTML 程式上方設定 GAS_URL。');
        return false;
      }
      try {
        const token = currentPort79SsoToken();
        const res = await fetch(GAS_URL + '?action=getScheduleDataSecure&gcToken=' + encodeURIComponent(token) + '&_=' + Date.now(), { redirect: 'follow', cache:'no-store' });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '讀取失敗');

        const cloudEmployees = (data.employees || [])
          .filter(emp => String(emp.empId || '').toUpperCase() !== 'ADMIN' && (emp.empId || emp.name))
          .map(emp => ({
            id: String(emp.empId || '').trim().toUpperCase(),
            name: emp.name || '',
            role: emp.jobTitle || emp.deptDetail || emp.role || emp.dept || 'AQC',
            group: emp.group || '不分組',
            lockType: emp.lockType || 'ROTATION',
            order: scheduleOrderNumber(emp.order),
            employmentStatus: emp.employmentStatus || 'active',
            terminationDate: emp.terminationDate || '',
            lastWorkDate: emp.lastWorkDate || ''
          }))
          .filter(emp => emp.id);

        if (cloudEmployees.length) employeeMasterBase = cloudEmployees.map(cloneScheduleEmployee);
        else if (!employeeMasterBase.length) employeeMasterBase = employees.map(cloneScheduleEmployee);

        leaveRecords = Array.isArray(data.leaveRecords) ? data.leaveRecords : [];
        monthlyScheduleData = {};
        monthlyScheduleMeta = {};
        schedulePersonnelOverrides = {};

        (data.schedules || []).forEach(row => {
          const empId = String(row.empId || '').trim().toUpperCase();
          const month = String(row.month || '').trim();
          const schedule = row.schedule && typeof row.schedule === 'object' ? Object.assign({}, row.schedule) : {};
          if (!empId) return;

          const personnel = schedule.__personnel && typeof schedule.__personnel === 'object'
            ? Object.assign({}, schedule.__personnel)
            : {};
          if (month) {
            if (!schedulePersonnelOverrides[month]) schedulePersonnelOverrides[month] = {};
            schedulePersonnelOverrides[month][empId] = {
              role: String(personnel.role || row.role || ''),
              group: String(personnel.group || row.group || '不分組'),
              lockType: String(personnel.lockType || 'ROTATION'),
              order: scheduleOrderNumber(personnel.order ?? row.order)
            };
          }
          delete schedule.__personnel;

          if (!monthlyScheduleData[empId]) monthlyScheduleData[empId] = {};
          if (!monthlyScheduleMeta[empId]) monthlyScheduleMeta[empId] = {};
          const meta = schedule.__meta && typeof schedule.__meta === 'object' ? schedule.__meta : {};
          delete schedule.__meta;
          Object.assign(monthlyScheduleData[empId], schedule);
          Object.assign(monthlyScheduleMeta[empId], meta);
        });

        applySchedulePersonnelOverrides(currentScheduleMonthKey());

        const groupSet = new Set(['不分組']);
        (data.scheduleGroups || []).forEach(g => { if(g) groupSet.add(g); });
        employees.forEach(emp => { if(emp.group) groupSet.add(emp.group); });
        groupSet.delete('不輪班');
        availableGroups = [...groupSet, '不輪班'];

        cloudLoaded = true;
        saveAllDataToLocalStorage();
        if (showAlert) alert('✅ 已重新載入 Google 雲端最新資料！');
        return true;
      } catch (err) {
        console.error(err);
        if (showAlert) alert('❌ 無法讀取 Google 雲端：\n' + err.message + '\n\n請確認 GAS 網址、部署版本與存取權限。');
        return false;
      }
    }

    async function saveScheduleMonthToCloud(showAlert = true) {
      const yearMonth = document.getElementById('month-picker').value;
      const schedules = employees.map(emp => {
        const monthData = {};
        const allEmp = monthlyScheduleData[emp.id] || {};
        Object.keys(allEmp).forEach(dateKey => {
          if (dateKey.startsWith(yearMonth + '-')) monthData[dateKey] = allEmp[dateKey];
        });
        const allMeta = monthlyScheduleMeta[emp.id] || {};
        const monthMeta = {};
        Object.keys(allMeta).forEach(dateKey => {
          if (dateKey.startsWith(yearMonth + '-') && allMeta[dateKey] && typeof allMeta[dateKey] === 'object') {
            monthMeta[dateKey] = allMeta[dateKey];
          }
        });
        if (Object.keys(monthMeta).length) monthData.__meta = monthMeta;
        monthData.__personnel = {
          role: emp.role || 'AQC',
          group: emp.group || '不分組',
          lockType: emp.lockType || 'ROTATION',
          order: scheduleOrderNumber(emp.order)
        };
        savePersonnelOverrideForCurrentMonth(emp);
        return { empId: emp.id, name: emp.name, role: emp.role, group: emp.group, month: yearMonth, schedule: monthData };
      });
      try {
        const result = await cloudPost({ action: 'syncSchedules', month: yearMonth, schedules });
        saveAllDataToLocalStorage();
        if (showAlert) alert(`☁️ ${result.message || '排班已同步 Google 雲端'}`);
        return true;
      } catch (err) {
        lastScheduleCloudError = String(err?.message || err || '未知錯誤');
        console.error('排班雲端儲存失敗：', err);
        if (showAlert) alert('❌ 排班雲端儲存失敗：\n' + lastScheduleCloudError);
        return false;
      }
    }

    async function saveScheduleEmployeesToCloud(showAlert = true) {
      try {
        employees.forEach(savePersonnelOverrideForCurrentMonth);
        const scheduleOk = await saveScheduleMonthToCloud(false);
        if (!scheduleOk) throw new Error(lastScheduleCloudError || '排班資料儲存失敗');
        await cloudPost({ action: 'saveScheduleGroups', groups: availableGroups });
        saveAllDataToLocalStorage();
        if (showAlert) alert('☁️ 支援單位、組別與固定班別鎖定已儲存到目前月份排班資料！');
        return true;
      } catch (err) {
        if (showAlert) alert('❌ 人員排班設定雲端儲存失敗：\n' + (err?.message || err));
        return false;
      }
    }

    function queueScheduleCloudSave() {
      if (!requireScheduleEditLock(false)) return;
      saveAllDataToLocalStorage();
      port79ScheduleDirty = true;
      clearTimeout(scheduleSaveTimer);
      scheduleSaveTimer = setTimeout(async () => {
        scheduleSaveTimer = null;
        const ok = await runScheduleCloudWrite(() => saveScheduleMonthToCloud(false));
        if (ok && !personnelSaveTimer) {
          port79ScheduleDirty = false;
          port79ScheduleLastAutoSyncAt = Date.now();
        }
      }, 900);
    }

    function queuePersonnelCloudSave() {
      if (!requireScheduleEditLock(false)) return;
      saveAllDataToLocalStorage();
      port79ScheduleDirty = true;
      // 人員/組別儲存會連同當月班表一起送出，避免兩個寫入同時競爭。
      if (scheduleSaveTimer) { clearTimeout(scheduleSaveTimer); scheduleSaveTimer = null; }
      clearTimeout(personnelSaveTimer);
      personnelSaveTimer = setTimeout(async () => {
        personnelSaveTimer = null;
        const ok = await runScheduleCloudWrite(() => saveScheduleEmployeesToCloud(false));
        if (ok) {
          port79ScheduleDirty = false;
          port79ScheduleLastAutoSyncAt = Date.now();

    async function resetToDefaultData() {
      if (!requireScheduleEditLock()) return;
      const yearMonth = document.getElementById('month-picker').value;

      const confirmed = confirm(
        `⚠️ 確定要重設 ${yearMonth} 的排班資料嗎？\n\n` +
        `這會依照目前畫面上的輪班規則重新產生整個月份，\n` +
        `並直接覆蓋 Google 雲端「排班資料」中 ${yearMonth} 的班表。\n\n` +
        `員工清單、考勤紀錄、請假紀錄都不會被刪除。`
      );

      if (!confirmed) return;

      try {
        const [year, month] = yearMonth.split('-').map(Number);
        const totalDays = getDaysInMonth(year, month);

        employees.forEach(emp => {
          if (!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};

          Object.keys(monthlyScheduleData[emp.id]).forEach(dateKey => {
            if (dateKey.startsWith(yearMonth + '-')) {
              delete monthlyScheduleData[emp.id][dateKey];
            }
          });
        });

        MAIN_ROLES.forEach(roleName => {
          const roleEmps = sortScheduleEmployeesForRole(employees.filter(e => e.role === roleName));

          roleEmps.forEach((emp, idx) => {
            if (!monthlyScheduleData[emp.id]) {
              monthlyScheduleData[emp.id] = {};
            }

            for (let d = 1; d <= totalDays; d++) {
              const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
              const dateObj = new Date(year, month - 1, d);

              monthlyScheduleData[emp.id][dayStr] =
                calculateShiftForDay(emp, idx, d, dateObj.getDay());
            }
          });
        });

        const cloudOk = await saveScheduleMonthToCloud(false);

        if (!cloudOk) {
          throw new Error('Google 雲端寫入失敗');
        }

        buildRoleTabsAndRender();

        alert(
          `☁️ ${yearMonth} 排班已重設完成！\n\n` +
          `新的班表已同步到 Google 雲端。`
        );

      } catch (err) {
        console.error(err);
        alert(
          '❌ 重設雲端排班失敗：\n' +
          (err && err.message ? err.message : err)
        );
      }
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function getRolePriority(role) {
      const idx = ALL_ROLE_ORDER.indexOf(role);
      return idx === -1 ? 999 : idx;
    }

    function getGroupPriority(group) {
      if (group === '不分組') return 0;
      if (group === '不輪班') return 999;
      const idx = availableGroups.indexOf(group);
      return idx === -1 ? 500 : idx;
    }

    // v2026.09.30.8.9：恢復「人員上下移動」。
    // 順序存進目前月份排班資料的 __personnel.order，不修改人資主檔。
    function scheduleOrderNumber(v) {
      if (v === null || v === undefined || String(v).trim() === '') return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function compareScheduleEmployeeOrder(a, b) {
      const ao = scheduleOrderNumber(a?.order);
      const bo = scheduleOrderNumber(b?.order);
      if (ao !== null || bo !== null) {
        if (ao === null) return 1;
        if (bo === null) return -1;
        if (ao !== bo) return ao - bo;
      }
      return String(a?.id || '').localeCompare(String(b?.id || ''), 'zh-Hant', { numeric: true });
    }

    function sortScheduleEmployeesForRole(list) {
      return [...(list || [])].sort((a, b) => {
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return compareScheduleEmployeeOrder(a, b);
      });
    }

    function nextScheduleOrder(role, group, excludeId = '') {
      const nums = employees
        .filter(e => e.id !== excludeId && e.role === role && e.group === group)
        .map(e => scheduleOrderNumber(e.order))
        .filter(v => v !== null);
      return nums.length ? Math.max(...nums) + 10 : 10;
    }

    function moveScheduleEmployee(empId, direction) {
      if (!requireScheduleEditLock()) return;
      const emp = employees.find(e => e.id === empId);
      if (!emp) return;

      const peers = employees
        .filter(e => e.role === emp.role && e.group === emp.group)
        .sort(compareScheduleEmployeeOrder);

      // 舊資料沒有 order 時，先依目前穩定順序建立 10、20、30...。
      peers.forEach((p, i) => { p.order = (i + 1) * 10; });

      const idx = peers.findIndex(e => e.id === empId);
      if (idx < 0) return;
      const target = direction < 0 ? idx - 1 : idx + 1;
      if (target < 0 || target >= peers.length) return;

      const [moved] = peers.splice(idx, 1);
      peers.splice(target, 0, moved);
      peers.forEach((p, i) => {
        p.order = (i + 1) * 10;
        savePersonnelOverrideForCurrentMonth(p);
      });

      queuePersonnelCloudSave();
      buildRoleTabsAndRender();
    }

    // v10.4：人員順序改為拖曳排序，支援滑鼠 / 觸控筆 / 手指。
    let scheduleDragState = null;

    function scheduleNormalizePeerOrders(role, group) {
      const peers=employees.filter(e=>e.role===role && e.group===group).sort(compareScheduleEmployeeOrder);
      peers.forEach((p,i)=>{p.order=(i+1)*10;});
      return peers;
    }

    function scheduleCommitDragOrder(sourceId, targetId, insertAfter=false) {
      if (!requireScheduleEditLock()) return;
      if (!sourceId || !targetId || sourceId===targetId) return;
      const source=employees.find(e=>e.id===sourceId);
      const target=employees.find(e=>e.id===targetId);
      if(!source || !target) return;
      if(source.role!==target.role || source.group!==target.group){
        if(typeof showScheduleToast==='function') showScheduleToast('拖曳排序只能在同一職務、同一組別內調整','warning');
        else alert('拖曳排序只能在同一職務、同一組別內調整');
        return;
      }
      const peers=scheduleNormalizePeerOrders(source.role,source.group);
      const from=peers.findIndex(e=>e.id===sourceId);
      let to=peers.findIndex(e=>e.id===targetId);
      if(from<0 || to<0)return;
      const [moved]=peers.splice(from,1);
      to=peers.findIndex(e=>e.id===targetId);
      if(insertAfter) to+=1;
      peers.splice(Math.max(0,Math.min(to,peers.length)),0,moved);
      peers.forEach((p,i)=>{ p.order=(i+1)*10; savePersonnelOverrideForCurrentMonth(p); });
      queuePersonnelCloudSave();
      buildRoleTabsAndRender();
    }

    function scheduleDragHandlePointerDown(ev, empId) {
      if(!scheduleCanEditNow() || !requireScheduleEditLock()) return;
      if(ev.button!==undefined && ev.button!==0) return;
      const source=employees.find(e=>e.id===empId); if(!source)return;
      scheduleDragState={sourceId:empId,targetId:empId,insertAfter:false,pointerId:ev.pointerId};
      ev.currentTarget?.closest?.('[data-p79-drag-emp]')?.classList.add('p79-drag-source');
      try{ev.currentTarget.setPointerCapture?.(ev.pointerId)}catch(e){}
      ev.preventDefault();
    }

    function scheduleDragPointerMove(ev) {
      if(!scheduleDragState)return;
      const row=document.elementFromPoint(ev.clientX,ev.clientY)?.closest?.('[data-p79-drag-emp]');
      document.querySelectorAll('[data-p79-drag-emp].p79-drag-target-before,[data-p79-drag-emp].p79-drag-target-after').forEach(x=>x.classList.remove('p79-drag-target-before','p79-drag-target-after'));
      if(!row)return;
      const targetId=row.dataset.p79DragEmp||'';
      const source=employees.find(e=>e.id===scheduleDragState.sourceId);
      const target=employees.find(e=>e.id===targetId);
      if(!source||!target||source.role!==target.role||source.group!==target.group)return;
      const rect=row.getBoundingClientRect();
      const after=ev.clientY > rect.top + rect.height/2;
      scheduleDragState.targetId=targetId; scheduleDragState.insertAfter=after;
      row.classList.add(after?'p79-drag-target-after':'p79-drag-target-before');
      ev.preventDefault();
    }

    function scheduleDragPointerUp(ev) {
      if(!scheduleDragState)return;
      const state=scheduleDragState; scheduleDragState=null;
      document.querySelectorAll('[data-p79-drag-emp]').forEach(x=>x.classList.remove('p79-drag-source','p79-drag-target-before','p79-drag-target-after'));
      if(state.targetId && state.targetId!==state.sourceId) scheduleCommitDragOrder(state.sourceId,state.targetId,state.insertAfter);
      ev?.preventDefault?.();
    }

    document.addEventListener('pointermove',scheduleDragPointerMove,{passive:false});
    document.addEventListener('pointerup',scheduleDragPointerUp,{passive:false});
    document.addEventListener('pointercancel',scheduleDragPointerUp,{passive:false});

    function toggleRuleInputsVisibility() {
      const algo = document.getElementById('schedule-algorithm').value;
      const el = document.getElementById('rule-inputs-container');
      el.style.display = (algo === 'CUSTOM_DAYS') ? 'flex' : 'none';
    }

    async function promptAddNewGroup() {
      if (!requireScheduleEditLock()) return;
      const groupName = prompt("請輸入您要新增的組別名稱（例：甲組、A組）：");
      if (!(groupName && groupName.trim())) return;

      const cleanName = groupName.trim();
      if (availableGroups.includes(cleanName)) {
        alert("該組別名稱已存在！");
        return;
      }

      const before = [...availableGroups];
      const nonShiftIdx = availableGroups.indexOf('不輪班');
      if(nonShiftIdx >= 0) availableGroups.splice(nonShiftIdx, 0, cleanName);
      else availableGroups.push(cleanName);
      buildRoleTabsAndRender();

      // 組別是獨立主檔：必須先確認 Google 雲端真的寫入成功，才顯示「新增成功」。
      const ok = await saveScheduleGroupsImmediate();
      if (!ok) {

    function calculateShiftForDay(emp, empIndexInRole, dayNum, dayOfWeek) {
      if (emp.lockType === 'FIXED_LOCKED') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }
      if (emp.group === '不輪班') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }

      const algo = document.getElementById('schedule-algorithm').value;
      if (algo === 'WEEKEND_OFF') return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      if (algo === 'FIXED_EARLY') return '早';

      const offset = empIndexInRole * 2;

      if (algo === 'TWO_TWO') {
        const cycle = ['早', '早', '休', '休', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      if (algo === 'FOUR_TWO') {
        const cycle = ['早', '早', '早', '早', '休', '休', '中', '中', '中', '中', '休', '休', '晚', '晚', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      const ew = parseInt(document.getElementById('early-work-input').value) || 0;
      const eo = parseInt(document.getElementById('early-off-input').value) || 0;
      const mw = parseInt(document.getElementById('mid-work-input').value) || 0;
      const mo = parseInt(document.getElementById('mid-off-input').value) || 0;
      const nw = parseInt(document.getElementById('night-work-input').value) || 0;
      const no = parseInt(document.getElementById('night-off-input').value) || 0;

      const cycleLength = ew + eo + mw + mo + nw + no;
      if (cycleLength === 0) return '休';

      const pos = (dayNum - 1 + offset) % cycleLength;

      const p1 = ew;
      const p2 = p1 + eo;
      const p3 = p2 + mw;
      const p4 = p3 + mo;
      const p5 = p4 + nw;

      if (pos < p1) return '早';
      if (pos < p2) return '休';
      if (pos < p3) return '中';
      if (pos < p4) return '休';
      if (pos < p5) return '晚';
      return '休';
    }

    function initDefaultScheduleData(yearMonth, persistLocal = true) {
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = sortScheduleEmployeesForRole(employees.filter(e => e.role === roleName));
        roleEmps.forEach((emp, idx) => {
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            if(!monthlyScheduleData[emp.id][dayStr]) {
              monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
            }
          }
        });
      });
      if (persistLocal) saveAllDataToLocalStorage();
    }

    function scheduleEscapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function normalizeScheduleDate(value) {
      const s = String(value || '').trim();
      const m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';
    }

    function approvedLeaveRecordsOnDate(dayStr) {
      return (leaveRecords || []).filter(item => {
        if (String(item?.status || '') !== '已核准') return false;
        const start = normalizeScheduleDate(item?.startTime || item?.startDate);
        const end = normalizeScheduleDate(item?.endTime || item?.endDate);
        return !!start && !!end && dayStr >= start && dayStr <= end;
      });
    }

    function approvedLeaveForEmployee(empId, dayStr) {
      const id = String(empId || '').trim().toUpperCase();
      return approvedLeaveRecordsOnDate(dayStr).find(item => String(item?.empId || '').trim().toUpperCase() === id) || null;
    }

    function getSubstituteRecommendation(unitRole, targetEmpId, dayStr) {
      const sameRoleEmps = employees.filter(e => e.role === unitRole && e.id !== targetEmpId);
      let candidates = [];
      sameRoleEmps.forEach(cand => {
        const candShift = monthlyScheduleData[cand.id] && monthlyScheduleData[cand.id][dayStr];
        if (candShift === '休' || candShift === '特') {
          candidates.push(`${cand.name}(${cand.id}) - 當日休假`);
        }
      });
      if (candidates.length > 0) return `💡 建議代班: ${candidates.join(', ')}`;
      return '⚠️ 當日無人休假，需跨單位支援';
    }

    function renderRoleScheduleView() {
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);

          comp = a.name.localeCompare(b.name, 'zh-Hant');

    function autoScheduleCurrentTab() {
      if (!requireScheduleEditLock()) return;
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = sortScheduleEmployeesForRole(employees.filter(e => e.role === roleName));
        roleEmps.forEach((emp, idx) => {
          if (emp.lockType === 'FIXED_LOCKED') return;
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
          }
        });
      });

      saveAllDataToLocalStorage();
      queueScheduleCloudSave();

    function normalizeImportedScheduleShift(value) {
      const raw = String(value ?? '').replace(/\u3000/g, ' ').trim();
      if (!raw) return '';
      const compact = raw.replace(/\s+/g, '');
      const map = {
        '早':'早','早班':'早',
        '中':'中','中班':'中',
        '晚':'晚','晚班':'晚',
        '休':'休','休息':'休','休假':'休','例休':'休','例假':'休','輪休':'休',
        '特':'特','特休':'特','特別休假':'特',
        '事':'事','事假':'事',
        '病':'病','病假':'病',
        '公':'公','公假':'公',
        '喪':'喪','喪假':'喪'
      };
      return Object.prototype.hasOwnProperty.call(map, compact) ? map[compact] : null;
    }

    function findImportColumnKey(row, candidates) {
      const keys = Object.keys(row || {});
      for (const cand of candidates) {
        const hit = keys.find(k => String(k).trim().toLowerCase() === String(cand).trim().toLowerCase());
        if (hit != null) return hit;
      }
      return '';
    }

    async function handleScheduleImportFile(event) {
      const input = event && event.target ? event.target : document.getElementById('schedule-import-file');
      const file = input && input.files && input.files[0];
      if (!file) return;

      try {
        if (!canManageSchedule()) throw new Error('此帳號沒有排班管理權限');
        if (!scheduleCanEditNow()) throw new Error('目前沒有取得排班編輯權，請重新整理後再試');
        if (typeof XLSX === 'undefined') throw new Error('Excel 元件尚未載入');

        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: 'array', cellDates: false });
        if (!wb.SheetNames || !wb.SheetNames.length) throw new Error('Excel 內沒有可讀取的工作表');

        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
        if (!rows.length) throw new Error('第一個工作表沒有班表資料');

        const sample = rows.find(r => Object.values(r || {}).some(v => String(v ?? '').trim() !== '')) || rows[0];
        const empIdKey = findImportColumnKey(sample, ['工號','員工編號','考勤號','empId','ID']);
        const nameKey = findImportColumnKey(sample, ['姓名','員工姓名','name']);
        if (!empIdKey && !nameKey) {
          throw new Error('找不到「工號／員工編號／考勤號」或「姓名」欄位。請使用系統匯出的班表格式。');
        }

        const yearMonth = String(document.getElementById('month-picker')?.value || '').trim();
        if (!/^\d{4}-\d{2}$/.test(yearMonth)) throw new Error('目前排班月份格式不正確');
        const [year, month] = yearMonth.split('-').map(Number);
        const totalDays = getDaysInMonth(year, month);

        const byId = new Map((employees || []).map(e => [String(e.id || '').trim().toUpperCase(), e]));
        const byName = new Map();
        (employees || []).forEach(e => {
          const n = String(e.name || '').trim();
          if (!n) return;
          if (!byName.has(n)) byName.set(n, []);
          byName.get(n).push(e);
        });

        let matchedRows = 0;
        let updatedCells = 0;
        const notFound = [];
        const ambiguous = [];
        const invalid = [];

        for (let r = 0; r < rows.length; r++) {
          const row = rows[r] || {};
          const rawId = empIdKey ? String(row[empIdKey] ?? '').trim().toUpperCase() : '';
          const rawName = nameKey ? String(row[nameKey] ?? '').trim() : '';
          let emp = rawId ? byId.get(rawId) : null;

          if (!emp && rawName) {
            const sameName = byName.get(rawName) || [];
            if (sameName.length === 1) emp = sameName[0];
            else if (sameName.length > 1) ambiguous.push(`${rawName}（同名 ${sameName.length} 人）`);
          }

          if (!emp) {
            if (rawId || rawName) notFound.push(rawId || rawName);
            continue;
          }
          matchedRows++;
          if (!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          if (!monthlyScheduleMeta[emp.id]) monthlyScheduleMeta[emp.id] = {};

          for (let d = 1; d <= totalDays; d++) {
            const dd = String(d).padStart(2, '0');
            const candidates = [
              `${d}日`, `${dd}日`, String(d), dd,
              `${month}/${d}`, `${month}/${dd}`,
              `${yearMonth}-${dd}`, `${year}/${String(month).padStart(2,'0')}/${dd}`
            ];
            const dayKey = findImportColumnKey(row, candidates);
            if (!dayKey) continue;
            const rawShift = row[dayKey];
            if (String(rawShift ?? '').trim() === '') continue;

            const normalized = normalizeImportedScheduleShift(rawShift);
            if (normalized === null) {
              invalid.push(`第 ${r + 2} 列 ${d}日：${String(rawShift)}`);
              continue;
            }

            const dateKey = `${yearMonth}-${dd}`;
            monthlyScheduleData[emp.id][dateKey] = normalized || '休';
            if (monthlyScheduleMeta[emp.id][dateKey]) delete monthlyScheduleMeta[emp.id][dateKey];
            updatedCells++;
          }
        }

        if (!matchedRows) {
          throw new Error('Excel 裡的人員沒有任何一位能和目前人資主檔對上。請確認工號／姓名是否一致。');
        }
        if (!updatedCells) {
          throw new Error('有找到人員，但沒有讀到任何 1日～31日 的班別欄位。請使用系統匯出的班表格式。');
        }

        saveAllDataToLocalStorage();
        buildRoleTabsAndRender();

        const ok = await saveScheduleMonthToCloud(false);
        if (!ok) throw new Error(lastScheduleCloudError || '班表已讀入瀏覽器，但同步 Google 雲端失敗');

        const notes = [];
        if (notFound.length) notes.push(`找不到人員：${[...new Set(notFound)].slice(0, 8).join('、')}${notFound.length > 8 ? '…' : ''}`);
        if (ambiguous.length) notes.push(`同名無法判斷：${[...new Set(ambiguous)].slice(0, 5).join('、')}`);
        if (invalid.length) notes.push(`略過無法辨識班別 ${invalid.length} 格，例如：${invalid.slice(0, 3).join('；')}`);

        alert(`✅ 班表匯入完成\n月份：${yearMonth}\n對到人員：${matchedRows} 列\n更新班別：${updatedCells} 格\n並已同步 Google 雲端${notes.length ? '\n\n⚠️ ' + notes.join('\n⚠️ ') : ''}`);
      } catch (err) {
        console.error('班表匯入失敗：', err);
        alert('❌ 班表匯入失敗：\n' + (err?.message || err));
      } finally {
        if (input) input.value = '';
      }
    }

    function exportScheduleToExcel() {
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      const sortedEmps = [...employees].sort((a, b) => {
        const rDiff = getRolePriority(a.role) - getRolePriority(b.role);
        if (rDiff !== 0) return rDiff;
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return a.id.localeCompare(b.id);
      });

      const exportRows = [];
      sortedEmps.forEach(emp => {
        const row = {
          '工號': emp.id,
          '姓名': emp.name,
          '職稱': emp.role,
          '組別': emp.group,
          '排班屬性': emp.lockType === 'FIXED_LOCKED' ? '固定鎖定' : '自動輪班'
        };

        for(let d = 1; d <= totalDays; d++) {
          const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
          row[`${d}日`] = (monthlyScheduleData[emp.id] && monthlyScheduleData[emp.id][dayStr]) || '休';
        }

        exportRows.push(row);
      });

      const ws = XLSX.utils.json_to_sheet(exportRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${yearMonth}全廠班表`);
      XLSX.writeFile(wb, `${yearMonth}_全月排班表.xlsx`);
    }
  </script>

    s=s.replace(/\b((?:19|20)\d{2})(?:[\/-])(\d{1,2})(?:[\/-])(\d{1,2})\b/g,(m,y,mo,d)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
