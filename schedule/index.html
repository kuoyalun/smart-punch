<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>員工總表｜整月份緊縮版</title>
<style>
  :root{
    --bg:#f5f8fb;
    --panel:#ffffff;
    --line:#d9e1ea;
    --line2:#e7edf3;
    --text:#22313f;
    --muted:#6f7f8f;
    --teal:#0f9d8f;
    --teal-dark:#0b8579;
    --purple:#8b5cf6;
    --holiday:#e15759;
    --head:#eaf1f8;
    --dayw:44px;
    --leftw:202px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--text);
    background:var(--bg);
  }
  .wrap{padding:10px}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.05);
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 16px 10px;
    border-bottom:1px solid var(--line2);
    flex-wrap:wrap;
  }
  .title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:800;
    font-size:20px;
  }
  .count{
    font-size:13px;
    padding:4px 10px;
    border-radius:999px;
    background:#edf3ff;
    color:#4455aa;
    border:1px solid #cfd9f4;
  }
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    border:0;
    border-radius:12px;
    padding:10px 16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
  }
  .btn.save{background:#72c3b1;color:white}
  .btn.ai{background:#f0b56c;color:white}
  .filters{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    flex-wrap:wrap;
  }
  .filters .label{font-weight:700;font-size:14px}
  .chip{
    border:1px solid #cad5e0;
    background:#f7f9fc;
    color:#2e3d4f;
    padding:9px 14px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
  }
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .board{
    width:100%;
    overflow:auto;
    border-top:1px solid var(--line2);
  }
  .grid{
    display:grid;
    grid-template-columns: var(--leftw) repeat(31,var(--dayw));
    min-width:calc(var(--leftw) + 31 * var(--dayw));
  }
  .cell{
    min-height:58px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line2);
    background:#fff;
  }
  .head{
    position:sticky;
    top:0;
    z-index:20;
    min-height:60px;
    background:var(--head);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:13px;
    line-height:1.15;
  }
  .head.left{
    position:sticky;
    left:0;
    z-index:30;
    align-items:flex-start;
    padding:0 10px;
    font-weight:800;
  }
  .date{font-size:16px}
  .dow{font-size:12px;margin-top:5px}
  .sun .dow,.holiday .dow,.holiday .date{color:var(--holiday)}
  .emp{
    position:sticky;
    left:0;
    z-index:10;
    padding:7px 8px;
    background:#fff;
    min-height:116px;
  }
  .emp-row1{
    display:grid;
    grid-template-columns:minmax(0,1fr) 54px 30px;
    gap:5px;
    align-items:center;
  }
  .name{
    font-weight:800;
    font-size:15px;
    line-height:1.15;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status{
    text-align:center;
    border:1px solid #cbd6e2;
    background:#eef3f8;
    border-radius:8px;
    padding:5px 2px;
    font-size:12px;
    font-weight:700;
  }
  .drag{
    height:28px;
    border:1px solid #d9dff6;
    background:#f4f3ff;
    color:#8b84e8;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;
  }
  .emp-row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:5px;
  }
  select{
    width:100%;
    min-width:0;
    height:29px;
    border:1px solid #cbd6e2;
    border-radius:8px;
    background:#fff;
    padding:0 6px;
    font-size:12px;
    color:#334155;
  }
  .meta{
    display:flex;
    justify-content:space-between;
    gap:6px;
    margin-top:6px;
    font-size:11px;
    color:#536274;
  }
  .meta .role{color:#8b3fd1;font-weight:800;white-space:nowrap}
  .shift{
    min-height:116px;
    padding:10px 3px 5px;
    text-align:center;
    background:linear-gradient(#fff,#fbfdff);
    font-size:13px;
    color:#55616f;
  }
  .tag{
    margin-top:17px;
    padding:7px 2px;
    border-radius:12px;
    background:#f7f9fb;
    color:#9aa5af;
    font-size:12px;
  }
  .footnote{
    padding:8px 14px 12px;
    font-size:12px;
    color:#667788;
    background:#fbfcfe;
  }
  @media (min-width:1800px){
    :root{--dayw:52px;--leftw:196px}
  }
  @media (max-width:1366px){
    :root{--dayw:42px;--leftw:188px}
    .topbar{padding:10px 12px}
    .filters{padding:8px 10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="topbar">
      <div class="title">🟩 員工總表 <span class="count">66 人</span></div>
      <div class="actions">
        <button class="btn save">💾 ☁ 儲存雲端【全廠】排班</button>
        <button class="btn ai">🪄 執行【全廠】智慧錯開排班</button>
      </div>
    </div>

    <div class="filters">
      <span class="label">🔽 組別篩選切換：</span>
      <button class="chip active">全部 人員 (66)</button>
      <button class="chip">不分組 (24)</button>
      <button class="chip">A組 (10)</button>
      <button class="chip">B組 (11)</button>
      <button class="chip">C組 (11)</button>
      <button class="chip">D組 (10)</button>
      <button class="chip">不輪班 (0)</button>
    </div>

    <div class="board">
      <div class="grid" id="grid"></div>
    </div>
    <div class="footnote">
      已將左側「姓名 / 狀態 / 組別」壓縮至約 188–202px；日期欄縮至 42–52px。寬螢幕可直接顯示整月份，較小螢幕則保留橫向捲動。
    </div>
  </div>
</div>

<script>
const employees = [
  {name:"宋文豪", no:"AN1140032", role:"領班"},
  {name:"呂學忠", no:"AP0890026", role:"領班"},
  {name:"胡毓麒", no:"AP0920021", role:"領班"},
  {name:"陳志明", no:"AN1050018", role:"A組"},
  {name:"林俊宏", no:"AP0980042", role:"B組"}
];
const shifts = ["中","中","休","休","早","早","中","中","休","休","早","早"];
const dows = ["四","五","六","日","一","二","三"];
const grid = document.getElementById("grid");

function addCell(cls, html){
  const el = document.createElement("div");
  el.className = "cell " + cls;
  el.innerHTML = html;
  grid.appendChild(el);
}
addCell("head left","姓名 / 狀態 / 組別標籤");
for(let d=1; d<=31; d++){
  const dow = dows[(d-1)%7];
  const holiday = (d===10);
  const sunday = dow==="日";
  addCell("head " + (holiday?"holiday ":"") + (sunday?"sun ":""),
    `<div class="date">${d}</div><div class="dow">${holiday?"國定":dow}</div>`);
}
employees.forEach((e,idx)=>{
  addCell("emp",`
    <div class="emp-row1">
      <div class="name" title="${e.name}">${e.name}</div>
      <div class="status">不分組</div>
      <div class="drag">⋮⋮</div>
    </div>
    <div class="emp-row2">
      <select><option>領班</option><option>A組</option><option>B組</option></select>
      <select><option>不分組</option><option>A組</option><option>B組</option></select>
    </div>
    <div class="meta"><span>工號：${e.no}</span><span class="role">現屬：${e.role}</span></div>
  `);
  for(let d=1; d<=31; d++){
    const s = shifts[(d-1+idx*2)%shifts.length];
    addCell("shift",`<div>${s}</div><div class="tag">代班</div>`);
  }
});

document.querySelectorAll(".chip").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
  });
});
</script>
</body>
</html>
