<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS 考勤系統入口</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #111827;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(0,0,0,.12);
      overflow: hidden;
    }
    .header {
      background: #111827;
      color: white;
      padding: 28px;
      text-align: center;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }
    .body { padding: 26px; }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }
    .mode-btn {
      padding: 22px 12px;
      border: 2px solid #d1d5db;
      background: #fff;
      border-radius: 16px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 800;
    }
    .mode-btn.active {
      border-color: #4f46e5;
      background: #eef2ff;
      color: #3730a3;
    }
    .panel {
      display: none;
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
    }
    .panel.show { display: block; }
    .field { margin-bottom: 15px; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    .status {
      margin-bottom: 15px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-size: 14px;
      white-space: pre-line;
    }
    .status.error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }
    .status.success {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #047857;
    }
    .hint {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }
    .go-btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .go-btn:disabled { opacity: .55; cursor: not-allowed; }
    .menu {
      display: none;
      margin-top: 15px;
      gap: 10px;
    }
    .menu.show { display: grid; }
    .menu a {
      text-align: center;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-weight: 800;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>GPS 考勤系統</h1>
      <p>請選擇登入身分</p>
    </div>

    <div class="body">
      <div class="mode-grid">
        <button id="employeeMode" class="mode-btn" type="button">一般員工</button>
        <button id="adminMode" class="mode-btn" type="button">管理員</button>
      </div>

      <div id="employeePanel" class="panel">
        <div class="status success">一般員工模式</div>
        <p class="hint">按 Enter 或點下面按鈕，即可直接進入考勤系統。</p>
        <button id="employeeEnterBtn" class="go-btn" type="button">進入考勤系統</button>
      </div>

      <div id="adminPanel" class="panel">
        <div id="status" class="status">請先選擇「管理員」，系統會讀取雲端管理員名單。</div>

        <div class="field">
          <label for="adminSelect">管理員</label>
          <select id="adminSelect" disabled>
            <option value="">尚未讀取</option>
          </select>
        </div>

        <div class="field">
          <label for="password">密碼</label>
          <input id="password" type="password" placeholder="請輸入密碼" autocomplete="current-password">
        </div>

        <p class="hint">選好管理員、輸入密碼後，直接按鍵盤 Enter 即可登入，不必再按登入按鈕。</p>

        <div id="menuArea" class="menu">
          <a href="./attendance/">進入考勤管理</a>
          <a href="./schedule/">進入排班管理</a>
        </div>
      </div>
    </div>
  </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec";
let currentMode = "";
let adminsLoaded = false;

const employeeMode = document.getElementById("employeeMode");
const adminMode = document.getElementById("adminMode");
const employeePanel = document.getElementById("employeePanel");
const adminPanel = document.getElementById("adminPanel");
const employeeEnterBtn = document.getElementById("employeeEnterBtn");
const adminSelect = document.getElementById("adminSelect");
const password = document.getElementById("password");
const statusBox = document.getElementById("status");
const menuArea = document.getElementById("menuArea");

employeeMode.addEventListener("click", () => setMode("employee"));
adminMode.addEventListener("click", () => setMode("admin"));
employeeEnterBtn.addEventListener("click", goAttendance);

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;

  if (currentMode === "employee") {
    e.preventDefault();
    goAttendance();
    return;
  }

  if (currentMode === "admin") {
    e.preventDefault();
    loginAdmin();
  }
});

async function setMode(mode) {
  currentMode = mode;

  employeeMode.classList.toggle("active", mode === "employee");
  adminMode.classList.toggle("active", mode === "admin");
  employeePanel.classList.toggle("show", mode === "employee");
  adminPanel.classList.toggle("show", mode === "admin");

  if (mode === "admin" && !adminsLoaded) {
    await loadAdminUsers();
  }

  if (mode === "admin") {
    setTimeout(() => {
      if (!adminSelect.disabled) adminSelect.focus();
    }, 100);
  }
}

function goAttendance() {
  window.location.href = "./attendance/";
}

async function loadAdminUsers() {
  statusBox.className = "status";
  statusBox.textContent = "正在讀取 Google 雲端管理員名單...";

  try {
    const response = await fetch(GAS_URL + "?action=getAdminUsers&t=" + Date.now(), {
      method: "GET",
      cache: "no-store",
      redirect: "follow"
    });

    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch (e) {
      throw new Error("GAS 回傳的不是 JSON，請確認部署權限為「任何人」。");
    }

    if (!data.ok) throw new Error(data.error || "無法讀取管理員名單");

    const admins = Array.isArray(data.admins) ? data.admins : [];

    adminSelect.innerHTML = '<option value="">-- 請選擇管理員 --</option>';

    admins.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.empId;
      const role = a.adminRole === "superadmin" ? "超級管理員" : "管理員";
      opt.textContent = `${a.name || a.empId}（${a.empId}｜${role}）`;
      adminSelect.appendChild(opt);
    });

    adminSelect.disabled = false;
    adminsLoaded = true;

    statusBox.className = "status success";
    statusBox.textContent = `已讀取 ${admins.length} 位管理員，請選擇帳號後輸入密碼。`;

  } catch (err) {
    statusBox.className = "status error";
    statusBox.textContent = "讀取失敗：" + (err?.message || err);
  }
}

async function loginAdmin() {
  const empId = adminSelect.value;
  const pwd = password.value.trim();

  if (!empId) {
    statusBox.className = "status error";
    statusBox.textContent = "請先選擇管理員。";
    adminSelect.focus();
    return;
  }

  if (!pwd) {
    statusBox.className = "status error";
    statusBox.textContent = "請輸入密碼。";
    password.focus();
    return;
  }

  statusBox.className = "status";
  statusBox.textContent = "正在驗證管理員身分...";

  try {
    const response = await fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "verifyAdmin",
        empId: empId,
        password: pwd
      })
    });

    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch (e) {
      throw new Error("GAS 登入驗證回傳的不是 JSON。");
    }

    if (!data.ok || !data.admin) {
      throw new Error(data.error || "帳號或密碼錯誤");
    }

    const role = String(data.adminRole || "").toLowerCase();
    if (role !== "admin" && role !== "superadmin") {
      throw new Error("此帳號沒有管理員權限");
    }

    sessionStorage.setItem("admin_session", JSON.stringify({
      empId: data.empId || empId,
      name: data.name || "",
      dept: data.dept || "",
      adminRole: role,
      loginAt: new Date().toISOString()
    }));

    statusBox.className = "status success";
    statusBox.textContent = "登入成功。";
    menuArea.classList.add("show");

    // 登入成功後直接進考勤管理，不需要再點按鈕
    setTimeout(() => {
      window.location.href = "./attendance/";
    }, 350);

  } catch (err) {
    statusBox.className = "status error";
    statusBox.textContent = "登入失敗：" + (err?.message || err);
    password.select();
  }
}
</script>
</body>
</html>
