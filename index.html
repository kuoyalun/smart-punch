<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理員系統入口</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }
    .header {
      padding: 28px 28px 18px;
      background: #0f172a;
      color: #ffffff;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .header p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
    }
    .body {
      padding: 26px 28px 30px;
    }
    .status {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .status.error {
      background: #fff1f2;
      color: #be123c;
      border-color: #fecdd3;
    }
    .status.success {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    select:focus, input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }
    .field {
      margin-bottom: 16px;
    }
    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      transition: 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .links {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }
    .link-btn {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 11px 14px;
      border-radius: 10px;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      color: #334155;
      background: #f8fafc;
    }
    .hidden {
      display: none;
    }
    .small-note {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>管理員系統入口</h1>
      <p>僅限 Google 雲端「員工清單」中的 admin / superadmin 登入。</p>
    </div>

    <div class="body">
      <div id="status" class="status">正在讀取雲端管理員名單...</div>

      <div class="field">
        <label for="adminSelect">管理員帳號</label>
        <select id="adminSelect" disabled>
          <option value="">載入中...</option>
        </select>
        <div id="adminMeta" class="meta"></div>
      </div>

      <div class="field">
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="請輸入管理員密碼" />
      </div>

      <button id="loginBtn" onclick="loginAdmin()" disabled>登入管理系統</button>

      <div id="successArea" class="links hidden">
        <a id="attendanceAdminLink" class="link-btn" href="#" target="_self">進入考勤管理</a>
        <a id="scheduleAdminLink" class="link-btn" href="#" target="_self">進入排班管理</a>
      </div>

      <div class="small-note">
        一般員工不會出現在此入口。若不是管理員，請使用原本的考勤系統登入。
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';

    // 請依你的實際 GitHub Pages 路徑修改這兩個網址。
    // 如果檔名不同，只要改下面兩行即可。
    const ATTENDANCE_ADMIN_URL = './attendance/index.html';
    const SCHEDULE_ADMIN_URL = './schedule/index.html';

    let adminUsers = [];

    window.addEventListener('load', function() {
      document.getElementById('attendanceAdminLink').href = ATTENDANCE_ADMIN_URL;
      document.getElementById('scheduleAdminLink').href = SCHEDULE_ADMIN_URL;
      loadAdminUsers();
    });

    async function loadAdminUsers() {
      const status = document.getElementById('status');
      const select = document.getElementById('adminSelect');
      const loginBtn = document.getElementById('loginBtn');

      try {
        const response = await fetch(GAS_URL + '?action=getAdminUsers', {
          method: 'GET',
          cache: 'no-store'
        });

        const text = await response.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('GAS 回傳的不是 JSON，請確認部署網址與版本。');
        }

        if (!data.ok) {
          throw new Error(data.error || '無法讀取管理員名單');
        }

        adminUsers = Array.isArray(data.admins) ? data.admins : [];

        if (adminUsers.length === 0) {
          select.innerHTML = '<option value="">目前沒有可登入的管理員</option>';
          status.className = 'status error';
          status.textContent = '雲端員工清單中沒有 admin / superadmin。';
          return;
        }

        select.innerHTML = '<option value="">-- 請選擇管理員 --</option>' +
          adminUsers.map(function(admin) {
            const roleLabel = admin.adminRole === 'superadmin' ? '超級管理員' : '管理員';
            const name = admin.name || admin.empId;
            return '<option value="' + escapeHtml(admin.empId) + '">' +
              escapeHtml(name) + '（' + escapeHtml(admin.empId) + '｜' + roleLabel + '）' +
              '</option>';
          }).join('');

        select.disabled = false;
        loginBtn.disabled = false;

        select.addEventListener('change', updateAdminMeta);

        status.className = 'status success';
        status.textContent = '已成功讀取 ' + adminUsers.length + ' 位管理員。';
      } catch (err) {
        select.innerHTML = '<option value="">載入失敗</option>';
        status.className = 'status error';
        status.textContent = '讀取失敗：' + (err && err.message ? err.message : err);
      }
    }

    function updateAdminMeta() {
      const empId = document.getElementById('adminSelect').value;
      const meta = document.getElementById('adminMeta');

      const admin = adminUsers.find(function(item) {
        return item.empId === empId;
      });

      if (!admin) {
        meta.textContent = '';
        return;
      }

      const roleLabel = admin.adminRole === 'superadmin' ? '超級管理員' : '管理員';
      const parts = [
        roleLabel,
        admin.dept || '',
        admin.jobTitle || ''
      ].filter(Boolean);

      meta.textContent = parts.join('｜');
    }

    async function loginAdmin() {
      const empId = document.getElementById('adminSelect').value;
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('loginBtn');

      if (!empId) {
        status.className = 'status error';
        status.textContent = '請先選擇管理員帳號。';
        return;
      }

      if (!password) {
        status.className = 'status error';
        status.textContent = '請輸入管理員密碼。';
        return;
      }

      btn.disabled = true;
      btn.textContent = '驗證中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'verifyAdmin',
            empId: empId,
            password: password
          })
        });

        const text = await response.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('GAS 回傳格式錯誤。');
        }

        if (!data.ok || !data.admin) {
          throw new Error(data.error || '帳號或密碼錯誤');
        }

        const role = String(data.adminRole || '').toLowerCase();

        if (role !== 'admin' && role !== 'superadmin') {
          throw new Error('此帳號沒有管理員入口權限');
        }

        sessionStorage.setItem('admin_session', JSON.stringify({
          empId: data.empId,
          name: data.name || '',
          dept: data.dept || '',
          adminRole: role,
          loginAt: new Date().toISOString()
        }));

        status.className = 'status success';
        status.textContent = '登入成功：' + (data.name || data.empId) + '（' +
          (role === 'superadmin' ? '超級管理員' : '管理員') + '）';

        document.getElementById('successArea').classList.remove('hidden');
      } catch (err) {
        status.className = 'status error';
        status.textContent = '登入失敗：' + (err && err.message ? err.message : err);
      } finally {
        btn.disabled = false;
        btn.textContent = '登入管理系統';
      }
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
