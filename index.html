<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS 考勤管理系統入口</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #1f2937;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .12);
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }
    .header {
      background: #111827;
      color: white;
      padding: 28px;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .header p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 14px;
    }
    .body { padding: 26px 28px 30px; }
    .status {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      white-space: pre-line;
    }
    .status.error {
      background: #fff1f2;
      color: #be123c;
      border-color: #fecdd3;
    }
    .status.success {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      background: white;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .12);
    }
    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: #4f46e5;
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .links {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }
    .link-btn {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 12px 14px;
      border-radius: 11px;
      font-weight: 800;
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .hidden { display: none; }
    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>GPS 考勤管理系統</h1>
      <p>此入口僅限超級管理員與管理員登入。一般員工請使用考勤系統。</p>
    </div>

    <div class="body">
      <div id="status" class="status">正在讀取 Google 雲端管理員名單...</div>

      <div class="field">
        <label for="adminSelect">管理員</label>
        <select id="adminSelect" disabled>
          <option value="">讀取中...</option>
        </select>
        <div id="adminMeta" class="meta"></div>
      </div>

      <div class="field">
        <label for="password">密碼</label>
        <input id="password" type="password" placeholder="請輸入管理員密碼" autocomplete="current-password">
      </div>

      <button id="loginBtn" disabled>登入管理系統</button>

      <div id="menuArea" class="links hidden">
        <a class="link-btn" href="./attendance/">進入考勤管理</a>
        <a class="link-btn" href="./schedule/">進入排班管理</a>
      </div>

      <div class="note">
        管理員名單來自 Google Sheet「員工清單」的 admin / superadmin。
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec";

    let adminUsers = [];

    window.addEventListener("load", () => {
      document.getElementById("loginBtn").addEventListener("click", loginAdmin);
      document.getElementById("adminSelect").addEventListener("change", updateAdminMeta);
      loadAdminUsers();
    });

    async function loadAdminUsers() {
      const status = document.getElementById("status");
      const select = document.getElementById("adminSelect");
      const loginBtn = document.getElementById("loginBtn");

      try {
        const url = GAS_URL + "?action=getAdminUsers&t=" + Date.now();

        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          redirect: "follow"
        });

        const raw = await response.text();

        let data;
        try {
          data = JSON.parse(raw);
        } catch (e) {
          throw new Error(
            "GAS 回傳的不是 JSON。\n" +
            "請確認 Apps Script 已重新部署為「網頁應用程式」，而且存取權限設為「任何人」。"
          );
        }

        if (!data.ok) {
          throw new Error(data.error || "無法讀取管理員名單");
        }

        adminUsers = Array.isArray(data.admins) ? data.admins : [];

        if (adminUsers.length === 0) {
          select.innerHTML = '<option value="">沒有可登入的管理員</option>';
          status.className = "status error";
          status.textContent = "雲端員工清單中沒有 admin / superadmin。";
          return;
        }

        select.innerHTML = '<option value="">-- 請選擇管理員 --</option>';

        adminUsers.forEach(admin => {
          const option = document.createElement("option");
          option.value = admin.empId;
          const roleLabel = admin.adminRole === "superadmin" ? "超級管理員" : "管理員";
          option.textContent = `${admin.name || admin.empId}（${admin.empId}｜${roleLabel}）`;
          select.appendChild(option);
        });

        select.disabled = false;
        loginBtn.disabled = false;

        status.className = "status success";
        status.textContent = `已成功讀取 ${adminUsers.length} 位管理員。`;

      } catch (err) {
        console.error(err);
        select.innerHTML = '<option value="">讀取失敗</option>';
        status.className = "status error";
        status.textContent = "讀取失敗：" + (err?.message || err);
      }
    }

    function updateAdminMeta() {
      const empId = document.getElementById("adminSelect").value;
      const meta = document.getElementById("adminMeta");

      const admin = adminUsers.find(x => x.empId === empId);

      if (!admin) {
        meta.textContent = "";
        return;
      }

      const roleLabel = admin.adminRole === "superadmin" ? "超級管理員" : "管理員";
      const items = [
        roleLabel,
        admin.dept || "",
        admin.jobTitle || ""
      ].filter(Boolean);

      meta.textContent = items.join("｜");
    }

    async function loginAdmin() {
      const status = document.getElementById("status");
      const btn = document.getElementById("loginBtn");
      const empId = document.getElementById("adminSelect").value;
      const password = document.getElementById("password").value.trim();

      if (!empId) {
        status.className = "status error";
        status.textContent = "請先選擇管理員。";
        return;
      }

      if (!password) {
        status.className = "status error";
        status.textContent = "請輸入密碼。";
        return;
      }

      btn.disabled = true;
      btn.textContent = "驗證中...";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "verifyAdmin",
            empId,
            password
          })
        });

        const raw = await response.text();

        let data;
        try {
          data = JSON.parse(raw);
        } catch (e) {
          throw new Error("GAS 登入驗證回傳的不是 JSON。");
        }

        if (!data.ok || !data.admin) {
          throw new Error(data.error || "帳號或密碼錯誤");
        }

        const role = String(data.adminRole || "").toLowerCase();

        if (role !== "admin" && role !== "superadmin") {
          throw new Error("此帳號沒有管理員入口權限");
        }

        sessionStorage.setItem("admin_session", JSON.stringify({
          empId: data.empId,
          name: data.name || "",
          dept: data.dept || "",
          adminRole: role,
          loginAt: new Date().toISOString()
        }));

        status.className = "status success";
        status.textContent =
          "登入成功：" +
          (data.name || data.empId) +
          "（" + (role === "superadmin" ? "超級管理員" : "管理員") + "）";

        document.getElementById("menuArea").classList.remove("hidden");

      } catch (err) {
        console.error(err);
        status.className = "status error";
        status.textContent = "登入失敗：" + (err?.message || err);

      } finally {
        btn.disabled = false;
        btn.textContent = "登入管理系統";
      }
    }
  </script>
</body>
</html>
