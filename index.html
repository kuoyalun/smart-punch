.system-wrap{display:none}.system-wrap.show{display:block}.system-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.system-card{position:relative;border:1px solid var(--border);border-radius:15px;background:var(--panel);color:var(--text);padding:17px 12px;text-align:left;cursor:pointer;min-height:118px;font:inherit;transition:.18s}.system-card:hover:not(:disabled){transform:translateY(-2px);border-color:#818cf8;box-shadow:0 8px 20px rgba(15,23,42,.12)}.system-card:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}.system-card .icon{font-size:28px;display:block;margin-bottom:8px}.system-card .name{font-size:16px;font-weight:900;display:block}.system-card .desc{font-size:11px;color:var(--muted);display:block;margin-top:6px;line-height:1.5}.system-card.attendance{border-left:4px solid #4f46e5}.system-card.leave{border-left:4px solid #059669}.system-card.schedule{border-left:4px solid #7c3aed}.system-card.efficiency{border-left:4px solid #d97706}.badge{position:absolute;right:9px;top:9px;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900;background:#e2e8f0;color:#475569}html[data-theme="dark"] .badge{background:#334155;color:#cbd5e1}
.note{margin-top:13px;color:var(--muted);font-size:11px;line-height:1.65;text-align:center}.employee-login-note{margin:-3px 0 14px;padding:10px 12px;border-radius:11px;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;font-size:12px;font-weight:800;line-height:1.6}html[data-theme="dark"] .employee-login-note{background:#052e24;border-color:#047857;color:#a7f3d0}
@media(max-width:650px){body{padding:10px}.body{padding:18px 14px}.system-grid{grid-template-columns:1fr}.session{align-items:flex-start;flex-direction:column}.logout{width:100%}}

<body>
<div class="card">
  <div class="header">
    <button id="themeToggle" class="theme" type="button">🌙 暗色</button>
    <div class="cloud-title">☁️ 79號碼頭雲端智慧系統</div>
    <div class="cloud-sub">考勤・請假・排班・效率</div>
    <div class="version">版本 2026.09.25.4</div>
  </div>
  <div class="body">
    <div id="sessionBar" class="session">
      <div><strong id="sessionTitle"></strong><small id="sessionMeta"></small></div>
      <button id="logoutBtn" class="logout" type="button">登出</button>
    </div>

    <div id="loginBox" class="login-box">
      <div id="status" class="status">輸入員工編號即可登入；系統會自動辨識一般員工、管理員或超級管理員。</div>
      <div class="employee-login-note">👷 <b>一般員工</b>：只要輸入員工編號，直接按「登入系統」。<br>🛡️ <b>管理員／超級管理員</b>：輸入帳號與密碼後登入。</div>
      <div class="field"><label for="account">員工編號／管理員帳號</label><input id="account" type="text" autocomplete="username" inputmode="text" placeholder="一般員工請輸入員工編號"></div>
      <div class="field"><label for="password">管理員／超級管理員密碼（一般員工免填）</label><input id="password" type="password" autocomplete="current-password" placeholder="一般員工請留空"></div>
      <button id="loginBtn" class="go" type="button">登入系統</button>
    </div>

    <div id="systems" class="system-wrap">
      <div class="system-grid">
        <button id="cardAttendance" class="system-card attendance" type="button" onclick="launchSystem('attendance')"><span class="icon">🕒</span><span class="name">考勤系統</span><span class="desc">上下班打卡、考勤紀錄與管理</span><span class="badge"></span></button>
        <button id="cardLeave" class="system-card leave" type="button" onclick="launchSystem('leave')"><span class="icon">📝</span><span class="name">請假系統</span><span class="desc">請假申請、年假剩餘天數、我的請假與審核</span><span class="badge"></span></button>
        <button id="cardSchedule" class="system-card schedule" type="button" onclick="launchSystem('schedule')"><span class="icon">🗓️</span><span class="name">排班系統</span><span class="desc">班表查看與排班管理</span><span class="badge"></span></button>
        <button id="cardEfficiency" class="system-card efficiency" type="button" onclick="launchSystem('efficiency')"><span class="icon">📊</span><span class="name">效率系統</span><span class="desc">船舶、AQC、月報與效率資料</span><span class="badge"></span></button>
      </div>
      <div class="note">人員資料與權限統一由「考勤系統 → 員工清單管理」維護。</div>
    </div>
  </div>
</div>
<script>
const BUILD_VERSION='20260925.4';
const GAS_URL='https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';
const PATHS={attendance:'./attendance/?v='+BUILD_VERSION,leave:'./leave/?v='+BUILD_VERSION,schedule:'./schedule/?v='+BUILD_VERSION,efficiency:'./aqc-efficiency/?v='+BUILD_VERSION};
const SYSTEM_KEYS=['attendance','leave','schedule','efficiency'];
let currentSession=null, loginBusy=false;
const $=id=>document.getElementById(id);

function initTheme(){const saved=localStorage.getItem('port79_theme')||'light';document.documentElement.setAttribute('data-theme',saved);updateThemeText()}
function updateThemeText(){$('themeToggle').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️ 亮色':'🌙 暗色'}
$('themeToggle').onclick=()=>{const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('port79_theme',next);updateThemeText()};initTheme();

function normLevel(v,f='none'){v=String(v??'').toLowerCase();return ['none','view','manage'].includes(v)?v:f}
function normalizePermissions(raw,role){role=String(role||'employee').toLowerCase();if(role==='superadmin')return{attendance:'manage',leave:'manage',schedule:'manage',efficiency:'manage'};raw=raw&&typeof raw==='object'?raw:{};const defaults=role==='admin'?{attendance:'view',leave:'none',schedule:'none',efficiency:'none'}:{attendance:'view',leave:'view',schedule:'none',efficiency:'none'};const out={};SYSTEM_KEYS.forEach(k=>out[k]=normLevel(raw[k],defaults[k]));return out}
function roleLabel(role){return role==='superadmin'?'超級管理員':role==='admin'?'管理員':'一般員工'}
function permissionLabel(level){return level==='manage'?'管理':level==='view'?'查看':'無權限'}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}

async function readJson(response,label){const raw=await response.text();const text=String(raw||'').replace(/^\uFEFF/,'').trim();if(!response.ok)throw new Error(`${label} HTTP ${response.status}`);if(!text)throw new Error(`${label} 回傳空白`);if(/^<!doctype html|^<html/i.test(text))throw new Error(`${label} 回傳 Google 網頁，不是 JSON`);try{return JSON.parse(text)}catch{throw new Error(`${label} 回傳格式錯誤`)}}
async function fetchTimeout(url,options={},timeoutMs=10000,label='連線'){const c=typeof AbortController!=='undefined'?new AbortController():null;let timed=false;const t=c?setTimeout(()=>{timed=true;try{c.abort()}catch{}},timeoutMs):null;try{return await fetch(url,{...options,signal:c?.signal})}catch(e){if(timed||String(e?.name)==='AbortError'||/abort/i.test(String(e?.message||e)))throw new Error(`${label}逾時，系統會自動再試一次`);throw e}finally{if(t)clearTimeout(t)}}
async function verifyUser(loginId,password){let last=null;for(let attempt=1;attempt<=2;attempt++){try{const res=await fetchTimeout(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'verifyUser',loginId,attNo:loginId,password}),cache:'no-store',redirect:'follow'},10000,'登入驗證');const data=await readJson(res,'登入驗證');if(data?.retryable&&attempt<2){last=new Error(data.error||'雲端忙碌');await new Promise(r=>setTimeout(r,300));continue}return data}catch(e){last=e;if(attempt<2)await new Promise(r=>setTimeout(r,300))}}throw last||new Error('登入驗證失敗')}
async function verifySession(token){const url=GAS_URL+'?action=getSessionMeta&token='+encodeURIComponent(token)+'&t='+Date.now();const res=await fetchTimeout(url,{cache:'no-store',redirect:'follow'},9000,'登入狀態驗證');return await readJson(res,'登入狀態驗證')}

function saveSession(data){const role=String(data.adminRole||data.role||'employee').toLowerCase();const token=String(data.userToken||data.adminToken||data.gcToken||data.token||'').trim();const session={empId:String(data.empId||'').trim().toUpperCase(),attNo:String(data.attNo||''),name:String(data.name||''),dept:String(data.dept||''),jobTitle:String(data.jobTitle||''),adminRole:role,systemPermissions:normalizePermissions(data.systemPermissions,role),loginAt:new Date().toISOString()};sessionStorage.setItem('port79_user_session',JSON.stringify(session));sessionStorage.setItem('port79_user_token',token);sessionStorage.setItem('port79_gas_url',GAS_URL);sessionStorage.setItem('port79_home_emp_id',session.empId);if(role==='employee')sessionStorage.setItem('port79_leave_emp_id',session.empId);if(['admin','superadmin'].includes(role)){sessionStorage.setItem('admin_session',JSON.stringify(session));sessionStorage.setItem('aqc_admin_logged_in','1');sessionStorage.setItem('aqc_admin_id',session.empId);sessionStorage.setItem('aqc_admin_role',role);sessionStorage.setItem('aqc_admin_name',session.name);sessionStorage.setItem('port79_admin_token',token);sessionStorage.setItem('port79_gc_token',token);sessionStorage.setItem('port79_sso_verified','1');if(role==='superadmin')sessionStorage.setItem('port79_gc_superadmin_token',token);else sessionStorage.removeItem('port79_gc_superadmin_token')}currentSession=session;return session}
function clearSession(){['port79_user_session','port79_user_token','port79_home_emp_id','port79_leave_emp_id','admin_session','aqc_admin_logged_in','aqc_admin_id','aqc_admin_role','aqc_admin_name','aqc_admin_active_tab','port79_admin_token','port79_gc_token','port79_gc_superadmin_token','port79_sso_verified'].forEach(k=>sessionStorage.removeItem(k));currentSession=null;$('systems').classList.remove('show');$('sessionBar').classList.remove('show');$('loginBox').style.display='block';$('password').value='';$('loginBtn').disabled=false;$('loginBtn').textContent='登入系統';$('status').className='status';$('status').textContent='請輸入員工編號。一般員工免密碼；管理員／超級管理員需輸入密碼。'}
function showSession(session){const role=String(session.adminRole||'employee').toLowerCase();session.systemPermissions=normalizePermissions(session.systemPermissions,role);$('sessionTitle').innerHTML=`✅ ${escapeHtml(session.name||session.empId)}｜${roleLabel(role)}`;$('sessionMeta').textContent=`工號 ${session.empId||'--'}${session.dept?'｜'+session.dept:''}`;$('sessionBar').classList.add('show');$('loginBox').style.display='none';$('systems').classList.add('show');SYSTEM_KEYS.forEach(k=>{const btn=$('card'+k.charAt(0).toUpperCase()+k.slice(1));let level=session.systemPermissions[k]||'none';if(role==='employee'&&(k==='schedule'||k==='efficiency'))level='none';btn.disabled=level==='none';const badge=btn.querySelector('.badge');if(badge)badge.textContent=permissionLabel(level)})}

async function login(){if(loginBusy)return;const loginId=$('account').value.trim(),password=$('password').value;if(!loginId){$('status').className='status error';$('status').textContent='請輸入員工編號／管理員帳號。';return}loginBusy=true;$('loginBtn').disabled=true;$('loginBtn').textContent='登入中...';$('status').className='status';$('status').textContent=password?'正在驗證管理員帳號...':'正在確認員工編號...';try{const data=await verifyUser(loginId,password);if(!data?.ok||!data?.user)throw new Error(data?.error||'登入資料不正確');const session=saveSession(data);showSession(session)}catch(e){$('status').className='status error';$('status').textContent='登入失敗：'+(e?.message||e);$('loginBtn').disabled=false;$('loginBtn').textContent='登入系統'}finally{loginBusy=false}}
$('loginBtn').onclick=login;$('account').onkeydown=e=>{if(e.key==='Enter')login()};$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutBtn').onclick=clearSession;

function getToken(){return String(sessionStorage.getItem('port79_user_token')||sessionStorage.getItem('port79_admin_token')||'').trim()}
function buildSsoHref(base){const token=getToken();if(!token)return base;const clean=String(base||'').split('#')[0];return `${clean}#port79sso=${encodeURIComponent(token)}&gasurl=${encodeURIComponent(GAS_URL)}`}
function launchSystem(target){if(!currentSession)return;const role=String(currentSession.adminRole||'employee').toLowerCase();let level=normalizePermissions(currentSession.systemPermissions,role)[target]||'none';if(role==='employee'&&(target==='schedule'||target==='efficiency'))level='none';if(level==='none')return;const path=PATHS[target]||'./';if(role==='employee'&&(target==='attendance'||target==='leave')){location.href=path;return}location.href=buildSsoHref(path)}
window.launchSystem=launchSystem;

async function restore(){let session=null;try{session=JSON.parse(sessionStorage.getItem('port79_user_session')||'null')}catch{}const token=getToken();if(!session){return}currentSession=session;showSession(session);if(!token)return;setTimeout(async()=>{try{const data=await verifySession(token);if(!data?.ok)return;const fresh={...session,empId:String(data.empId||session.empId||'').trim().toUpperCase(),name:String(data.name||session.name||''),dept:String(data.dept||session.dept||''),jobTitle:String(data.jobTitle||session.jobTitle||''),adminRole:String(data.adminRole||session.adminRole||'employee').toLowerCase(),systemPermissions:normalizePermissions(data.systemPermissions,String(data.adminRole||session.adminRole||'employee').toLowerCase())};sessionStorage.setItem('port79_user_session',JSON.stringify(fresh));currentSession=fresh;showSession(fresh)}catch(e){console.warn('背景登入狀態驗證失敗，保留本分頁登入狀態：',e)}},0)}
restore();
</script>
