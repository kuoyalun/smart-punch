<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>79號碼頭智慧管理系統</title>
<style>
*{box-sizing:border-box}
:root{
  color-scheme:light;
  --page-bg:#f3f4f6;--card-bg:#fff;--text:#111827;--muted:#64748b;
  --header-bg:#111827;--header-text:#fff;--border:#d1d5db;--input-bg:#fff;
  --choice-bg:#fff;--choice-active:#4f46e5;--choice-active-bg:#eef2ff;
  --link-bg:#f8fafc;--shadow:0 18px 45px rgba(0,0,0,.12)
}
html[data-theme="dark"]{
  color-scheme:dark;
  --page-bg:#0b1120;--card-bg:#111827;--text:#f8fafc;--muted:#94a3b8;
  --header-bg:#020617;--header-text:#fff;--border:#334155;--input-bg:#0f172a;
  --choice-bg:#111827;--choice-active:#818cf8;--choice-active-bg:#312e81;
  --link-bg:#0f172a;--shadow:0 18px 45px rgba(0,0,0,.30)
}
body{
  margin:0;min-height:100vh;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--page-bg);color:var(--text);display:flex;align-items:center;justify-content:center;
  padding:24px;transition:background .2s,color .2s
}
.card{width:100%;max-width:680px;background:var(--card-bg);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.header{background:var(--header-bg);color:var(--header-text);padding:28px 72px 26px 28px;text-align:center;position:relative}
.header h1{margin:0 0 7px;font-size:29px;line-height:1.3}.version{font-size:12px;color:#cbd5e1}
.theme-toggle{position:absolute;top:14px;right:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:800;cursor:pointer}
.body{padding:28px}.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.choice{padding:16px 8px;border:2px solid var(--border);background:var(--choice-bg);color:var(--text);border-radius:14px;cursor:pointer;font-size:15px;font-weight:900;transition:.16s}
.choice:hover{transform:translateY(-1px)}.choice.active{border-color:var(--choice-active);background:var(--choice-active-bg);color:var(--choice-active)}
.role-icon{display:block;font-size:25px;margin-bottom:5px}.role-sub{display:block;font-size:10px;font-weight:600;opacity:.7;margin-top:4px}
.panel{display:none;border-top:1px solid var(--border);padding-top:20px}.panel.show{display:block}
.status{margin-bottom:16px;padding:12px 14px;border-radius:11px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:14px;line-height:1.6;white-space:pre-line}
.status.error{background:#fff1f2;border-color:#fecdd3;color:#be123c}.status.success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.status.warning{background:#fffbeb;border-color:#fde68a;color:#92400e}
html[data-theme="dark"] .status{background:#172554;border-color:#1d4ed8;color:#bfdbfe}html[data-theme="dark"] .status.error{background:#3f0d18;border-color:#9f1239;color:#fecdd3}html[data-theme="dark"] .status.success{background:#052e24;border-color:#047857;color:#a7f3d0}html[data-theme="dark"] .status.warning{background:#422006;border-color:#a16207;color:#fde68a}
.field{margin-bottom:15px}label{display:block;font-weight:800;margin-bottom:7px;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:11px;font-size:16px;outline:none}input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.hint{font-size:13px;color:var(--muted);line-height:1.75;margin:0 0 14px}.go{width:100%;padding:14px;margin-top:5px;border:0;border-radius:11px;background:#4f46e5;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.go:hover{background:#4338ca}.go:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#475569}.secondary:hover{background:#334155}.danger{background:#e11d48}.danger:hover{background:#be123c}
.destinations{display:none;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}.destinations.show{display:block}.destinations h3{margin:0 0 12px;text-align:center;font-size:16px}
.system-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.system-card{border:1px solid var(--border);border-radius:15px;background:var(--link-bg);color:var(--text);padding:17px 12px;text-align:left;cursor:pointer;min-height:118px;transition:.18s;font:inherit}.system-card:hover{transform:translateY(-2px);border-color:#818cf8;box-shadow:0 8px 20px rgba(15,23,42,.12)}.system-card.hidden{display:none}.system-card .icon{font-size:27px;display:block;margin-bottom:8px}.system-card .name{font-size:15px;font-weight:900;display:block}.system-card .desc{font-size:11px;color:var(--muted);display:block;margin-top:6px;line-height:1.5}.system-card.attendance{border-left:4px solid #4f46e5}.system-card.schedule{border-left:4px solid #7c3aed}.system-card.efficiency{border-left:4px solid #a21caf}
.session-bar{display:none;margin-top:16px;padding:13px;border:1px solid var(--border);border-radius:12px;align-items:center;justify-content:space-between;gap:12px}.session-bar.show{display:flex}.session-info{font-size:13px;line-height:1.5}.session-info strong{font-size:14px}.logout-mini{border:0;background:#e11d48;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
.permission-note{margin-top:13px;padding:11px 12px;border-radius:11px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);font-size:12px;color:var(--muted);line-height:1.65}
@media(max-width:650px){body{padding:12px}.card{border-radius:18px}.header{padding:28px 60px 23px 16px}.header h1{font-size:23px}.body{padding:20px 16px}.mode-grid{grid-template-columns:1fr}.choice{display:grid;grid-template-columns:38px 1fr;align-items:center;text-align:left;padding:12px 14px}.role-icon{grid-row:1/3;margin:0}.role-sub{margin:1px 0 0}.system-grid{grid-template-columns:1fr}.system-card{min-height:auto}.session-bar{align-items:flex-start;flex-direction:column}.logout-mini{width:100%}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <button id="themeToggle" class="theme-toggle" type="button">🌙 暗色</button>
    <h1>79號碼頭智慧管理系統</h1>
    <div class="version">三角色登入版｜一般員工・管理員・超級管理員</div>
  </div>

  <div class="body">
    <div class="mode-grid">
      <button id="employeeMode" class="choice active" type="button">
        <span class="role-icon">👷</span>一般員工
        <span class="role-sub">直接打卡／請假</span>
      </button>
      <button id="adminMode" class="choice" type="button">
        <span class="role-icon">🛡️</span>管理員
        <span class="role-sub">打卡＋考勤管理</span>
      </button>
      <button id="superMode" class="choice" type="button">
        <span class="role-icon">👑</span>超級管理員
        <span class="role-sub">三大系統全部權限</span>
      </button>
    </div>

    <div id="employeePanel" class="panel show">
      <div class="status success">一般員工入口</div>
      <p class="hint">一般員工不需要管理員帳號密碼。進入考勤系統後，輸入考勤號碼、工號或電話號碼即可打卡、查看個人打卡紀錄及申請請假。</p>
      <button id="employeeEnterBtn" class="go" type="button">進入員工打卡</button>
      <div class="permission-note">若目前這個分頁已有管理員登入狀態，選擇「一般員工」進入時會先登出管理權限，避免自動跳進管理員後台。</div>
    </div>

    <div id="adminPanel" class="panel">
      <div id="adminStatus" class="status">請輸入「管理員」帳號與密碼。登入後只能進入考勤系統，可打卡及依帳號權限查看／管理考勤。</div>
      <div class="field"><label for="adminAccount">管理員帳號</label><input id="adminAccount" type="text" autocomplete="username" placeholder="工號、考勤號或管理員帳號"></div>
      <div class="field"><label for="adminPassword">密碼</label><input id="adminPassword" type="password" autocomplete="current-password"></div>
      <button id="adminLoginBtn" class="go" type="button">登入管理員</button>
      <div id="adminDestinations" class="destinations">
        <h3>管理員可使用</h3>
        <div class="system-grid">
          <button class="system-card attendance" type="button" onclick="launchSystem('attendance')"><span class="icon">🕒</span><span class="name">考勤系統</span><span class="desc">員工打卡、考勤紀錄、請假與依既有權限管理資料</span></button>
        </div>
      </div>
    </div>

    <div id="superPanel" class="panel">
      <div id="superStatus" class="status">請輸入「超級管理員」帳號與密碼。登入一次後可直接使用三大系統。</div>
      <div class="field"><label for="superAccount">超級管理員帳號</label><input id="superAccount" type="text" autocomplete="username" placeholder="工號、考勤號或超級管理員帳號"></div>
      <div class="field"><label for="superPassword">密碼</label><input id="superPassword" type="password" autocomplete="current-password"></div>
      <button id="superLoginBtn" class="go" type="button">登入超級管理員</button>
      <div id="superDestinations" class="destinations">
        <h3>超級管理員可使用三大系統</h3>
        <div class="system-grid">
          <button class="system-card attendance" type="button" onclick="launchSystem('attendance')"><span class="icon">🕒</span><span class="name">考勤系統</span><span class="desc">打卡、考勤紀錄、請假、人員與完整管理功能</span></button>
          <button class="system-card schedule" type="button" onclick="launchSystem('schedule')"><span class="icon">📅</span><span class="name">排班系統</span><span class="desc">全月排班、班別安排、代班與人員配置</span></button>
          <button class="system-card efficiency" type="button" onclick="launchSystem('efficiency')"><span class="icon">🚢</span><span class="name">船舶效率統計中心</span><span class="desc">船舶作業、月報比對、個人與每周效率</span></button>
        </div>
      </div>
    </div>

    <div id="sessionBar" class="session-bar">
      <div id="sessionInfo" class="session-info"></div>
      <button id="logoutBtn" class="logout-mini" type="button">登出管理權限</button>
    </div>
  </div>
</div>

<script>
// BUILD PATCH: 2026.09.24-AUTO-SYNC-HOME-V2
const BUILD_VERSION = '20260924-role-home-v2-stackfix';
(function ensureFreshBuild(){
  try {
    const url = new URL(location.href);
    if (url.searchParams.get('v') !== BUILD_VERSION) {
      url.searchParams.set('v', BUILD_VERSION);
      location.replace(url.toString());
      return;
    }
  } catch (e) {
    console.warn('版本參數更新失敗', e);
  }
})();
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';

const PATHS = {
  attendance: './attendance/?v=20260924-role-sso-v2',
  schedule: './schedule/?v=20260924-role-sso-v2',
  efficiency: './aqc-efficiency/?v=20260924-role-sso-v2'
};

let currentMode = 'employee';
let currentSession = null;
let loginBusy = false;

const $ = id => document.getElementById(id);
const employeeMode = $('employeeMode');
const adminMode = $('adminMode');
const superMode = $('superMode');
const employeePanel = $('employeePanel');
const adminPanel = $('adminPanel');
const superPanel = $('superPanel');
const adminStatus = $('adminStatus');
const superStatus = $('superStatus');
const adminDestinations = $('adminDestinations');
const superDestinations = $('superDestinations');
const sessionBar = $('sessionBar');
const sessionInfo = $('sessionInfo');

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('smart_terminal_theme', theme);
  $('themeToggle').textContent = theme === 'dark' ? '☀️ 淺色' : '🌙 暗色';
}
(function initTheme(){
  const saved = localStorage.getItem('smart_terminal_theme');
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (dark ? 'dark' : 'light'));
})();
$('themeToggle').addEventListener('click',()=>{
  applyTheme((document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark');
});

function setMode(mode){
  currentMode = mode;
  employeeMode.classList.toggle('active', mode === 'employee');
  adminMode.classList.toggle('active', mode === 'admin');
  superMode.classList.toggle('active', mode === 'superadmin');
  employeePanel.classList.toggle('show', mode === 'employee');
  adminPanel.classList.toggle('show', mode === 'admin');
  superPanel.classList.toggle('show', mode === 'superadmin');

  // 只負責切換頁籤；不要在這裡再次呼叫 showLoggedInUi()。
  // showLoggedInUi() 會呼叫 setMode()，若兩邊互叫會造成 Maximum call stack size exceeded。
}
employeeMode.addEventListener('click',()=>setMode('employee'));
adminMode.addEventListener('click',()=>setMode('admin'));
superMode.addEventListener('click',()=>setMode('superadmin'));

async function readGasJson(response, label='GAS'){
  const raw = await response.text();
  const text = String(raw || '').replace(/^\uFEFF/, '').trim();
  if (!response.ok) throw new Error(`${label} HTTP ${response.status}`);
  if (!text) throw new Error(`${label} 回傳空白內容`);
  if (/^<!doctype html|^<html/i.test(text)) {
    throw new Error(`${label} 回傳 Google 網頁而不是 JSON，請確認 GAS Web App 部署與權限。`);
  }
  try { return JSON.parse(text); }
  catch(e) { throw new Error(`${label} 回傳內容不是有效 JSON`); }
}

async function fetchWithTimeout(url, options={}, timeoutMs=30000, label='GAS 連線'){
  const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  let didTimeout = false;
  const timer = controller ? setTimeout(()=>{
    didTimeout = true;
    try { controller.abort(); } catch(e) {}
  }, timeoutMs) : null;
  try {
    return await fetch(url, {...options, signal: controller?.signal});
  } catch(err) {
    const name = String(err?.name || '');
    const msg = String(err?.message || err || '');
    if (didTimeout || name === 'AbortError' || /aborted|abort/i.test(msg)) {
      const e = new Error(`${label}逾時（${Math.round(timeoutMs/1000)} 秒），請稍後再試`);
      e.isTimeout = true;
      throw e;
    }
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

async function verifyAdminFromGas(loginId, pwd){
  let lastError = null;

  // 最多三輪；每輪先 JSON POST，再以 form POST 相容不同 GAS 部署。
  // 不把密碼放在 GET 網址，避免出現在網址/歷史紀錄。
  for (let attempt = 1; attempt <= 3; attempt++) {
    const payload={action:'verifyAdmin', loginId, attNo:loginId, password:pwd};

    try {
      const response = await fetchWithTimeout(GAS_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(payload),
        cache:'no-store', redirect:'follow'
      }, 30000, 'GAS 登入驗證');

      const data = await readGasJson(response, 'GAS 登入驗證');
      if (data?.retryable) {
        lastError = new Error(data.error || '雲端正在同步，請稍後重試');
      } else {
        return data;
      }
    } catch (err) {
      lastError = err;
    }

    // JSON POST 失敗時，改用表單 POST 再試一次；目前 GAS parsePostData_ 支援兩種格式。
    try {
      const form = new URLSearchParams();
      Object.entries(payload).forEach(([k,v])=>form.set(k,String(v??'')));
      const response = await fetchWithTimeout(GAS_URL, {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body:form.toString(),
        cache:'no-store', redirect:'follow'
      }, 30000, 'GAS 登入驗證');

      const data = await readGasJson(response, 'GAS 登入驗證');
      if (data?.retryable) {
        lastError = new Error(data.error || '雲端正在同步，請稍後重試');
      } else {
        return data;
      }
    } catch (err) {
      lastError = err;
    }

    if (attempt < 3) await new Promise(r=>setTimeout(r, 700 * attempt));
  }

  if (lastError?.isTimeout) {
    throw new Error('GAS 登入驗證逾時。這不是帳號密碼錯誤；請確認 GAS Web App 可正常開啟，或稍後再登入。');
  }
  throw lastError || new Error('登入驗證失敗');
}

async function verifySessionToken(token){
  if (!token) throw new Error('缺少登入 Token');
  const url = GAS_URL + '?action=gcGetSyncMeta&gcToken=' + encodeURIComponent(token) + '&t=' + Date.now();
  let lastError = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const response = await fetchWithTimeout(url, {method:'GET',cache:'no-store',redirect:'follow'}, 20000, 'SSO 驗證');
      const data = await readGasJson(response, 'SSO 驗證');
      const role = String(data?.adminRole || '').toLowerCase();
      if (!data?.ok || !['admin','superadmin'].includes(role)) throw new Error(data?.error || '登入狀態已失效');
      return data;
    } catch (err) {
      lastError = err;
      if (attempt < 3) await new Promise(r=>setTimeout(r,450*attempt));
    }
  }
  throw lastError || new Error('登入狀態驗證失敗');
}

function getStoredToken(){
  return String(
    sessionStorage.getItem('port79_admin_token') ||
    sessionStorage.getItem('port79_gc_superadmin_token') ||
    sessionStorage.getItem('port79_gc_token') || ''
  ).trim();
}

function saveAdminSession(data, token){
  const role = String(data.adminRole || '').toLowerCase();
  const session = {
    empId:String(data.empId || '').trim().toUpperCase(),
    name:String(data.name || ''),
    dept:String(data.dept || ''),
    jobTitle:String(data.jobTitle || ''),
    adminRole:role,
    loginAt:new Date().toISOString()
  };

  sessionStorage.setItem('admin_session', JSON.stringify(session));
  sessionStorage.setItem('aqc_admin_logged_in','1');
  sessionStorage.setItem('aqc_admin_id',session.empId);
  sessionStorage.setItem('aqc_admin_role',role);
  sessionStorage.setItem('aqc_admin_name',session.name);
  sessionStorage.setItem('port79_admin_token',token);
  sessionStorage.setItem('port79_gc_token',token); // 舊版相容
  sessionStorage.setItem('port79_gas_url',GAS_URL);
  sessionStorage.setItem('port79_sso_verified','1');

  if (role === 'superadmin') sessionStorage.setItem('port79_gc_superadmin_token',token);
  else sessionStorage.removeItem('port79_gc_superadmin_token');

  currentSession = session;
  return session;
}

function clearAdminSession(){
  [
    'admin_session','aqc_admin_logged_in','aqc_admin_id','aqc_admin_role','aqc_admin_name',
    'aqc_admin_active_tab','port79_admin_token','port79_gc_token','port79_gc_superadmin_token',
    'port79_sso_verified','port79_gas_url'
  ].forEach(k=>sessionStorage.removeItem(k));
  currentSession = null;
  adminDestinations.classList.remove('show');
  superDestinations.classList.remove('show');
  sessionBar.classList.remove('show');
  $('adminAccount').disabled=false; $('adminPassword').disabled=false; $('adminLoginBtn').disabled=false;
  $('superAccount').disabled=false; $('superPassword').disabled=false; $('superLoginBtn').disabled=false;
  $('adminPassword').value=''; $('superPassword').value='';
  adminStatus.className='status'; adminStatus.textContent='請輸入「管理員」帳號與密碼。登入後只能進入考勤系統，可打卡及依帳號權限查看／管理考勤。';
  superStatus.className='status'; superStatus.textContent='請輸入「超級管理員」帳號與密碼。登入一次後可直接使用三大系統。';
}

function showLoggedInUi(session){
  if (!session) return;
  const role = String(session.adminRole || '').toLowerCase();
  const roleName = role === 'superadmin' ? '超級管理員' : '管理員';
  sessionInfo.innerHTML = `<strong>✅ ${roleName}已登入：${escapeHtml(session.name || session.empId)}</strong><br>${escapeHtml(session.empId || '')}`;
  sessionBar.classList.add('show');

  if (role === 'admin') {
    setMode('admin');
    $('adminAccount').value=session.empId || '';
    $('adminAccount').disabled=true; $('adminPassword').disabled=true; $('adminLoginBtn').disabled=true;
    $('adminLoginBtn').textContent='已登入';
    adminStatus.className='status success';
    adminStatus.textContent='管理員登入成功。可進入考勤系統；在考勤系統內可切換「員工打卡」與「管理員後台」。';
    adminDestinations.classList.add('show');
    superDestinations.classList.remove('show');
  } else if (role === 'superadmin') {
    setMode('superadmin');
    $('superAccount').value=session.empId || '';
    $('superAccount').disabled=true; $('superPassword').disabled=true; $('superLoginBtn').disabled=true;
    $('superLoginBtn').textContent='已登入';
    superStatus.className='status success';
    superStatus.textContent='超級管理員登入成功。可直接進入考勤、排班、船舶效率三大系統。';
    superDestinations.classList.add('show');
    adminDestinations.classList.remove('show');
  }
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

async function loginForRole(expectedRole){
  if (loginBusy) return;
  const isSuper = expectedRole === 'superadmin';
  const account = isSuper ? $('superAccount') : $('adminAccount');
  const pwd = isSuper ? $('superPassword') : $('adminPassword');
  const btn = isSuper ? $('superLoginBtn') : $('adminLoginBtn');
  const status = isSuper ? superStatus : adminStatus;
  const loginId = account.value.trim();
  const password = pwd.value;

  if (!loginId) { status.className='status error'; status.textContent='請輸入帳號。'; account.focus(); return; }
  if (!password) { status.className='status error'; status.textContent='請輸入密碼。'; pwd.focus(); return; }

  loginBusy=true; btn.disabled=true; btn.textContent='登入中...'; status.className='status'; status.textContent='正在驗證帳號與權限...';
  try {
    const data = await verifyAdminFromGas(loginId,password);
    if (!data?.ok || !data?.admin) throw new Error(data?.error || '帳號或密碼錯誤');

    const actualRole = String(data.adminRole || '').toLowerCase();
    if (!['admin','superadmin'].includes(actualRole)) throw new Error('此帳號沒有管理員權限');

    if (actualRole !== expectedRole) {
      if (actualRole === 'superadmin') throw new Error('此帳號是「超級管理員」，請切換到「超級管理員」入口登入。');
      throw new Error('此帳號是「管理員」，請切換到「管理員」入口登入。');
    }

    const token = String(data.adminToken || data.gcToken || data.token || '').trim();
    if (!token) throw new Error('登入成功但未取得跨系統登入 Token，請重新部署最新版 GAS。');

    const session = saveAdminSession(data,token);
    try{ sessionStorage.setItem('port79_auto_sync','1'); }catch(e){}
    showLoggedInUi(session);
  } catch(err) {
    status.className='status error';
    status.textContent='登入失敗：' + (err?.message || err);
    pwd.select();
    btn.disabled=false;
    btn.textContent=isSuper?'登入超級管理員':'登入管理員';
  } finally { loginBusy=false; }
}

$('adminLoginBtn').addEventListener('click',()=>loginForRole('admin'));
$('superLoginBtn').addEventListener('click',()=>loginForRole('superadmin'));
$('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter') loginForRole('admin');});
$('superPassword').addEventListener('keydown',e=>{if(e.key==='Enter') loginForRole('superadmin');});
$('logoutBtn').addEventListener('click',()=>{ clearAdminSession(); setMode('employee'); });

$('employeeEnterBtn').addEventListener('click',()=>{
  // 明確選擇一般員工時，清除管理員 SSO，避免考勤頁自動切進後台。
  clearAdminSession();
  location.href = PATHS.attendance;
});

function buildSsoHref(baseHref){
  const token = getStoredToken();
  if (!token) return baseHref;
  sessionStorage.setItem('port79_gas_url',GAS_URL);
  const clean = String(baseHref || '').split('#')[0];
  return `${clean}#port79sso=${encodeURIComponent(token)}&gasurl=${encodeURIComponent(GAS_URL)}`;
}

function launchSystem(target){
  const role = String(currentSession?.adminRole || '').toLowerCase();
  if (!role) { setMode('admin'); adminStatus.className='status warning'; adminStatus.textContent='請先登入管理員或超級管理員。'; return; }

  if (role === 'admin' && target !== 'attendance') {
    adminStatus.className='status error';
    adminStatus.textContent='一般管理員只能進入考勤系統。排班與船舶效率僅限超級管理員。';
    return;
  }
  if (target === 'efficiency' && role !== 'superadmin') return;
  location.href = buildSsoHref(PATHS[target] || './');
}
window.launchSystem = launchSystem;

async function restoreExistingSession(){
  let session = null;
  try { session = JSON.parse(sessionStorage.getItem('admin_session') || 'null'); } catch(e) {}
  const token = getStoredToken();
  const role = String(session?.adminRole || sessionStorage.getItem('aqc_admin_role') || '').toLowerCase();
  if (!session || !token || !['admin','superadmin'].includes(role)) { setMode('employee'); return; }

  try {
    const verified = await verifySessionToken(token);
    const verifiedRole = String(verified.adminRole || '').toLowerCase();
    session.adminRole = verifiedRole;
    session.empId = String(verified.empId || session.empId || '').trim().toUpperCase();
    session.name = String(verified.name || session.name || '');
    currentSession = session;
    sessionStorage.setItem('admin_session',JSON.stringify(session));
    sessionStorage.setItem('aqc_admin_role',verifiedRole);
    if (verifiedRole === 'superadmin') sessionStorage.setItem('port79_gc_superadmin_token',token);
    else sessionStorage.removeItem('port79_gc_superadmin_token');
    showLoggedInUi(session);
  } catch(err) {
    console.warn('既有登入狀態已失效：',err);
    clearAdminSession();
    setMode('employee');
  }
}

restoreExistingSession();
</script>
