<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>79號碼頭智慧管理系統｜四大入口</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--page-bg:#f3f4f6;--card-bg:#fff;--text:#111827;--muted:#64748b;--header-bg:#111827;--header-text:#fff;--border:#d1d5db;--input-bg:#fff;--choice-bg:#fff;--choice-active:#4f46e5;--choice-active-bg:#eef2ff;--link-bg:#f8fafc;--shadow:0 18px 45px rgba(0,0,0,.12)}
html[data-theme="dark"]{color-scheme:dark;--page-bg:#0b1120;--card-bg:#111827;--text:#f8fafc;--muted:#94a3b8;--header-bg:#020617;--header-text:#fff;--border:#334155;--input-bg:#0f172a;--choice-bg:#111827;--choice-active:#818cf8;--choice-active-bg:#312e81;--link-bg:#0f172a;--shadow:0 18px 45px rgba(0,0,0,.30)}
body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--page-bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:760px;background:var(--card-bg);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.header{background:var(--header-bg);color:var(--header-text);padding:28px 72px 26px 28px;text-align:center;position:relative}
.header h1{margin:0 0 7px;font-size:29px}.version{font-size:12px;color:#cbd5e1}
.theme-toggle{position:absolute;top:14px;right:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:800;cursor:pointer}
.body{padding:28px}.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.choice{padding:16px 8px;border:2px solid var(--border);background:var(--choice-bg);color:var(--text);border-radius:14px;cursor:pointer;font-size:15px;font-weight:900}.choice.active{border-color:var(--choice-active);background:var(--choice-active-bg);color:var(--choice-active)}
.role-icon{display:block;font-size:25px;margin-bottom:5px}.role-sub{display:block;font-size:10px;font-weight:600;opacity:.7;margin-top:4px}
.panel{display:none;border-top:1px solid var(--border);padding-top:20px}.panel.show{display:block}
.status{margin-bottom:16px;padding:12px 14px;border-radius:11px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:14px;line-height:1.6;white-space:pre-line}
.status.error{background:#fff1f2;border-color:#fecdd3;color:#be123c}.status.success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.status.warning{background:#fffbeb;border-color:#fde68a;color:#92400e}
html[data-theme="dark"] .status{background:#172554;border-color:#1d4ed8;color:#bfdbfe}html[data-theme="dark"] .status.error{background:#3f0d18;border-color:#9f1239;color:#fecdd3}html[data-theme="dark"] .status.success{background:#052e24;border-color:#047857;color:#a7f3d0}html[data-theme="dark"] .status.warning{background:#422006;border-color:#a16207;color:#fde68a}
.field{margin-bottom:15px}label{display:block;font-weight:800;margin-bottom:7px;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:11px;font-size:16px;outline:none}
.go{width:100%;padding:14px;margin-top:5px;border:0;border-radius:11px;background:#4f46e5;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.go:disabled{opacity:.55;cursor:not-allowed}
.destinations{margin-top:12px}.destinations h3{margin:0 0 12px;text-align:center;font-size:16px}
.system-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.system-card{position:relative;border:1px solid var(--border);border-radius:15px;background:var(--link-bg);color:var(--text);padding:17px 12px;text-align:left;cursor:pointer;min-height:118px;transition:.18s;font:inherit}
.system-card:hover:not(:disabled){transform:translateY(-2px);border-color:#818cf8;box-shadow:0 8px 20px rgba(15,23,42,.12)}
.system-card:disabled,.system-card.locked{opacity:.48;cursor:not-allowed;filter:grayscale(.25)}
.system-card .icon{font-size:27px;display:block;margin-bottom:8px}.system-card .name{font-size:15px;font-weight:900;display:block}.system-card .desc{font-size:11px;color:var(--muted);display:block;margin-top:6px;line-height:1.5}
.system-card.attendance{border-left:4px solid #4f46e5}.system-card.leave{border-left:4px solid #059669}.system-card.schedule{border-left:4px solid #7c3aed}.system-card.efficiency{border-left:4px solid #d97706}
.perm-badge{position:absolute;top:9px;right:9px;font-size:9px;font-weight:900;border-radius:999px;padding:3px 7px;background:#e2e8f0;color:#475569}
html[data-theme="dark"] .perm-badge{background:#334155;color:#cbd5e1}
.session-bar{display:none;margin-top:16px;padding:13px;border:1px solid var(--border);border-radius:12px;align-items:center;justify-content:space-between;gap:12px}.session-bar.show{display:flex}.session-info{font-size:13px;line-height:1.5}.logout-mini{border:0;background:#e11d48;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}
.hint,.permission-note{font-size:12px;color:var(--muted);line-height:1.7}.permission-note{margin-top:13px;padding:11px 12px;border-radius:11px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2)}
@media(max-width:650px){body{padding:12px}.card{border-radius:18px}.header{padding:28px 60px 23px 16px}.header h1{font-size:23px}.body{padding:20px 16px}.mode-grid{grid-template-columns:1fr}.choice{display:grid;grid-template-columns:38px 1fr;align-items:center;text-align:left;padding:12px 14px}.role-icon{grid-row:1/3;margin:0}.system-grid{grid-template-columns:1fr}.session-bar{align-items:flex-start;flex-direction:column}.logout-mini{width:100%}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <button id="themeToggle" class="theme-toggle" type="button">🌙 暗色</button>
    <h1>79號碼頭智慧管理系統</h1>
    <div class="version">四大入口權限試作版｜2026.09.25</div>
  </div>
  <div class="body">
    <div class="mode-grid">
      <button id="employeeMode" class="choice active" type="button"><span class="role-icon">👷</span>一般員工<span class="role-sub">四大入口</span></button>
      <button id="adminMode" class="choice" type="button"><span class="role-icon">🛡️</span>管理員<span class="role-sub">依員工清單權限開放</span></button>
      <button id="superMode" class="choice" type="button"><span class="role-icon">👑</span>超級管理員<span class="role-sub">四大系統全部權限</span></button>
    </div>

    <div id="employeePanel" class="panel show">
      <div class="status success">一般員工入口</div>
      <p class="hint">人員主檔統一由「考勤系統 → 員工清單管理」維護。請假已獨立成單獨系統；排班與效率依目前權限設計開放。</p>
      <div class="system-grid">
        <button class="system-card attendance" type="button" onclick="enterEmployeeSystem('attendance')"><span class="icon">🕒</span><span class="name">考勤系統</span><span class="desc">上下班打卡、個人考勤紀錄</span></button>
        <button class="system-card leave" type="button" onclick="enterEmployeeSystem('leave')"><span class="icon">📝</span><span class="name">請假系統</span><span class="desc">請假申請、我的請假、特休餘額</span></button>
        <button class="system-card schedule locked" type="button" onclick="showEmployeeLocked('排班系統')"><span class="icon">🗓️</span><span class="name">排班系統</span><span class="desc">目前試作版先由有排班權限的管理者進入</span><span class="perm-badge">權限入口</span></button>
        <button class="system-card efficiency locked" type="button" onclick="showEmployeeLocked('效率系統')"><span class="icon">📊</span><span class="name">效率系統</span><span class="desc">目前試作版先由有權限的管理者進入</span><span class="perm-badge">權限入口</span></button>
      </div>
      <div class="permission-note">這版先完成四大入口、獨立請假與管理員系統權限。一般員工要不要直接看「自己的排班／自己的效率」，後續可再依你的規則開放。</div>
    </div>

    <div id="adminPanel" class="panel">
      <div id="adminStatus" class="status">請輸入管理員帳號與密碼。登入後會依「員工清單管理 → 四大系統權限」決定可進入哪些系統。</div>
      <div class="field"><label for="adminAccount">管理員帳號</label><input id="adminAccount" type="text" autocomplete="username" placeholder="工號、考勤號或管理員帳號"></div>
      <div class="field"><label for="adminPassword">密碼</label><input id="adminPassword" type="password" autocomplete="current-password"></div>
      <button id="adminLoginBtn" class="go" type="button">登入管理員</button>
      <div id="adminDestinations" class="destinations" style="display:none">
        <h3>管理員可使用</h3>
        <div class="system-grid">
          <button id="adminCardAttendance" class="system-card attendance" type="button" onclick="launchSystem('attendance')"><span class="icon">🕒</span><span class="name">考勤系統</span><span class="desc">考勤、員工清單與既有管理功能</span><span class="perm-badge"></span></button>
          <button id="adminCardLeave" class="system-card leave" type="button" onclick="launchSystem('leave')"><span class="icon">📝</span><span class="name">請假系統</span><span class="desc">請假申請、查詢與審核</span><span class="perm-badge"></span></button>
          <button id="adminCardSchedule" class="system-card schedule" type="button" onclick="launchSystem('schedule')"><span class="icon">🗓️</span><span class="name">排班系統</span><span class="desc">排班查看與排班管理</span><span class="perm-badge"></span></button>
          <button id="adminCardEfficiency" class="system-card efficiency" type="button" onclick="launchSystem('efficiency')"><span class="icon">📊</span><span class="name">效率系統</span><span class="desc">船舶、AQC、月報與效率資料</span><span class="perm-badge"></span></button>
        </div>
      </div>
    </div>

    <div id="superPanel" class="panel">
      <div id="superStatus" class="status">請輸入超級管理員帳號與密碼。超級管理員固定擁有四大系統完整權限。</div>
      <div class="field"><label for="superAccount">超級管理員帳號</label><input id="superAccount" type="text" autocomplete="username"></div>
      <div class="field"><label for="superPassword">密碼</label><input id="superPassword" type="password" autocomplete="current-password"></div>
      <button id="superLoginBtn" class="go" type="button">登入超級管理員</button>
      <div id="superDestinations" class="destinations" style="display:none">
        <h3>超級管理員可使用四大系統</h3>
        <div class="system-grid">
          <button class="system-card attendance" type="button" onclick="launchSystem('attendance')"><span class="icon">🕒</span><span class="name">考勤系統</span><span class="desc">完整考勤與人員管理</span><span class="perm-badge">管理</span></button>
          <button class="system-card leave" type="button" onclick="launchSystem('leave')"><span class="icon">📝</span><span class="name">請假系統</span><span class="desc">完整請假與審核管理</span><span class="perm-badge">管理</span></button>
          <button class="system-card schedule" type="button" onclick="launchSystem('schedule')"><span class="icon">🗓️</span><span class="name">排班系統</span><span class="desc">完整排班管理</span><span class="perm-badge">管理</span></button>
          <button class="system-card efficiency" type="button" onclick="launchSystem('efficiency')"><span class="icon">📊</span><span class="name">效率系統</span><span class="desc">完整效率管理</span><span class="perm-badge">管理</span></button>
        </div>
      </div>
    </div>

    <div id="sessionBar" class="session-bar">
      <div id="sessionInfo" class="session-info"></div>
      <button id="logoutBtn" class="logout-mini" type="button">登出管理權限</button>
    </div>
  </div>
</div>
<script>
const BUILD_VERSION='20260925-four-systems-permission-v1';
const GAS_URL='https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';
const PATHS={attendance:'./attendance/?v='+BUILD_VERSION,leave:'./leave/?v='+BUILD_VERSION,schedule:'./schedule/?v='+BUILD_VERSION,efficiency:'./aqc-efficiency/?v='+BUILD_VERSION};
const SYSTEM_KEYS=['attendance','leave','schedule','efficiency'];
let currentMode='employee', currentSession=null, loginBusy=false;
const $=id=>document.getElementById(id);

function normLevel(v,fallback='none'){v=String(v??'').toLowerCase();if(v==='manage'||v==='view'||v==='none')return v;if(v===true||v==='true')return 'view';return fallback}
function normalizeSystemPermissions(raw,role='employee'){
  const r=String(role||'employee').toLowerCase();
  if(r==='superadmin') return {attendance:'manage',leave:'manage',schedule:'manage',efficiency:'manage'};
  const src=raw&&typeof raw==='object'?raw:{};
  const defaults=r==='admin'?{attendance:'view',leave:'none',schedule:'none',efficiency:'none'}:{attendance:'view',leave:'view',schedule:'view',efficiency:'none'};
  const out={}; SYSTEM_KEYS.forEach(k=>out[k]=normLevel(src[k],defaults[k])); return out;
}
function permissionLabel(level){return level==='manage'?'管理':level==='view'?'查看':'無權限'}
function applyTheme(theme){document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('smart_terminal_theme',theme);$('themeToggle').textContent=theme==='dark'?'☀️ 淺色':'🌙 暗色'}
(()=>{const saved=localStorage.getItem('smart_terminal_theme');const dark=matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;applyTheme(saved||(dark?'dark':'light'))})();
$('themeToggle').onclick=()=>applyTheme((document.documentElement.getAttribute('data-theme')||'light')==='dark'?'light':'dark');

function setMode(mode){currentMode=mode;['employee','admin','super'].forEach(m=>{$(m+'Mode').classList.toggle('active',mode===m.replace('super','superadmin'));$(m+'Panel').classList.toggle('show',mode===m.replace('super','superadmin'))})}
$('employeeMode').onclick=()=>setMode('employee');$('adminMode').onclick=()=>setMode('admin');$('superMode').onclick=()=>setMode('superadmin');

async function readGasJson(response,label='GAS'){const raw=await response.text();const text=String(raw||'').replace(/^\uFEFF/,'').trim();if(!response.ok)throw new Error(`${label} HTTP ${response.status}`);if(!text)throw new Error(`${label} 回傳空白內容`);if(/^<!doctype html|^<html/i.test(text))throw new Error(`${label} 回傳 Google 網頁，不是 JSON`);try{return JSON.parse(text)}catch{throw new Error(`${label} 回傳不是有效 JSON`)}}
async function fetchTimeout(url,options={},timeoutMs=10000,label='雲端連線'){const c=typeof AbortController!=='undefined'?new AbortController():null;let timed=false;const t=c?setTimeout(()=>{timed=true;try{c.abort()}catch{}},timeoutMs):null;try{return await fetch(url,{...options,signal:c?.signal})}catch(e){if(timed||String(e?.name)==='AbortError'||/abort/i.test(String(e?.message||e)))throw new Error(`${label}逾時，請再按一次登入`);throw e}finally{if(t)clearTimeout(t)}}

async function verifyAdminFromGas(loginId,password){
  let last=null;
  for(let attempt=1;attempt<=2;attempt++){
    try{
      const res=await fetchTimeout(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'verifyAdmin',loginId,attNo:loginId,password}),cache:'no-store',redirect:'follow'},10000,'登入驗證');
      const data=await readGasJson(res,'登入驗證');
      if(data?.retryable){last=new Error(data.error||'雲端忙碌');if(attempt<2){await new Promise(r=>setTimeout(r,300));continue}}
      return data;
    }catch(e){last=e;if(attempt<2)await new Promise(r=>setTimeout(r,300))}
  }
  throw last||new Error('登入驗證失敗');
}
async function verifySessionToken(token){
  const url=GAS_URL+'?action=gcGetSyncMeta&gcToken='+encodeURIComponent(token)+'&t='+Date.now();
  const res=await fetchTimeout(url,{cache:'no-store',redirect:'follow'},9000,'SSO 驗證');
  const data=await readGasJson(res,'SSO 驗證');
  const role=String(data?.adminRole||'').toLowerCase();
  if(!data?.ok||!['admin','superadmin'].includes(role)){const e=new Error(data?.error||'登入狀態已失效');e.ssoAuthRejected=true;throw e}
  return data;
}
function getStoredToken(){return String(sessionStorage.getItem('port79_admin_token')||sessionStorage.getItem('port79_gc_superadmin_token')||sessionStorage.getItem('port79_gc_token')||'').trim()}
function saveAdminSession(data,token){
  const role=String(data.adminRole||'').toLowerCase();
  const session={empId:String(data.empId||'').trim().toUpperCase(),name:String(data.name||''),dept:String(data.dept||''),jobTitle:String(data.jobTitle||''),adminRole:role,systemPermissions:normalizeSystemPermissions(data.systemPermissions,role),loginAt:new Date().toISOString()};
  sessionStorage.setItem('admin_session',JSON.stringify(session));sessionStorage.setItem('aqc_admin_logged_in','1');sessionStorage.setItem('aqc_admin_id',session.empId);sessionStorage.setItem('aqc_admin_role',role);sessionStorage.setItem('aqc_admin_name',session.name);sessionStorage.setItem('port79_admin_token',token);sessionStorage.setItem('port79_gc_token',token);sessionStorage.setItem('port79_gas_url',GAS_URL);sessionStorage.setItem('port79_sso_verified','1');
  if(role==='superadmin')sessionStorage.setItem('port79_gc_superadmin_token',token);else sessionStorage.removeItem('port79_gc_superadmin_token');
  currentSession=session;return session;
}
function clearAdminSession(){['admin_session','aqc_admin_logged_in','aqc_admin_id','aqc_admin_role','aqc_admin_name','aqc_admin_active_tab','port79_admin_token','port79_gc_token','port79_gc_superadmin_token','port79_sso_verified','port79_gas_url'].forEach(k=>sessionStorage.removeItem(k));currentSession=null;$('sessionBar').classList.remove('show');$('adminDestinations').style.display='none';$('superDestinations').style.display='none';['admin','super'].forEach(p=>{ $(p+'Account').disabled=false;$(p+'Password').disabled=false;$(p+'LoginBtn').disabled=false;$(p+'LoginBtn').textContent=p==='admin'?'登入管理員':'登入超級管理員';$(p+'Password').value=''})}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function applyAdminCards(session){
  const perms=normalizeSystemPermissions(session?.systemPermissions,session?.adminRole);
  SYSTEM_KEYS.forEach(k=>{
    const id='adminCard'+k.charAt(0).toUpperCase()+k.slice(1), btn=$(id); if(!btn)return;
    const level=perms[k]||'none'; btn.disabled=level==='none';btn.classList.toggle('locked',level==='none');
    const badge=btn.querySelector('.perm-badge');if(badge)badge.textContent=permissionLabel(level);
  });
}
function showLoggedInUi(session){
  if(!session)return;const role=String(session.adminRole||'').toLowerCase();const roleName=role==='superadmin'?'超級管理員':'管理員';
  $('sessionInfo').innerHTML=`<strong>✅ ${roleName}已登入：${escapeHtml(session.name||session.empId)}</strong><br>${escapeHtml(session.empId||'')}`;$('sessionBar').classList.add('show');
  if(role==='superadmin'){setMode('superadmin');$('superAccount').value=session.empId||'';$('superAccount').disabled=true;$('superPassword').disabled=true;$('superLoginBtn').disabled=true;$('superLoginBtn').textContent='已登入';$('superStatus').className='status success';$('superStatus').textContent='超級管理員登入成功。四大系統全部可使用。';$('superDestinations').style.display='block';$('adminDestinations').style.display='none'}
  else{setMode('admin');$('adminAccount').value=session.empId||'';$('adminAccount').disabled=true;$('adminPassword').disabled=true;$('adminLoginBtn').disabled=true;$('adminLoginBtn').textContent='已登入';$('adminStatus').className='status success';$('adminStatus').textContent='管理員登入成功。可用系統依員工清單中的四大系統權限顯示。';applyAdminCards(session);$('adminDestinations').style.display='block';$('superDestinations').style.display='none'}
}
async function loginForRole(expectedRole){
  if(loginBusy)return;const isSuper=expectedRole==='superadmin',account=$(isSuper?'superAccount':'adminAccount'),pwd=$(isSuper?'superPassword':'adminPassword'),btn=$(isSuper?'superLoginBtn':'adminLoginBtn'),status=$(isSuper?'superStatus':'adminStatus');
  const loginId=account.value.trim(),password=pwd.value;if(!loginId){status.className='status error';status.textContent='請輸入帳號。';return}if(!password){status.className='status error';status.textContent='請輸入密碼。';return}
  loginBusy=true;btn.disabled=true;btn.textContent='登入中...';status.className='status';status.textContent='正在驗證帳號與權限...';
  try{const data=await verifyAdminFromGas(loginId,password);if(!data?.ok||!data?.admin)throw new Error(data?.error||'帳號或密碼錯誤');const actual=String(data.adminRole||'').toLowerCase();if(actual!==expectedRole)throw new Error(actual==='superadmin'?'此帳號是超級管理員，請切換到超級管理員入口。':'此帳號是管理員，請切換到管理員入口。');const token=String(data.adminToken||data.gcToken||data.token||'').trim();if(!token)throw new Error('登入成功但沒有取得 SSO Token，請部署本試作版 GAS。');showLoggedInUi(saveAdminSession(data,token))}
  catch(e){status.className='status error';status.textContent='登入失敗：'+(e?.message||e);btn.disabled=false;btn.textContent=isSuper?'登入超級管理員':'登入管理員'}
  finally{loginBusy=false}
}
$('adminLoginBtn').onclick=()=>loginForRole('admin');$('superLoginBtn').onclick=()=>loginForRole('superadmin');$('adminPassword').onkeydown=e=>{if(e.key==='Enter')loginForRole('admin')};$('superPassword').onkeydown=e=>{if(e.key==='Enter')loginForRole('superadmin')};$('logoutBtn').onclick=()=>{clearAdminSession();setMode('employee')};

function enterEmployeeSystem(target){clearAdminSession();location.href=PATHS[target]||'./'}
function showEmployeeLocked(name){alert(name+'目前試作版先由管理員／超級管理員依權限進入。')}
function buildSsoHref(baseHref){const token=getStoredToken();if(!token)return baseHref;sessionStorage.setItem('port79_gas_url',GAS_URL);const clean=String(baseHref||'').split('#')[0];return `${clean}#port79sso=${encodeURIComponent(token)}&gasurl=${encodeURIComponent(GAS_URL)}`}
function launchSystem(target){const role=String(currentSession?.adminRole||'').toLowerCase();if(!['admin','superadmin'].includes(role)){setMode('admin');$('adminStatus').className='status warning';$('adminStatus').textContent='請先登入管理員或超級管理員。';return}const perms=normalizeSystemPermissions(currentSession?.systemPermissions,role);if(perms[target]==='none'){const box=role==='superadmin'?$('superStatus'):$('adminStatus');box.className='status error';box.textContent='此帳號沒有「'+({attendance:'考勤',leave:'請假',schedule:'排班',efficiency:'效率'}[target]||target)+'系統」權限。請由超級管理員到考勤系統的員工清單修改。';return}location.href=buildSsoHref(PATHS[target]||'./')}
window.launchSystem=launchSystem;window.enterEmployeeSystem=enterEmployeeSystem;window.showEmployeeLocked=showEmployeeLocked;

async function restoreExistingSession(){
  let session=null;try{session=JSON.parse(sessionStorage.getItem('admin_session')||'null')}catch{}
  const token=getStoredToken(), role=String(session?.adminRole||sessionStorage.getItem('aqc_admin_role')||'').toLowerCase();
  if(!session||!token||!['admin','superadmin'].includes(role)){setMode('employee');return}
  currentSession=session;session.systemPermissions=normalizeSystemPermissions(session.systemPermissions,role);showLoggedInUi(session);
  setTimeout(async()=>{try{const v=await verifySessionToken(token);session.adminRole=String(v.adminRole||role).toLowerCase();session.name=String(v.name||session.name||'');session.empId=String(v.empId||session.empId||'').trim().toUpperCase();session.systemPermissions=normalizeSystemPermissions(v.systemPermissions,session.adminRole);sessionStorage.setItem('admin_session',JSON.stringify(session));currentSession=session;showLoggedInUi(session)}catch(e){console.warn('背景 SSO 複驗失敗，暫時保留本分頁 Session：',e)}},0);
}
(()=>{const msg=String(sessionStorage.getItem('port79_return_message')||'').trim();if(msg){sessionStorage.removeItem('port79_return_message');$('adminStatus').className='status warning';$('adminStatus').textContent=msg}})();
restoreExistingSession();
</script>
