<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS 考勤系統入口 V7</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",sans-serif;background:#f3f4f6;display:flex;align-items:center;justify-content:center;padding:18px;color:#111827}
.card{width:100%;max-width:560px;background:#fff;border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.12);overflow:hidden}
.header{background:#111827;color:#fff;padding:26px;text-align:center}
.header h1{margin:0 0 6px;font-size:28px}
.version{font-size:12px;color:#cbd5e1}
.body{padding:26px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.choice{padding:18px 12px;border:2px solid #d1d5db;background:#fff;border-radius:14px;cursor:pointer;font-size:17px;font-weight:800}
.choice.active{border-color:#4f46e5;background:#eef2ff;color:#3730a3}
.panel{display:none;border-top:1px solid #e5e7eb;padding-top:20px}
.panel.show{display:block}
.field{margin-bottom:15px}
label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}
input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.status{margin-bottom:15px;padding:11px 13px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:14px;white-space:pre-line}
.status.error{background:#fff1f2;border-color:#fecdd3;color:#be123c}
.status.success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.hint{font-size:13px;color:#64748b;line-height:1.6}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.destinations{display:none;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}
.destinations.show{display:block}
.destinations h3{margin:0 0 12px;text-align:center}
.destinations a{display:block;text-decoration:none;text-align:center;padding:15px;margin-top:10px;border-radius:12px;font-weight:800;border:1px solid #cbd5e1;color:#1f2937;background:#f8fafc}
@media(max-width:480px){
  body{padding:10px}
  .header{padding:22px 16px}
  .header h1{font-size:24px}
  .body{padding:20px 16px}
  .choice{padding:16px 8px;font-size:16px}
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>GPS 考勤系統</h1>
    <div class="version">入口版本 V9－管理員只輸入數字</div>
  </div>

  <div class="body">
    <div class="mode-grid">
      <button id="employeeMode" class="choice" type="button">一般員工</button>
      <button id="adminMode" class="choice" type="button">管理員</button>
    </div>

    <div id="employeePanel" class="panel">
      <div class="status success">一般員工模式</div>
      <p class="hint">按 Enter 或按下方按鈕，直接進入考勤系統。</p>
      <button id="employeeEnterBtn" class="go" type="button">進入考勤系統</button>
    </div>

    <div id="adminPanel" class="panel">
      <div id="status" class="status">請輸入工號或考勤號碼中的「數字部分」，再輸入密碼。</div>

      <div class="field">
        <label for="loginId">數字帳號</label>
        <input id="loginId" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="例如 AN0890056 只輸入 0890056" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">密碼</label>
        <input id="password" type="password" placeholder="請輸入密碼" autocomplete="current-password">
      </div>

      <p class="hint">輸入數字帳號與密碼後，直接按 Enter 登入。登入成功後會讓你選擇「考勤系統」或「排班系統」。</p>

      <div id="destinations" class="destinations">
        <h3>登入成功，請選擇要進入的系統</h3>
        <a href="./attendance/">進入考勤系統</a>
        <a href="./schedule/">進入排班系統</a>
      </div>
    </div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec";
let currentMode = "";
let adminLoggedIn = false;

const employeeMode = document.getElementById("employeeMode");
const adminMode = document.getElementById("adminMode");
const employeePanel = document.getElementById("employeePanel");
const adminPanel = document.getElementById("adminPanel");
const employeeEnterBtn = document.getElementById("employeeEnterBtn");
const loginId = document.getElementById("loginId");
const password = document.getElementById("password");
const statusBox = document.getElementById("status");
const destinations = document.getElementById("destinations");

loginId.addEventListener("input",()=>{ loginId.value = loginId.value.replace(/\D/g,""); });

employeeMode.addEventListener("click",()=>setMode("employee"));
adminMode.addEventListener("click",()=>setMode("admin"));
employeeEnterBtn.addEventListener("click",()=>window.location.href="./attendance/");

document.addEventListener("keydown",(e)=>{
  if(e.key!=="Enter") return;

  if(currentMode==="employee"){
    e.preventDefault();
    window.location.href="./attendance/";
    return;
  }

  if(currentMode==="admin" && !adminLoggedIn){
    e.preventDefault();
    loginAdmin();
  }
});

function setMode(mode){
  currentMode=mode;
  employeeMode.classList.toggle("active",mode==="employee");
  adminMode.classList.toggle("active",mode==="admin");
  employeePanel.classList.toggle("show",mode==="employee");
  adminPanel.classList.toggle("show",mode==="admin");

  if(mode==="admin"){
    setTimeout(()=>loginId.focus(),100);
  }
}

async function loginAdmin(){
  const account=loginId.value.trim().replace(/\D/g,"");
  const pwd=password.value.trim();

  if(!account){
    statusBox.className="status error";
    statusBox.textContent="請輸入數字帳號。";
    loginId.focus();
    return;
  }

  if(!pwd){
    statusBox.className="status error";
    statusBox.textContent="請輸入密碼。";
    password.focus();
    return;
  }

  statusBox.className="status";
  statusBox.textContent="正在驗證管理員身分...";

  try{
    const r=await fetch(GAS_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        action:"verifyAdmin",
        loginId:account,
        attNo:account,
        password:pwd
      })
    });

    const raw=await r.text();
    let data;
    try{ data=JSON.parse(raw); }
    catch{ throw new Error("GAS 登入驗證回傳不是 JSON。"); }

    if(!data.ok || !data.admin){
      throw new Error(data.error||"帳號或密碼錯誤");
    }

    const role=String(data.adminRole||"").toLowerCase();
    if(role!=="admin" && role!=="superadmin"){
      throw new Error("此帳號沒有管理員權限");
    }

    sessionStorage.setItem("admin_session",JSON.stringify({
      empId:data.empId||"",
      attNo:data.attNo||"",
      name:data.name||"",
      dept:data.dept||"",
      adminRole:role,
      loginAt:new Date().toISOString()
    }));

    adminLoggedIn=true;
    loginId.disabled=true;
    password.disabled=true;

    statusBox.className="status success";
    statusBox.textContent="登入成功：" + (data.name || data.empId || account) + "。請選擇要進入的系統。";
    destinations.classList.add("show");

  }catch(err){
    statusBox.className="status error";
    statusBox.textContent="登入失敗："+(err?.message||err);
    password.select();
  }
}
</script>
</body>
</html>
