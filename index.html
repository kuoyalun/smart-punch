<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司系統入口</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin-top: 100px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            color: #666;
            margin-bottom: 40px;
        }
        .card {
            display: inline-block;
            width: 200px;
            padding: 30px 20px;
            margin: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-decoration: none;
            color: #2c3e50;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #007bff;
            color: white;
            box-shadow: 0 6px 15px rgba(0,123,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>內部管理系統</h1>
        <p>請選擇您要進入的功能：</p>
        
        <a href="attendance/" class="card">
            📂 考勤系統
        </a>
        
        <a href="schedule/" class="card">
            📅 排班系統
        </a>
    </div>
</body>
</html>
