*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.topin{max-width:1600px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#ccfbf1;font-size:22px}html[data-theme="dark"] .logo{background:#134e4a}h1{font-size:18px;margin:0}.sub{font-size:10px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:800}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{background:#fee2e2;border-color:#fecaca;color:#b91c1c}html[data-theme="dark"] .btn.danger{background:#451a1a;border-color:#7f1d1d;color:#fecaca}.wrap{max-width:1600px;margin:auto;padding:14px}.banner{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);font-size:12px;font-weight:750;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0}.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}.stat .k{font-size:10px;color:var(--muted)}.stat .v{font-size:24px;font-weight:950;margin-top:3px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:8px;padding:12px;border-bottom:1px solid var(--border)}inp <div id="port79CalendarModeBox" aria-label="年份顯示方式">
  <span>年份</span>
  <select id="port79CalendarModeSelect" title="切換西元年／民國年">
    <option value="gregorian">西元</option>
    <option value="roc">民國</option>
  </select>
</div>
<script id="port79-calendar-mode-script">
(function(){
  const KEY='port79_year_mode';
  const mode=localStorage.getItem(KEY)==='roc'?'roc':'gregorian';
  const sel=document.getElementById('port79CalendarModeSelect');
  if(sel){
    sel.value=mode;
    sel.addEventListener('change',()=>{
      localStorage.setItem(KEY,sel.value==='roc'?'roc':'gregorian');
      location.reload();
    });
  }
  if(mode!=='roc')return;
  const skip=new Set(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT']);
  const cv=(s)=>{
    s=String(s||'');
    s=s.replace(/\b((?:19|20)\d{2})([\/-])(\d{1,2})\2(\d{1,2})\b/g,(m,y,sep,mo,d)=>`民國${Number(y)-1911}${sep}${mo}${sep}${d}`);
    s=s.replace(/\b((?:19|20)\d{2})([\/-])(\d{1,2})(?![\/-]\d)/g,(m,y,sep,mo)=>`民國${Number(y)-1911}${sep}${mo}`);
    s=s.replace(/\b((?:19|20)\d{2})年/g,(m,y)=>`民國${Number(y)-1911}年`);
    return s;
  };
  let busy=false;
  function scan(root){
    if(!root||busy)return;
    busy=true;
    try{
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const nodes=[]; let n;
      while(n=walker.nextNode())nodes.push(n);
      nodes.forEach(node=>{
        const p=node.parentElement;
        if(!p||skip.has(p.tagName)||p.closest('#port79CalendarModeBox'))return;
        const old=node.nodeValue||'';
        const next=cv(old);
        if(next!==old)node.nodeValue=next;
      });
    }finally{busy=false}
  }
  scan(document.body);
  const mo=new MutationObserver(ms=>{
    if(busy)return;
    ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)scan(n.nodeType===1?n:n.parentElement)}));
  });
  mo.observe(document.body,{childList:true,subtree:true});
})();
</script>

<script>
const APP_VERSION='2026.09.27.3-HR-EMPLOYMENT-STATUS';
const DEFAULT_GAS_URL="https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec";
let GAS_URL=String(sessionStorage.getItem('port79_gas_url')||DEFAULT_GAS_URL).trim();
let employees=[],session=null,token='',hrAccess='none',editing=null;
const SYS=['attendance','leave','schedule','efficiency','hr'];
const LABEL={attendance:'考勤',leave:'請假',schedule:'排班',efficiency:'效率',hr:'人資'};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const level=v=>['none','view','manage'].includes(String(v||'').toLowerCase())?String(v).toLowerCase():'none';
function roleLabel(v){return v==='superadmin'?'超級管理員':v==='admin'?'管理員':'一般員工'}
function permLabel(v){return v==='manage'?'管理':v==='view'?'查看':'無'}
function normalizeEmploymentStatus(v){
  const s=String(v||'').trim().toLowerCase();
  if(['resigned','離職','terminated','inactive'].includes(s))return 'resigned';
  if(['leave','留職停薪','留停','loa'].includes(s))return 'leave';
  return 'active';
}
function employmentLabel(v){v=normalizeEmploymentStatus(v);return v==='resigned'?'離職':v==='leave'?'留職停薪':'在職'}
function employmentClass(v){return normalizeEmploymentStatus(v)}
function todayYmd(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function theme(){const d=document.documentElement.getAttribute('data-theme')==='dark';$('themeBtn').innerHTML=d?'☀️ <span class="txt">亮色</span>':'🌙 <span class="txt">暗色</span>'}
(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('port79_theme')||'light');theme();$('themeBtn').onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('port79_theme',n);theme()}})();
function readHash(){try{const p=new URLSearchParams(String(location.hash||'').replace(/^#/,''));const g=p.get('gasurl');if(g){GAS_URL=g;sessionStorage.setItem('port79_gas_url',g)}const t=p.get('port79sso');if(t)sessionStorage.setItem('port79_user_token',t);history.replaceState(null,'',location.pathname+location.search);return t||''}catch{return''}}
function getToken(){return String(readHash()||sessionStorage.getItem('port79_user_token')||sessionStorage.getItem('port79_admin_token')||'').trim()}
async function jfetch(url,opt={},ms=16000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal,redirect:'follow',cache:'no-store'});const s=await r.text();if(/^<!doctype|^<html/i.test(s.trim()))throw new Error('GAS 回傳 Google 網頁，請重新部署 Apps Script');const d=JSON.parse(s);if(!d.ok)throw new Error(d.error||'雲端操作失敗');return d}finally{clearTimeout(tm)}}
async function apiGet(action){return jfetch(GAS_URL+'?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(token)+'&t='+Date.now())}
async function apiPost(payload){return jfetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,token,userToken:token})})}
function normalizePerms(e){const r=String(e.adminRole||'employee').toLowerCase();if(r==='superadmin')return{attendance:'manage',leave:'manage',schedule:'manage',efficiency:'manage',hr:'manage'};const p=e.systemPermissions&&typeof e.systemPermissions==='object'?e.systemPermissions:{};return{attendance:level(p.attendance||'view'),leave:level(p.leave||(r==='employee'?'view':'none')),schedule:level(p.schedule),efficiency:level(p.efficiency),hr:level(p.hr||e.employeeListAccess)}}
async function init(){token=getToken();if(!token){location.href='../';return};try{const d=await apiGet('getSessionMeta');session=d;const p=d.systemPermissions||{};hrAccess=String(d.adminRole||'')==='superadmin'?'manage':level(p.hr);if(hrAccess==='none')throw new Error('此帳號沒有「人資管理系統」查看權限');$('addBtn').classList.toggle('hidden',hrAccess!=='manage');await loadEmployees(false)}catch(e){$('status').textContent='❌ '+(e.message||e);setTimeout(()=>location.href='../',1800)}}
async function loadEmployees(show){try{$('status').textContent='☁️ 正在同步人資主檔...';const d=await apiGet('hrGetEmployees');employees=(d.employees||[]).filter(e=>String(e.empId||'').toUpperCase()!=='ADMIN');hrAccess=d.hrAccess||hrAccess;populateFilters();render();$('status').textContent=`✅ 人資主檔已同步｜${employees.length} 人｜目前權限：${permLabel(hrAccess)}${show?'｜已重新整理':''}`}catch(e){$('status').textContent='❌ '+(e.message||e)}}
function populateFilters(){const set=(id,vals)=>{const el=$(id),cur=el.value;el.innerHTML='<option value="">全部'+(id==='fDept'?'部門':'職務')+'</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');el.value=cur};set('fDept',[...new Set(employees.map(e=>e.dept).filter(Boolean))].sort());set('fJob',[...new Set(employees.map(e=>e.jobTitle||e.deptDetail).filter(Boolean))].sort());}
function resetFilters(){$('q').value='';$('fStatus').value='active';$('fDept').value='';$('fJob').value='';$('fRole').value='';render()}
function setStatusView(status){$('fStatus').value=status;render()}
function openEmploymentHistory(){
  const rows=[];
  employees.forEach(e=>{
    (Array.isArray(e.transferHistory)?e.transferHistory:[]).forEach(h=>{
      rows.push({
        at:h.changedAt||'',empId:e.empId||'',name:e.name||'',type:'部門／職務調動',
        from:`${h.fromDept||'—'} / ${h.fromJobTitle||'—'}`,
        to:`${h.toDept||'—'} / ${h.toJobTitle||'—'}`,
        reason:'',by:h.changedBy||''
      });
    });
    (Array.isArray(e.employmentHistory)?e.employmentHistory:[]).forEach(h=>{
      rows.push({
        at:h.changedAt||'',empId:e.empId||'',name:e.name||'',type:'在職狀態',
        from:employmentLabel(h.fromStatus),to:employmentLabel(h.toStatus),
        reason:h.reason||'',by:h.changedBy||''
      });
    });
  });
  rows.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  $('historyBody').innerHTML=rows.map(x=>`<tr><td>${esc(String(x.at||'').replace('T',' ').slice(0,19))}</td><td>${esc(x.empId)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.type)}</td><td>${esc(x.from)}</td><td>${esc(x.to)}</td><td>${esc(x.reason||'')}</td><td>${esc(x.by||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">目前沒有異動紀錄</td></tr>';
  historyDialog.showModal();
}

function render(){
  const q=$('q').value.trim().toLowerCase(),st=$('fStatus').value,d=$('fDept').value,j=$('fJob').value,r=$('fRole').value;
  let list=employees.filter(e=>{
    const empStatus=normalizeEmploymentStatus(e.employmentStatus);
    const txt=`${e.attNo||''} ${e.empId||''} ${e.name||''} ${e.dept||''} ${e.jobTitle||''} ${e.phone||''} ${e.terminationReason||''}`.toLowerCase();
    return(!q||txt.includes(q))&&(!st||empStatus===st)&&(!d||e.dept===d)&&(!j||(e.jobTitle||e.deptDetail)===j)&&(!r||String(e.adminRole||'employee')===r);
  });
  list.sort((a,b)=>{
    const sa=normalizeEmploymentStatus(a.employmentStatus),sb=normalizeEmploymentStatus(b.employmentStatus);
    const rank={active:0,leave:1,resigned:2};
    return (rank[sa]-rank[sb])||String(a.empId||'').localeCompare(String(b.empId||''),'zh-Hant',{numeric:true});
  });
  $('body').innerHTML=list.map((e,i)=>{
    const p=normalizePerms(e),lb=e.leaveBalance||{},can=hrAccess==='manage',stt=normalizeEmploymentStatus(e.employmentStatus);
    const rowClass=stt==='resigned'?'row-resigned':stt==='leave'?'row-leave':'';
    return`<tr class="${rowClass}">
      <td>${i+1}</td>
      <td><span class="empstatus ${employmentClass(stt)}">${employmentLabel(stt)}</span></td>
      <td>${esc(e.attNo||'')}</td><td><b>${esc(e.empId)}</b></td><td><b>${esc(e.name)}</b></td>
      <td>${esc(e.dept||'')}</td><td>${esc(e.jobTitle||e.deptDetail||'')}</td><td>${esc(e.phone||'')}</td>
      <td>${esc(e.startDate||'')}</td><td>${stt==='resigned'?esc(e.terminationDate||'—'):'—'}</td><td>${esc(e.birthday||'')}</td>
      <td><b>${lb.remaining==null?'—':esc(lb.remaining)+' 天'}</b></td>
      <td>${e.deviceBound?'<span class="pill">已綁定</span>':'—'}</td>
      <td><span class="pill">${roleLabel(String(e.adminRole||'employee'))}</span></td>
      ${SYS.map(k=>`<td><span class="perm ${p[k]}">${permLabel(p[k])}</span></td>`).join('')}
      <td>${can?`<button class="btn" onclick="openEditor('${esc(e.empId)}')">編輯</button>`:'<span class="muted">查看</span>'}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="20" class="muted">沒有符合條件的人員</td></tr>';
  const ps=employees.map(normalizePerms);
  $('stActive').textContent=employees.filter(e=>normalizeEmploymentStatus(e.employmentStatus)==='active').length;
  $('stResigned').textContent=employees.filter(e=>normalizeEmploymentStatus(e.employmentStatus)==='resigned').length;
  $('stLeave').textContent=employees.filter(e=>normalizeEmploymentStatus(e.employmentStatus)==='leave').length;
  $('stAdmins').textContent=employees.filter(e=>['admin','superadmin'].includes(String(e.adminRole))).length;
  $('stDepts').textContent=new Set(employees.filter(e=>normalizeEmploymentStatus(e.employmentStatus)!=='resigned').map(e=>e.dept).filter(Boolean)).size;
  $('stHrManagers').textContent=ps.filter(p=>p.hr==='manage').length;
}
function buildPermGrid(e){const p=normalizePerms(e||{adminRole:'employee'}),superRole=$('adminRole').value==='superadmin',canGrant=String(session?.adminRole||'')==='superadmin';$('permGrid').innerHTML=SYS.map(k=>`<div class="permitem"><b>${LABEL[k]}</b><select id="perm_${k}" ${superRole||!canGrant?'disabled':''}><option value="none">無權限</option><option value="view">查看</option><option value="manage">管理</option></select></div>`).join('');SYS.forEach(k=>{$('perm_'+k).value=superRole?'manage':p[k]})}
function onRoleChange(){buildPermGrid(editing||{adminRole:$('adminRole').value})}
function onEmploymentStatusChange(){
  const st=normalizeEmploymentStatus($('employmentStatus').value);
  const resigned=st==='resigned';
  $('terminationDate').disabled=!resigned;
  $('lastWorkDate').disabled=!resigned;
  $('terminationReason').disabled=!resigned;
  if(resigned){
    if(!$('terminationDate').value)$('terminationDate').value=todayYmd();
    if(!$('lastWorkDate').value)$('lastWorkDate').value=$('terminationDate').value||todayYmd();
  }
}
function openEditor(id=''){
  if(hrAccess!=='manage')return;
  editing=id?employees.find(e=>String(e.empId)===String(id)):null;
  $('modalTitle').textContent=editing?'編輯員工':'新增員工';
  $('origEmpId').value=editing?.empId||'';
  $('attNo').value=editing?.attNo||'';
  $('empId').value=editing?.empId||'';
  $('name').value=editing?.name||'';
  $('dept').value=editing?.dept||'';
  $('jobTitle').value=editing?.jobTitle||editing?.deptDetail||'';
  $('phone').value=editing?.phone||'';
  $('startDate').value=String(editing?.startDate||'').slice(0,10).replace(/\//g,'-');
  $('birthday').value=String(editing?.birthday||'').slice(0,10).replace(/\//g,'-');
  $('leaveRemaining').value=editing?.leaveBalance?.remaining??'';
  $('employmentStatus').value=normalizeEmploymentStatus(editing?.employmentStatus);
  $('terminationDate').value=String(editing?.terminationDate||'').slice(0,10).replace(/\//g,'-');
  $('lastWorkDate').value=String(editing?.lastWorkDate||'').slice(0,10).replace(/\//g,'-');
  $('terminationReason').value=editing?.terminationReason||'';
  $('adminRole').value=editing?.adminRole||'employee';
  $('password').value='';
  $('deviceState').value=editing?.deviceBound?'已綁定':'未綁定';
  $('resignBtn').classList.toggle('hidden',!editing||normalizeEmploymentStatus(editing.employmentStatus)==='resigned');
  $('restoreBtn').classList.toggle('hidden',!editing||normalizeEmploymentStatus(editing.employmentStatus)==='active');
  $('unbindBtn').classList.toggle('hidden',!editing?.deviceBound);
  if(String(session?.adminRole||'')!=='superadmin')$('adminRole').disabled=true;else $('adminRole').disabled=false;
  buildPermGrid(editing||{adminRole:'employee',systemPermissions:{attendance:'view',leave:'view',schedule:'none',efficiency:'none',hr:'none'}});
  onEmploymentStatusChange();
  editor.showModal();
}
async function saveCurrent(){
  if(hrAccess!=='manage')return;
  const empId=$('empId').value.trim().toUpperCase(),name=$('name').value.trim();
  if(!empId||!name){alert('工號與姓名不可空白');return}
  const role=$('adminRole').value,p={};SYS.forEach(k=>p[k]=role==='superadmin'?'manage':$('perm_'+k).value);
  const old=editing||{},lb=old.leaveBalance&&typeof old.leaveBalance==='object'?{...old.leaveBalance}:{};
  if($('leaveRemaining').value!=='')lb.remaining=Number($('leaveRemaining').value);
  const st=normalizeEmploymentStatus($('employmentStatus').value);
  const employee={
    ...old,
    attNo:$('attNo').value.trim(),empId,name,dept:$('dept').value.trim(),
    jobTitle:$('jobTitle').value.trim(),deptDetail:$('jobTitle').value.trim(),
    phone:$('phone').value.trim(),startDate:$('startDate').value,birthday:$('birthday').value,
    password:$('password').value,adminRole:role,systemPermissions:p,employeeListAccess:p.hr,
    leaveBalance:Object.keys(lb).length?lb:null,
    employmentStatus:st,
    terminationDate:st==='resigned'?$('terminationDate').value:'',
    lastWorkDate:st==='resigned'?$('lastWorkDate').value:'',
    terminationReason:st==='resigned'?$('terminationReason').value.trim():''
  };
  if(st==='resigned'&&!employee.terminationDate){alert('離職狀態請填寫離職日期');return}
  try{
    $('saveBtn').disabled=true;$('status').textContent='☁️ 正在儲存人資資料...';
    await apiPost({action:'hrUpsertEmployee',originalEmpId:$('origEmpId').value||empId,employee});
    editor.close();await loadEmployees(false);
    $('status').textContent='✅ 人資資料已儲存｜五大系統會依在職狀態套用人員資格'
  }catch(e){alert('儲存失敗：'+(e.message||e))}
  finally{$('saveBtn').disabled=false}
}
async function resignCurrent(){
  if(!editing)return;
  if(normalizeEmploymentStatus(editing.employmentStatus)==='resigned')return;
  const date=$('terminationDate').value||todayYmd();
  const last=$('lastWorkDate').value||date;
  const reason=$('terminationReason').value.trim();
  if(!confirm(`確定辦理 ${editing.name}（${editing.empId}）離職？\n\n離職日期：${date}\n最後工作日：${last}\n\n歷史考勤、請假、排班、效率資料都會保留；登入與新打卡會停止。`))return;
  try{
    await apiPost({action:'hrSetEmploymentStatus',empId:editing.empId,employmentStatus:'resigned',terminationDate:date,lastWorkDate:last,terminationReason:reason});
    editor.close();await loadEmployees(false);$('status').textContent=`✅ ${editing.name} 已辦理離職，歷史資料完整保留`
  }catch(e){alert('辦理離職失敗：'+(e.message||e))}
}
async function restoreCurrent(){
  if(!editing)return;
  if(!confirm(`確定將 ${editing.name}（${editing.empId}）恢復為在職？\n\n原本的離職紀錄會保留在任職歷程中。`))return;
  try{
    await apiPost({action:'hrSetEmploymentStatus',empId:editing.empId,employmentStatus:'active'});
    editor.close();await loadEmployees(false);$('status').textContent=`✅ ${editing.name} 已恢復在職`
  }catch(e){alert('恢復在職失敗：'+(e.message||e))}
}
async function deleteCurrent(){alert('人資主檔不再使用刪除員工；請改用「辦理離職」。')}
async function unbindCurrent(){if(!editing||!confirm(`解除 ${editing.name} 的打卡裝置綁定？`))return;try{await apiPost({action:'hrUnbindEmployeeDevice',empId:editing.empId});editor.close();await loadEmployees(false)}catch(e){alert('解除失敗：'+(e.message||e))}}
function exportEmployees(){if(typeof XLSX==='undefined')return alert('Excel 元件尚未載入');const rows=employees.map(e=>{const p=normalizePerms(e),lb=e.leaveBalance||{};return{在職狀態:employmentLabel(e.employmentStatus),考勤號:e.attNo||'',工號:e.empId||'',姓名:e.name||'',部門:e.dept||'',職務:e.jobTitle||e.deptDetail||'',電話:e.phone||'',到職日:e.startDate||'',離職日期:e.terminationDate||'',最後工作日:e.lastWorkDate||'',離職原因備註:e.terminationReason||'',生日:e.birthday||'',特休剩餘:lb.remaining??'',角色:roleLabel(String(e.adminRole||'employee')),考勤權限:permLabel(p.attendance),請假權限:permLabel(p.leave),排班權限:permLabel(p.schedule),效率權限:permLabel(p.efficiency),人資權限:permLabel(p.hr),裝置綁定:e.deviceBound?'已綁定':'未綁定'}});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'人資主檔');XLSX.writeFile(wb,`人資主檔_${new Date().toISOString().slice(0,10)}.xlsx`)}
init();
</script>
</body></html>
