<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人資管理系統｜79號碼頭雲端智慧系統</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f8fafc;--panel:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--teal:#0f766e;--teal2:#14b8a6;--danger:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.08)}
html[data-theme="dark"]{--bg:#0f172a;--panel:#111827;--text:#e5e7eb;--muted:#94a3b8;--border:#334155;--teal:#2dd4bf;--teal2:#14b8a6;--shadow:0 10px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.topin{max-width:1600px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#ccfbf1;font-size:22px}html[data-theme="dark"] .logo{background:#134e4a}h1{font-size:18px;margin:0}.sub{font-size:10px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:800}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{background:#fee2e2;border-color:#fecaca;color:#b91c1c}html[data-theme="dark"] .btn.danger{background:#451a1a;border-color:#7f1d1d;color:#fecaca}.wrap{max-width:1600px;margin:auto;padding:14px}.banner{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);font-size:12px;font-weight:750;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}.stat .k{font-size:10px;color:var(--muted)}.stat .v{font-size:24px;font-weight:950;margin-top:3px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:8px;padding:12px;border-bottom:1px solid var(--border)}input,select{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 10px;font-size:12px;outline:none}.tablewrap{overflow:auto;max-height:calc(100vh - 310px)}table{width:100%;border-collapse:collapse;min-width:1450px;font-size:11px}th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}th{position:sticky;top:0;background:var(--panel);z-index:2;font-size:10px;color:var(--muted)}tr:hover td{background:color-mix(in srgb,var(--teal2) 5%,transparent)}.pill{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:900;background:#e2e8f0;color:#334155}html[data-theme="dark"] .pill{background:#334155;color:#e2e8f0}.perm{font-size:9px;white-space:nowrap}.perm.manage{color:#047857;font-weight:900}.perm.view{color:#2563eb;font-weight:900}.perm.none{color:#94a3b8}dialog{border:0;border-radius:18px;padding:0;width:min(920px,calc(100vw - 24px));background:var(--panel);color:var(--text);box-shadow:0 24px 70px rgba(15,23,42,.3)}dialog::backdrop{background:rgba(15,23,42,.58);backdrop-filter:blur(2px)}.modal{padding:18px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{display:block;font-size:10px;font-weight:900;color:var(--muted);margin:0 0 4px 2px}.wide{grid-column:1/-1}.permgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.permitem{border:1px solid var(--border);border-radius:12px;padding:9px}.permitem b{display:block;font-size:10px;margin-bottom:5px}.footer{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--border);margin-top:14px;padding-top:12px}.muted{color:var(--muted);font-size:10px}.hidden{display:none!important}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .wide-search{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}.permgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.topin{align-items:flex-start}.brand h1{font-size:16px}.actions .txt{display:none}.wrap{padding:8px}.stats{gap:6px}.stat{padding:9px}.stat .v{font-size:20px}.filters{grid-template-columns:1fr}.filters .wide-search{grid-column:auto}.grid{grid-template-columns:1fr}.permgrid{grid-template-columns:1fr}.tablewrap{max-height:none}}
</style>

<style id="port79-calendar-mode-style">
#port79CalendarModeBox{position:fixed;right:10px;bottom:10px;z-index:99998;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid rgba(148,163,184,.55);box-shadow:0 6px 20px rgba(15,23,42,.14);backdrop-filter:blur(8px);font:700 11px/1.2 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#475569}
#port79CalendarModeBox select{border:0;background:transparent;color:inherit;font:800 11px/1.2 inherit;outline:none;cursor:pointer;padding:2px 3px}
html.dark #port79CalendarModeBox,html[data-theme="dark"] #port79CalendarModeBox{background:rgba(15,23,42,.94);border-color:#475569;color:#e2e8f0}
@media(max-width:640px){#port79CalendarModeBox{right:6px;bottom:6px;padding:5px 6px;font-size:10px}#port79CalendarModeBox select{font-size:10px}}
</style>

<body>
<header class="top"><div class="topin">
  <div class="brand"><div class="logo">👥</div><div><h1>人資管理系統</h1><div class="sub">79號碼頭雲端智慧系統｜唯一人員主檔｜版本 2026.09.27.1</div></div></div>
  <div class="actions"><button class="btn" onclick="location.href='../'">🏠 <span class="txt">五大系統首頁</span></button><button class="btn" id="themeBtn">🌙 <span class="txt">暗色</span></button><button class="btn" onclick="loadEmployees(true)">↻ <span class="txt">重新同步</span></button><button class="btn" onclick="exportEmployees()">📥 <span class="txt">匯出</span></button><button class="btn primary" id="addBtn" onclick="openEditor()">＋ 新增員工</button></div>
</div></header>
<main class="wrap">
  <div id="status" class="banner">正在驗證人資系統權限...</div>
  <div class="stats"><div class="stat"><div class="k">有效人員</div><div class="v" id="stTotal">0</div></div><div class="stat"><div class="k">管理員／超級管理員</div><div class="v" id="stAdmins">0</div></div><div class="stat"><div class="k">部門數</div><div class="v" id="stDepts">0</div></div><div class="stat"><div class="k">可管理人資</div><div class="v" id="stHrManagers">0</div></div></div>
  <section class="card">
    <div class="filters"><input id="q" class="wide-search" placeholder="搜尋工號、姓名、部門、職務、電話" oninput="render()"><select id="fDept" onchange="render()"><option value="">全部部門</option></select><select id="fJob" onchange="render()"><option value="">全部職務</option></select><select id="fRole" onchange="render()"><option value="">全部角色</option><option value="employee">一般員工</option><option value="admin">管理員</option><option value="superadmin">超級管理員</option></select><button class="btn" onclick="resetFilters()">清除</button></div>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>考勤號</th><th>工號</th><th>姓名</th><th>部門</th><th>職務</th><th>電話</th><th>到職日</th><th>生日</th><th>特休剩餘</th><th>裝置</th><th>角色</th><th>考勤</th><th>請假</th><th>排班</th><th>效率</th><th>人資</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
  </section>
</main>
<dialog id="editor"><form method="dialog" onsubmit="return false"><div class="modal"><div class="modalhead"><div><b id="modalTitle">新增員工</b><div class="muted">所有五大系統都會讀取這一份人資主檔；不會搬移或重建既有 Google Sheet。</div></div><button class="btn" onclick="editor.close()">關閉</button></div>
<div class="grid">
  <input id="origEmpId" type="hidden">
  <div class="field"><label>考勤號碼</label><input id="attNo" inputmode="numeric"></div><div class="field"><label>工號 *</label><input id="empId" required></div><div class="field"><label>姓名 *</label><input id="name" required></div>
  <div class="field"><label>部門</label><input id="dept"></div><div class="field"><label>職務</label><input id="jobTitle"></div><div class="field"><label>電話</label><input id="phone"></div>
  <div class="field"><label>到職日</label><input id="startDate" type="date"></div><div class="field"><label>生日</label><input id="birthday" type="date"></div><div class="field"><label>特休剩餘天數</label><input id="leaveRemaining" type="number" step="0.5" min="0"></div>
  <div class="field"><label>後台角色</label><select id="adminRole" onchange="onRoleChange()"><option value="employee">一般員工</option><option value="admin">管理員</option><option value="superadmin">超級管理員</option></select></div><div class="field"><label>登入密碼</label><input id="password" type="password" placeholder="留空＝維持原密碼"></div><div class="field"><label>裝置綁定</label><input id="deviceState" disabled></div>
  <div class="field wide"><label>五大系統權限（超級管理員固定全部管理；一般 HR 管理員不可更改其他人的管理權限）</label><div class="permgrid" id="permGrid"></div></div>
</div>
<div class="footer"><div class="muted" id="editHint">變更部門／職務時會自動留下調動紀錄。</div><div style="display:flex;gap:8px"><button class="btn danger" id="deleteBtn" onclick="deleteCurrent()">刪除員工</button><button class="btn" id="unbindBtn" onclick="unbindCurrent()">解除裝置</button><button class="btn primary" id="saveBtn" onclick="saveCurrent()">💾 儲存</button></div></div>
</div></form></dialog>

<div id="port79CalendarModeBox" aria-label="年份顯示方式">
  <span>年份</span>
  <select id="port79CalendarModeSelect" title="切換西元年／民國年">
    <option value="gregorian">西元</option>
    <option value="roc">民國</option>
  </select>
</div>
<script id="port79-calendar-mode-script">
(function(){
  const KEY='port79_year_mode';
  const mode=localStorage.getItem(KEY)==='roc'?'roc':'gregorian';
  const sel=document.getElementById('port79CalendarModeSelect');
  if(sel){
    sel.value=mode;
    sel.addEventListener('change',()=>{
      localStorage.setItem(KEY,sel.value==='roc'?'roc':'gregorian');
      location.reload();
    });
  }
  if(mode!=='roc')return;
  const skip=new Set(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT']);
  const cv=(s)=>{
    s=String(s||'');
    s=s.replace(/\b((?:19|20)\d{2})([\/-])(\d{1,2})\2(\d{1,2})\b/g,(m,y,sep,mo,d)=>`民國${Number(y)-1911}${sep}${mo}${sep}${d}`);
    s=s.replace(/\b((?:19|20)\d{2})([\/-])(\d{1,2})(?![\/-]\d)/g,(m,y,sep,mo)=>`民國${Number(y)-1911}${sep}${mo}`);
    s=s.replace(/\b((?:19|20)\d{2})年/g,(m,y)=>`民國${Number(y)-1911}年`);
    return s;
  };
  let busy=false;
  function scan(root){
    if(!root||busy)return;
    busy=true;
    try{
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const nodes=[]; let n;
      while(n=walker.nextNode())nodes.push(n);
      nodes.forEach(node=>{
        const p=node.parentElement;
        if(!p||skip.has(p.tagName)||p.closest('#port79CalendarModeBox'))return;
        const old=node.nodeValue||'';
        const next=cv(old);
        if(next!==old)node.nodeValue=next;
      });
    }finally{busy=false}
  }
  scan(document.body);
  const mo=new MutationObserver(ms=>{
    if(busy)return;
    ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)scan(n.nodeType===1?n:n.parentElement)}));
  });
  mo.observe(document.body,{childList:true,subtree:true});
})();
</script>

<script>
const APP_VERSION='2026.09.27.1-HR-MASTER';
const DEFAULT_GAS_URL="https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec";
let GAS_URL=String(sessionStorage.getItem('port79_gas_url')||DEFAULT_GAS_URL).trim();
let employees=[],session=null,token='',hrAccess='none',editing=null;
const SYS=['attendance','leave','schedule','efficiency','hr'];
const LABEL={attendance:'考勤',leave:'請假',schedule:'排班',efficiency:'效率',hr:'人資'};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const level=v=>['none','view','manage'].includes(String(v||'').toLowerCase())?String(v).toLowerCase():'none';
function roleLabel(v){return v==='superadmin'?'超級管理員':v==='admin'?'管理員':'一般員工'}
function permLabel(v){return v==='manage'?'管理':v==='view'?'查看':'無'}
function theme(){const d=document.documentElement.getAttribute('data-theme')==='dark';$('themeBtn').innerHTML=d?'☀️ <span class="txt">亮色</span>':'🌙 <span class="txt">暗色</span>'}
(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('port79_theme')||'light');theme();$('themeBtn').onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('port79_theme',n);theme()}})();
function readHash(){try{const p=new URLSearchParams(String(location.hash||'').replace(/^#/,''));const g=p.get('gasurl');if(g){GAS_URL=g;sessionStorage.setItem('port79_gas_url',g)}const t=p.get('port79sso');if(t)sessionStorage.setItem('port79_user_token',t);history.replaceState(null,'',location.pathname+location.search);return t||''}catch{return''}}
function getToken(){return String(readHash()||sessionStorage.getItem('port79_user_token')||sessionStorage.getItem('port79_admin_token')||'').trim()}
async function jfetch(url,opt={},ms=16000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal,redirect:'follow',cache:'no-store'});const s=await r.text();if(/^<!doctype|^<html/i.test(s.trim()))throw new Error('GAS 回傳 Google 網頁，請重新部署 Apps Script');const d=JSON.parse(s);if(!d.ok)throw new Error(d.error||'雲端操作失敗');return d}finally{clearTimeout(tm)}}
async function apiGet(action){return jfetch(GAS_URL+'?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(token)+'&t='+Date.now())}
async function apiPost(payload){return jfetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,token,userToken:token})})}
function normalizePerms(e){const r=String(e.adminRole||'employee').toLowerCase();if(r==='superadmin')return{attendance:'manage',leave:'manage',schedule:'manage',efficiency:'manage',hr:'manage'};const p=e.systemPermissions&&typeof e.systemPermissions==='object'?e.systemPermissions:{};return{attendance:level(p.attendance||'view'),leave:level(p.leave||(r==='employee'?'view':'none')),schedule:level(p.schedule),efficiency:level(p.efficiency),hr:level(p.hr||e.employeeListAccess)}}
async function init(){token=getToken();if(!token){location.href='../';return};try{const d=await apiGet('getSessionMeta');session=d;const p=d.systemPermissions||{};hrAccess=String(d.adminRole||'')==='superadmin'?'manage':level(p.hr);if(hrAccess==='none')throw new Error('此帳號沒有「人資管理系統」查看權限');$('addBtn').classList.toggle('hidden',hrAccess!=='manage');await loadEmployees(false)}catch(e){$('status').textContent='❌ '+(e.message||e);setTimeout(()=>location.href='../',1800)}}
async function loadEmployees(show){try{$('status').textContent='☁️ 正在同步人資主檔...';const d=await apiGet('hrGetEmployees');employees=(d.employees||[]).filter(e=>String(e.empId||'').toUpperCase()!=='ADMIN');hrAccess=d.hrAccess||hrAccess;populateFilters();render();$('status').textContent=`✅ 人資主檔已同步｜${employees.length} 人｜目前權限：${permLabel(hrAccess)}${show?'｜已重新整理':''}`}catch(e){$('status').textContent='❌ '+(e.message||e)}}
function populateFilters(){const set=(id,vals)=>{const el=$(id),cur=el.value;el.innerHTML='<option value="">全部'+(id==='fDept'?'部門':'職務')+'</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');el.value=cur};set('fDept',[...new Set(employees.map(e=>e.dept).filter(Boolean))].sort());set('fJob',[...new Set(employees.map(e=>e.jobTitle||e.deptDetail).filter(Boolean))].sort());}
function resetFilters(){$('q').value='';$('fDept').value='';$('fJob').value='';$('fRole').value='';render()}
function render(){const q=$('q').value.trim().toLowerCase(),d=$('fDept').value,j=$('fJob').value,r=$('fRole').value;let list=employees.filter(e=>{const txt=`${e.attNo||''} ${e.empId||''} ${e.name||''} ${e.dept||''} ${e.jobTitle||''} ${e.phone||''}`.toLowerCase();return(!q||txt.includes(q))&&(!d||e.dept===d)&&(!j||(e.jobTitle||e.deptDetail)===j)&&(!r||String(e.adminRole||'employee')===r)});list.sort((a,b)=>String(a.empId||'').localeCompare(String(b.empId||''),'zh-Hant',{numeric:true}));$('body').innerHTML=list.map((e,i)=>{const p=normalizePerms(e),lb=e.leaveBalance||{},can=hrAccess==='manage';return`<tr><td>${i+1}</td><td>${esc(e.attNo||'')}</td><td><b>${esc(e.empId)}</b></td><td><b>${esc(e.name)}</b></td><td>${esc(e.dept||'')}</td><td>${esc(e.jobTitle||e.deptDetail||'')}</td><td>${esc(e.phone||'')}</td><td>${esc(e.startDate||'')}</td><td>${esc(e.birthday||'')}</td><td><b>${lb.remaining==null?'—':esc(lb.remaining)+' 天'}</b></td><td>${e.deviceBound?'<span class="pill">已綁定</span>':'—'}</td><td><span class="pill">${roleLabel(String(e.adminRole||'employee'))}</span></td>${SYS.map(k=>`<td><span class="perm ${p[k]}">${permLabel(p[k])}</span></td>`).join('')}<td>${can?`<button class="btn" onclick="openEditor('${esc(e.empId)}')">編輯</button>`:'<span class="muted">查看</span>'}</td></tr>`}).join('')||'<tr><td colspan="18" class="muted">沒有符合條件的人員</td></tr>';const ps=employees.map(normalizePerms);$('stTotal').textContent=employees.length;$('stAdmins').textContent=employees.filter(e=>['admin','superadmin'].includes(String(e.adminRole))).length;$('stDepts').textContent=new Set(employees.map(e=>e.dept).filter(Boolean)).size;$('stHrManagers').textContent=ps.filter(p=>p.hr==='manage').length;}
function buildPermGrid(e){const p=normalizePerms(e||{adminRole:'employee'}),superRole=$('adminRole').value==='superadmin',canGrant=String(session?.adminRole||'')==='superadmin';$('permGrid').innerHTML=SYS.map(k=>`<div class="permitem"><b>${LABEL[k]}</b><select id="perm_${k}" ${superRole||!canGrant?'disabled':''}><option value="none">無權限</option><option value="view">查看</option><option value="manage">管理</option></select></div>`).join('');SYS.forEach(k=>{$('perm_'+k).value=superRole?'manage':p[k]})}
function onRoleChange(){buildPermGrid(editing||{adminRole:$('adminRole').value})}
function openEditor(id=''){if(hrAccess!=='manage')return;editing=id?employees.find(e=>String(e.empId)===String(id)):null;$('modalTitle').textContent=editing?'編輯員工':'新增員工';$('origEmpId').value=editing?.empId||'';$('attNo').value=editing?.attNo||'';$('empId').value=editing?.empId||'';$('name').value=editing?.name||'';$('dept').value=editing?.dept||'';$('jobTitle').value=editing?.jobTitle||editing?.deptDetail||'';$('phone').value=editing?.phone||'';$('startDate').value=String(editing?.startDate||'').slice(0,10);$('birthday').value=String(editing?.birthday||'').slice(0,10);$('leaveRemaining').value=editing?.leaveBalance?.remaining??'';$('adminRole').value=editing?.adminRole||'employee';$('password').value='';$('deviceState').value=editing?.deviceBound?'已綁定':'未綁定';$('deleteBtn').classList.toggle('hidden',!editing);$('unbindBtn').classList.toggle('hidden',!editing?.deviceBound);if(String(session?.adminRole||'')!=='superadmin'){$('adminRole').disabled=true}else{$('adminRole').disabled=false}buildPermGrid(editing||{adminRole:'employee',systemPermissions:{attendance:'view',leave:'view',schedule:'none',efficiency:'none',hr:'none'}});editor.showModal()}
async function saveCurrent(){if(hrAccess!=='manage')return;const empId=$('empId').value.trim().toUpperCase(),name=$('name').value.trim();if(!empId||!name){alert('工號與姓名不可空白');return};const role=$('adminRole').value,p={};SYS.forEach(k=>p[k]=role==='superadmin'?'manage':$('perm_'+k).value);const old=editing||{},lb=old.leaveBalance&&typeof old.leaveBalance==='object'?{...old.leaveBalance}:{};if($('leaveRemaining').value!=='')lb.remaining=Number($('leaveRemaining').value);const employee={...old,attNo:$('attNo').value.trim(),empId,name,dept:$('dept').value.trim(),jobTitle:$('jobTitle').value.trim(),deptDetail:$('jobTitle').value.trim(),phone:$('phone').value.trim(),startDate:$('startDate').value,birthday:$('birthday').value,password:$('password').value,adminRole:role,systemPermissions:p,employeeListAccess:p.hr,leaveBalance:Object.keys(lb).length?lb:null};try{$('saveBtn').disabled=true;$('status').textContent='☁️ 正在儲存人資資料...';await apiPost({action:'hrUpsertEmployee',originalEmpId:$('origEmpId').value||empId,employee});editor.close();await loadEmployees(false);$('status').textContent='✅ 人資資料已儲存，其他四個系統下次同步時會自動取得最新人員資料'}catch(e){alert('儲存失敗：'+(e.message||e))}finally{$('saveBtn').disabled=false}}
async function deleteCurrent(){if(!editing||!confirm(`確定刪除 ${editing.name}（${editing.empId}）？
既有考勤、請假、排班、效率歷史紀錄不會被刪除。`))return;try{await apiPost({action:'hrDeleteEmployee',empId:editing.empId});editor.close();await loadEmployees(false)}catch(e){alert('刪除失敗：'+(e.message||e))}}
async function unbindCurrent(){if(!editing||!confirm(`解除 ${editing.name} 的打卡裝置綁定？`))return;try{await apiPost({action:'hrUnbindEmployeeDevice',empId:editing.empId});editor.close();await loadEmployees(false)}catch(e){alert('解除失敗：'+(e.message||e))}}
function exportEmployees(){if(typeof XLSX==='undefined')return alert('Excel 元件尚未載入');const rows=employees.map(e=>{const p=normalizePerms(e),lb=e.leaveBalance||{};return{考勤號:e.attNo||'',工號:e.empId||'',姓名:e.name||'',部門:e.dept||'',職務:e.jobTitle||e.deptDetail||'',電話:e.phone||'',到職日:e.startDate||'',生日:e.birthday||'',特休剩餘:lb.remaining??'',角色:roleLabel(String(e.adminRole||'employee')),考勤權限:permLabel(p.attendance),請假權限:permLabel(p.leave),排班權限:permLabel(p.schedule),效率權限:permLabel(p.efficiency),人資權限:permLabel(p.hr),裝置綁定:e.deviceBound?'已綁定':'未綁定'}});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'人資主檔');XLSX.writeFile(wb,`人資主檔_${new Date().toISOString().slice(0,10)}.xlsx`)}
init();
</script>
</body></html>
