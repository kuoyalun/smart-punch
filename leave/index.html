<style>
*{box-sizing:border-box} :root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--pri:#059669;--pri2:#0d9488;--danger:#e11d48;--warn:#d97706;--input:#fff}
html[data-theme="dark"]{color-scheme:dark;--bg:#020617;--card:#0f172a;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--input:#111827}

header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#064e3b,#0f766e);color:white;padding:16px 18px;box-shadow:0 8px 24px #0002}
.header-inner{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:900;font-size:20px}.sub{font-size:11px;opacity:.8;margin-top:3px}
.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn-home{background:#ffffff20;color:white;border:1px solid #ffffff35}.btn-pri{background:var(--pri);color:white}.btn-sec{background:#475569;color:white}.btn-danger{background:var(--danger);color:white}.btn-warn{background:var(--warn);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1150px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 8px 25px #0f172a0c}.card h2{margin:0 0 14px;font-size:16px}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px}.field{margin-bottom:12px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:11px;background:var(--input);color:var(--text);font:inherit;font-size:14px;outline:none}textarea{resize:vertical;min-height:78px}
.status{padding:11px 12px;border-radius:11px;font-size:12px;line-height:1.5;margin-bottom:12px;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857}.status.error{background:#fff1f2;border-color:#fecdd3;color:#be123c}.status.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.status.info{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
html[data-theme="dark"] .status{background:#052e24;border-color:#047857;color:#a7f3d0}html[data-theme="dark"] .status.error{background:#3f0d18;border-color:#9f1239;color:#fecdd3}html[data-theme="dark"] .status.warn{background:#422006;border-color:#a16207;color:#fde68a}html[data-theme="dark"] .status.info{background:#172554;border-color:#1d4ed8;color:#bfdbfe}
.hidden{display:none!important}.balance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{padding:10px;border-radius:12px;background:#ecfdf5;border:1px solid #a7f3d0;text-align:center}.metric b{display:block;font-size:20px;color:#047857}.metric span{font-size:10px;color:#64748b}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}.toolbar .field{margin:0;min-width:130px;flex:1}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#ffe4e6;color:#9f1239}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}th,td{padding:10px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:#f8fafc;color:#475569;position:sticky;top:0}html[data-theme="dark"] th{background:#111827;color:#cbd5e1}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:6px 8px;font-size:10px;border:0;border-radius:8px;font-weight:800;cursor:pointer}
.emp-card{padding:12px;border-radius:13px;background:linear-gradient(135deg,#064e3b,#0f766e);color:white;margin-bottom:12px}.emp-card .name{font-size:18px;font-weight:900}.emp-card .meta{font-size:11px;opacity:.82;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#059669;color:white;border-color:#059669}
.note{font-size:11px;color:var(--muted);line-height:1.6}.top-actions{display:flex;gap:8px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.header-inner{align-items:flex-start}.title{font-size:18px}.top-actions{flex-direction:column}.balance{grid-template-columns:1fr 1fr 1fr}main{padding:12px}.card{padding:15px}}
</style>

<body>
<header>
  <div class="header-inner">
    <div><div class="title">📝 請假系統</div><div class="sub">版本 2026.09.27.1｜人員與每月特休餘額統一由人資管理系統取得</div></div>
    <div class="top-actions"><button class="btn btn-home" onclick="location.href='../'">← 回四大入口</button><button id="themeBtn" class="btn btn-home">🌙 暗色</button></div>
  </div>
</header>
<main>
  <div id="globalStatus" class="status info">正在連線雲端...</div>

  <div id="leaveStickyTabs" class="tabs">
    <button id="tabEmployee" class="tab active" onclick="switchMode('employee')">👷 員工請假</button>
    <button id="tabAdmin" class="tab hidden" onclick="switchMode('admin')">🛡️ 管理／審核</button>
  </div>

  <section id="employeeMode">
    <div class="grid">
      <div>
        <div id="employeeLoginCard" class="card">
          <h2>員工身分</h2>
          <div class="field"><label>考勤號／工號／電話</label><input id="empLoginInput" placeholder="輸入後按確認"></div>
          <button class="btn btn-pri" style="width:100%" onclick="employeeLogin()">確認員工身分</button>
          <p class="note">與考勤系統使用同一份「人資主檔」。這裡不另外建立人員資料。</p>
        </div>

        <div id="employeeProfileCard" class="card hidden">
          <div class="emp-card"><div id="empName" class="name">--</div><div id="empMeta" class="meta">--</div></div>
          <div class="balance">
            <div class="metric"><b id="balanceEntitled">--</b><span>可休合計</span></div>
            <div class="metric"><b id="balanceUsed">--</b><span>已休</span></div>
            <div class="metric"><b id="balanceRemaining">--</b><span>目前未休</span></div>
          </div>
          <div id="balanceAsOf" class="status info" style="margin-top:0">特休基準：尚無匯入資料</div>
          <div class="field"><label>假別</label>
            <select id="leaveType"><option>特休假</option><option>事假</option><option>普通傷病假</option><option>婚假</option><option>訂婚假</option><option>喪假</option><option>產假</option><option>產檢假</option><option>陪產假</option><option>家庭照顧假</option><option>生理假</option><option>公假</option><option>加班補休</option><option>其他</option></select>
          </div>
          <div class="field"><label>開始日期</label><input id="leaveStart" type="date" onchange="updateDays()"></div>
          <div class="field"><label>結束日期</label><input id="leaveEnd" type="date" onchange="updateDays()"></div>
          <div class="field"><label>請假天數</label><input id="leaveDays" value="1" readonly></div>
          <div class="field"><label>事由／備註</label><textarea id="leaveReason" placeholder="請輸入請假事由"></textarea></div>
          <button id="submitLeaveBtn" class="btn btn-pri" style="width:100%" onclick="submitLeave()">📤 送出請假申請</button>
          <button class="btn btn-sec" style="width:100%;margin-top:8px" onclick="logoutEmployee()">更換員工</button>
        </div>
      </div>

      <div class="card">
        <h2>我的請假紀錄</h2>
        <div class="table-wrap"><table><thead><tr><th>假別</th><th>日期</th><th>天數</th><th>事由</th><th>狀態</th></tr></thead><tbody id="myLeaveBody"><tr><td colspan="5">請先確認員工身分</td></tr></tbody></table></div>
      </div>
    </div>
  </section>

  <section id="adminMode" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
        <div><h2 style="margin-bottom:5px">管理員請假審核</h2><div id="adminWho" class="note"></div></div>
        <button class="btn btn-sec" onclick="loadCloud(true)">🔄 重新整理</button>
      </div>
      <div class="toolbar">
        <div class="field"><label>搜尋姓名／工號</label><input id="filterKeyword" oninput="renderAdmin()" placeholder="關鍵字"></div>
        <div class="field"><label>部門</label><select id="filterDept" onchange="renderAdmin()"><option value="">全部部門</option></select></div>
        <div class="field"><label>狀態</label><select id="filterStatus" onchange="renderAdmin()"><option value="">全部狀態</option><option>待審核</option><option>已核准</option><option>已駁回</option></select></div>
      </div>
      <div id="adminReadOnly" class="status warn hidden">此帳號只有「查看」權限，不能核准、駁回或刪除。</div>
      <div class="table-wrap"><table><thead><tr><th>人員</th><th>部門</th><th>假別</th><th>日期</th><th>天數</th><th>事由</th><th>狀態</th><th>操作</th></tr></thead><tbody id="adminLeaveBody"></tbody></table></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
        <div><h2 style="margin-bottom:5px">🏖️ 員工年假／特休剩餘天數</h2><div class="note">直接讀取考勤系統每月匯入到「人資主檔」的特休資料，不另外建立第二份資料。</div></div>
        <div class="field" style="margin:0;min-width:220px"><label>搜尋工號／姓名／部門</label><input id="balanceKeyword" oninput="renderAdminBalances()" placeholder="輸入關鍵字"></div>
      </div>
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>工號</th><th>姓名</th><th>部門</th><th>基準月份</th><th>遞延</th><th>今年年假</th><th>已休</th><th>目前未休</th></tr></thead><tbody id="adminBalanceBody"><tr><td colspan="8">正在載入...</td></tr></tbody></table></div>
    </div>
  </section>
</main>
<script>
const APP_VERSION='2026.09.27.1-HR-SOURCE-YEAR-MODE';
const GAS_URL='https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';
const $=id=>document.getElementById(id);
let employees=[], leaveRecords=[], currentEmployee=null, adminSession=null, adminToken='', leaveAccess='none', currentMode='employee';

function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function level(v,f='none'){v=String(v??'').toLowerCase();return ['none','view','manage'].includes(v)?v:f}
function perms(emp,role){role=String(role||emp?.adminRole||'employee').toLowerCase();if(role==='superadmin')return{attendance:'manage',leave:'manage',schedule:'manage',efficiency:'manage'};const raw=emp?.systemPermissions&&typeof emp.systemPermissions==='object'?emp.systemPermissions:{};const def=role==='admin'?{attendance:'view',leave:'none',schedule:'none',efficiency:'none'}:{attendance:'view',leave:'view',schedule:'view',efficiency:'none'};return{attendance:level(raw.attendance,def.attendance),leave:level(raw.leave,def.leave),schedule:level(raw.schedule,def.schedule),efficiency:level(raw.efficiency,def.efficiency)}}
function setStatus(msg,type='info'){const b=$('globalStatus');b.className='status '+type;b.textContent=msg}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('leave_theme',t);$('themeBtn').textContent=t==='dark'?'☀️ 淺色':'🌙 暗色'};setTheme(localStorage.getItem('leave_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));$('themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

async function jsonFetch(url,opt={},timeout=12000){
 const c=typeof AbortController!=='undefined'?new AbortController():null;let timed=false;const t=c?setTimeout(()=>{timed=true;try{c.abort()}catch{}},timeout):null;
 try{const r=await fetch(url,{...opt,signal:c?.signal});const raw=await r.text();if(!r.ok)throw new Error('HTTP '+r.status);if(/^<!doctype|<html/i.test(raw.trim()))throw new Error('GAS 回傳網頁而不是 JSON');return JSON.parse(raw)}
 catch(e){if(timed||String(e?.name)==='AbortError'||/abort/i.test(String(e?.message||e)))throw new Error('雲端回應逾時，請再試一次');throw e}
 finally{if(t)clearTimeout(t)}
}
async function loadCloud(show=false){
 let last;
 for(let i=0;i<3;i++){
  try{
   const d=await jsonFetch(GAS_URL+'?action=getLeaveData&t='+Date.now(),{cache:'no-store',redirect:'follow'},12000);
   if(d?.retryable){last=new Error(d.error||'雲端忙碌');await new Promise(r=>setTimeout(r,350));continue}
   if(!d?.ok)throw new Error(d?.error||'雲端讀取失敗');
   employees=Array.isArray(d.employees)?d.employees:[];leaveRecords=Array.isArray(d.leaveRecords)?d.leaveRecords:[];
   populateDepartments();renderAll();setStatus('☁️ 雲端同步完成｜人員 '+employees.length+'｜請假 '+leaveRecords.length,'');return true;
  }catch(e){last=e;if(i<2)await new Promise(r=>setTimeout(r,450*(i+1)))}
 }
 setStatus('雲端連線失敗：'+(last?.message||last),'error');return false;
}
async function postCloud(payload){
 if(adminToken){payload.gcToken=adminToken;payload.token=adminToken}
 const d=await jsonFetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'},12000);
 if(!d?.ok)throw new Error(d?.error||d?.message||'雲端操作失敗');return d;
}
function readHash(){try{const p=new URLSearchParams(String(location.hash||'').replace(/^#/,''));const gas=p.get('gasurl');if(gas)sessionStorage.setItem('port79_gas_url',gas);return String(p.get('port79sso')||'')}catch{return''}}
function storedToken(){return String(readHash()||sessionStorage.getItem('port79_admin_token')||sessionStorage.getItem('port79_gc_superadmin_token')||sessionStorage.getItem('port79_gc_token')||'').trim()}
async function restoreAdmin(){
 adminToken=storedToken();if(!adminToken)return false;
 try{
  const d=await jsonFetch(GAS_URL+'?action=gcGetSyncMeta&gcToken='+encodeURIComponent(adminToken)+'&t='+Date.now(),{cache:'no-store',redirect:'follow'},9000);
  if(!d?.ok)throw new Error(d?.error||'SSO 驗證失敗');
  const role=String(d.adminRole||'').toLowerCase();if(!['admin','superadmin'].includes(role))throw new Error('沒有管理員權限');
  const p=perms({systemPermissions:d.systemPermissions},role);leaveAccess=p.leave;
  if(leaveAccess==='none')throw new Error('此帳號沒有請假系統權限');
  adminSession={empId:String(d.empId||''),name:String(d.name||''),adminRole:role,systemPermissions:p};
  try{history.replaceState(null,'',location.pathname+location.search)}catch{}
  $('tabAdmin').classList.remove('hidden');$('adminWho').textContent=`${adminSession.name||adminSession.empId}｜${role==='superadmin'?'超級管理員':'管理員'}｜${leaveAccess==='manage'?'可管理':'只能查看'}`;$('adminReadOnly').classList.toggle('hidden',leaveAccess==='manage');
  switchMode('admin');return true;
 }catch(e){console.warn(e);adminSession=null;adminToken='';setStatus('管理員 SSO 無法進入請假系統：'+(e?.message||e),'warn');return false}
}
function switchMode(m){currentMode=m;$('employeeMode').classList.toggle('hidden',m!=='employee');$('adminMode').classList.toggle('hidden',m!=='admin');$('tabEmployee').classList.toggle('active',m==='employee');$('tabAdmin').classList.toggle('active',m==='admin');if(m==='admin'){renderAdmin();renderAdminBalances()}}
function employeeLogin(){
 const raw=$('empLoginInput').value.trim(),digits=raw.replace(/\D/g,'');if(!raw){setStatus('請輸入考勤號、工號或電話','warn');return}
 const matches=employees.filter(e=>String(e.empId||'').trim().toUpperCase()===raw.toUpperCase()||String(e.attNo??'').trim()===raw|| (digits&&String(e.phone||'').replace(/\D/g,'')===digits));
 if(matches.length!==1){setStatus(matches.length>1?'找到多筆人員，請改用完整工號':'找不到員工，請確認人資主檔','error');return}
 const e=matches[0];if(perms(e,e.adminRole).leave==='none'){setStatus('此員工目前沒有請假系統權限','error');return}
 currentEmployee=e;sessionStorage.setItem('port79_leave_emp_id',String(e.empId||''));showEmployee();setStatus('✅ 已確認 '+(e.name||e.empId),'')
}
function logoutEmployee(){currentEmployee=null;sessionStorage.removeItem('port79_leave_emp_id');$('employeeLoginCard').classList.remove('hidden');$('employeeProfileCard').classList.add('hidden');renderMy()}
function isSpecialLeave(l){return String(l?.leaveType||'').includes('特休')}
function leaveDays(l){const n=Number(l?.days??l?.hours??0);return Number.isFinite(n)?n:0}
function leaveBalanceInfo(emp){
 const b=emp?.leaveBalance;if(!b||!Number.isFinite(Number(b.remaining)))return{entitled:null,used:null,effectiveRemaining:null,newlyApproved:0,asOf:''};
 const baseline=new Set(Array.isArray(b.baselineApprovedLeaveIds)?b.baselineApprovedLeaveIds.map(String):[]);
 const newlyApproved=leaveRecords.filter(l=>sameEmployee(l,emp)&&isSpecialLeave(l)&&String(l.status||'')==='已核准'&&!baseline.has(String(l.id||''))).reduce((sum,l)=>sum+leaveDays(l),0);
 const importedRemaining=Number(b.remaining)||0;
 return{entitled:(Number(b.carryOver)||0)+(Number(b.annual)||0),used:(Number(b.used)||0)+newlyApproved,effectiveRemaining:Math.max(0,Math.round((importedRemaining-newlyApproved)*10)/10),newlyApproved,asOf:String(b.asOf||'')};
}
function fmtDay(n){return Number.isFinite(Number(n))?Number(n).toFixed(1):'--'}
function showEmployee(){
 if(!currentEmployee)return;$('employeeLoginCard').classList.add('hidden');$('employeeProfileCard').classList.remove('hidden');$('empName').textContent=currentEmployee.name||currentEmployee.empId;$('empMeta').textContent=`工號 ${currentEmployee.empId||'--'}｜考勤號 ${currentEmployee.attNo||'--'}｜${currentEmployee.dept||'未設定部門'}`;
 const info=leaveBalanceInfo(currentEmployee);$('balanceEntitled').textContent=fmtDay(info.entitled);$('balanceUsed').textContent=fmtDay(info.used);$('balanceRemaining').textContent=fmtDay(info.effectiveRemaining);$('balanceAsOf').textContent=info.effectiveRemaining==null?'特休基準：尚無每月匯入資料':`特休基準：${info.asOf||'最近一次匯入'}${info.newlyApproved>0?`｜匯入後另核准 ${fmtDay(info.newlyApproved)} 天，已自動扣除`:''}`;renderMy()
}
function sameEmployee(l,e){return String(l.empId||'').trim().toUpperCase()===String(e.empId||'').trim().toUpperCase() || (String(l.attNo||'').trim()&&String(l.attNo||'').trim()===String(e.attNo||'').trim())}
function badge(s){const c=s==='已核准'?'approved':s==='已駁回'?'rejected':'pending';return `<span class="badge ${c}">${esc(s||'待審核')}</span>`}
function renderMy(){
 const body=$('myLeaveBody');if(!currentEmployee){body.innerHTML='<tr><td colspan="5">請先確認員工身分</td></tr>';return}
 const rows=leaveRecords.filter(l=>sameEmployee(l,currentEmployee)).sort((a,b)=>String(b.startTime||b.startDate||'').localeCompare(String(a.startTime||a.startDate||'')));
 body.innerHTML=rows.length?rows.map(l=>`<tr><td>${esc(l.leaveType||'')}</td><td>${esc(l.startTime||l.startDate||'')} ～ ${esc(l.endTime||l.endDate||'')}</td><td>${esc(l.days??l.hours??'')}</td><td>${esc(l.reason||'')}</td><td>${badge(l.status)}</td></tr>`).join(''):'<tr><td colspan="5">目前沒有請假紀錄</td></tr>'
}
function updateDays(){const s=$('leaveStart').value,e=$('leaveEnd').value;if(!s||!e){$('leaveDays').value='';return}const a=new Date(s+'T00:00:00'),b=new Date(e+'T00:00:00');const d=Math.floor((b-a)/86400000)+1;$('leaveDays').value=d>0?d:''}
async function submitLeave(){
 if(!currentEmployee)return;const s=$('leaveStart').value,e=$('leaveEnd').value;if(!s||!e){setStatus('請選擇開始與結束日期','warn');return}updateDays();const days=Number($('leaveDays').value);if(!days){setStatus('結束日期不可早於開始日期','error');return}
 const btn=$('submitLeaveBtn');btn.disabled=true;btn.textContent='上傳中...';
 try{const rec={id:String(Date.now()),attNo:currentEmployee.attNo||'',empId:currentEmployee.empId||'',name:currentEmployee.name||'',dept:currentEmployee.dept||'',leaveType:$('leaveType').value,startDate:s,endDate:e,days,reason:$('leaveReason').value.trim(),status:'待審核',source:'leave-system'};await postCloud({action:'addLeave',leave:rec});setStatus('✅ 請假申請已送出','');$('leaveReason').value='';await loadCloud()}
 catch(e){setStatus('送出失敗：'+(e?.message||e),'error')}
 finally{btn.disabled=false;btn.textContent='📤 送出請假申請'}
}
function populateDepartments(){const sel=$('filterDept');const cur=sel.value;const ds=[...new Set(employees.map(e=>String(e.dept||'').trim()).filter(Boolean))].sort();sel.innerHTML='<option value="">全部部門</option>'+ds.map(d=>`<option>${esc(d)}</option>`).join('');sel.value=cur}
function renderAdmin(){
 if(!adminSession)return;const kw=$('filterKeyword').value.trim().toLowerCase(),dept=$('filterDept').value,status=$('filterStatus').value;
 let rows=leaveRecords.filter(l=>(!kw||[l.name,l.empId,l.attNo].some(v=>String(v||'').toLowerCase().includes(kw)))&&(!dept||String(l.dept||'')===dept)&&(!status||String(l.status||'')===status));
 rows.sort((a,b)=>String(b.startTime||'').localeCompare(String(a.startTime||'')));
 $('adminLeaveBody').innerHTML=rows.length?rows.map(l=>`<tr><td><b>${esc(l.name||'')}</b><br><span class="note">${esc(l.empId||l.attNo||'')}</span></td><td>${esc(l.dept||'')}</td><td>${esc(l.leaveType||'')}</td><td>${esc(l.startTime||'')}<br>～ ${esc(l.endTime||'')}</td><td>${esc(l.days??l.hours??'')}</td><td>${esc(l.reason||'')}</td><td>${badge(l.status)}</td><td>${leaveAccess==='manage'?`<div class="actions"><button style="background:#dcfce7;color:#166534" onclick="setLeaveStatus('${esc(l.id)}','已核准')">核准</button><button style="background:#ffe4e6;color:#9f1239" onclick="setLeaveStatus('${esc(l.id)}','已駁回')">駁回</button><button style="background:#e2e8f0;color:#334155" onclick="deleteLeave('${esc(l.id)}')">刪除</button></div>`:'只能查看'}</td></tr>`).join(''):'<tr><td colspan="8">沒有符合資料</td></tr>'
}
function renderAdminBalances(){
 const body=$('adminBalanceBody');if(!body)return;const kw=String($('balanceKeyword')?.value||'').trim().toLowerCase();
 const rows=employees.filter(e=>e&&e.empId&&String(e.empId).toUpperCase()!=='ADMIN'&&e.leaveBalance&&Number.isFinite(Number(e.leaveBalance.remaining))).filter(e=>!kw||`${e.empId||''} ${e.name||''} ${e.dept||''}`.toLowerCase().includes(kw)).sort((a,b)=>String(a.empId||'').localeCompare(String(b.empId||''),'zh-Hant',{numeric:true}));
 body.innerHTML=rows.length?rows.map(e=>{const b=e.leaveBalance||{},info=leaveBalanceInfo(e);return `<tr><td><b>${esc(e.empId||'')}</b></td><td>${esc(e.name||b.sourceName||'')}</td><td>${esc(e.dept||b.sourceDept||'')}</td><td>${esc(b.asOf||'--')}</td><td>${fmtDay(b.carryOver)} 天</td><td>${fmtDay(b.annual)} 天</td><td>${fmtDay(info.used)} 天</td><td><b style="color:${Number(info.effectiveRemaining)>0?'#059669':'#e11d48'}">${fmtDay(info.effectiveRemaining)} 天</b></td></tr>`}).join(''):'<tr><td colspan="8">尚未匯入員工年假／特休餘額資料</td></tr>';
}
async function setLeaveStatus(id,status){if(leaveAccess!=='manage')return;if(!confirm('確定將此請假設為「'+status+'」？'))return;try{await postCloud({action:'updateLeaveStatus',id,status});setStatus('✅ 請假狀態已更新','');await loadCloud();renderAdmin()}catch(e){setStatus('更新失敗：'+(e?.message||e),'error')}}
async function deleteLeave(id){if(leaveAccess!=='manage')return;if(!confirm('確定刪除此請假紀錄？'))return;try{await postCloud({action:'deleteLeaveRecord',id});setStatus('✅ 請假紀錄已刪除','');await loadCloud();renderAdmin()}catch(e){setStatus('刪除失敗：'+(e?.message||e),'error')}}
function renderAll(){if(currentEmployee){const fresh=employees.find(e=>String(e.empId||'').toUpperCase()===String(currentEmployee.empId||'').toUpperCase());if(fresh)currentEmployee=fresh;showEmployee()}else renderMy();if(adminSession){renderAdmin();renderAdminBalances()}}

(async function init(){
 const sso=await restoreAdmin();await loadCloud();
 if(!sso){const id=sessionStorage.getItem('port79_leave_emp_id');if(id){const e=employees.find(x=>String(x.empId||'').toUpperCase()===String(id).toUpperCase());if(e&&perms(e,e.adminRole).leave!=='none'){currentEmployee=e;showEmployee()}}}
 const today=new Date().toISOString().slice(0,10);$('leaveStart').value=today;$('leaveEnd').value=today;updateDays();
})();
</script>

<script id="port79-unified-sticky-leave">
(()=>{const h=document.querySelector('body>header');if(!h)return;const sync=()=>document.documentElement.style.setProperty('--leave-header-h',Math.ceil(h.getBoundingClientRect().height)+'px');sync();window.addEventListener('resize',sync,{passive:true});if(window.ResizeObserver)new ResizeObserver(sync).observe(h);})();

<div id="port79CalendarModeBox" aria-label="年份顯示方式">
  <span>年份</span>
  <select id="port79CalendarModeSelect" title="切換西元年／民國年">
    <option value="gregorian">西元</option>
    <option value="roc">民國</option>
  </select>
</div>
<script id="port79-calendar-mode-script">
(function(){
  const KEY='port79_year_mode';
  const mode=localStorage.getItem(KEY)==='roc'?'roc':'gregorian';
  const sel=document.getElementById('port79CalendarModeSelect');
  if(sel){
    sel.value=mode;
    sel.addEventListener('change',()=>{
      localStorage.setItem(KEY,sel.value==='roc'?'roc':'gregorian');
      location.reload();
    });
  }
  if(mode!=='roc')return;
  const skip=new Set(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT']);
  const cv=(s)=>{
    s=String(s||'');
    s=s.replace(/\b((?:19|20)\d{2})([\/-])(\d{1,2})\2(\d{1,2})\b/g,(m,y,sep,mo,d)=>`民國${Number(y)-1911}${sep}${mo}${sep}${d}`);
    s=s.replace(/\b((?:19|20)\d{2})([\/-])(\d{1,2})(?![\/-]\d)/g,(m,y,sep,mo)=>`民國${Number(y)-1911}${sep}${mo}`);
    s=s.replace(/\b((?:19|20)\d{2})年/g,(m,y)=>`民國${Number(y)-1911}年`);
    return s;
  };
  let busy=false;
  function scan(root){
    if(!root||busy)return;
    busy=true;
    try{
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const nodes=[]; let n;
      while(n=walker.nextNode())nodes.push(n);
      nodes.forEach(node=>{
        const p=node.parentElement;
        if(!p||skip.has(p.tagName)||p.closest('#port79CalendarModeBox'))return;
        const old=node.nodeValue||'';
        const next=cv(old);
        if(next!==old)node.nodeValue=next;
      });
    }finally{busy=false}
  }
  scan(document.body);
  const mo=new MutationObserver(ms=>{
    if(busy)return;
    ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)scan(n.nodeType===1?n:n.parentElement)}));
  });
  mo.observe(document.body,{childList:true,subtree:true});
})();
</script>
