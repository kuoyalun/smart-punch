<script>
(function(){
'use strict';
const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';
const $=id=>document.getElementById(id);let type='attendance';
function session(){try{return JSON.parse(sessionStorage.getItem('port79_user_session')||sessionStorage.getItem('admin_session')||'null')}catch(e){return null}}
function perms(){const s=session(),r=String(s?.adminRole||s?.role||'').toLowerCase(),p=s?.systemPermissions||{},f=s?.finePermissions?.history||{};if(r==='superadmin')return{level:'manage',attendance:true,schedule:true,vessel:true};const level=String(p.history||'none');return{level,attendance:!!f['attendance.view'],schedule:!!f['schedule.view'],vessel:!!f['vessel.view']}}
function token(){return String(sessionStorage.getItem('port79_gc_superadmin_token')||sessionStorage.getItem('port79_admin_token')||sessionStorage.getItem('port79_gc_token')||sessionStorage.getItem('port79_user_token')||'').trim()}
function gas(){return String(sessionStorage.getItem('port79_gas_url')||GAS_DEFAULT).trim()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){if(v==null)return '';if(typeof v==='object')return JSON.stringify(v);return String(v)}
async function api(action,params={}){const u=new URL(gas()),tk=token();u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));if(tk){u.searchParams.set('token',tk);u.searchParams.set('gcToken',tk)}u.searchParams.set('_',Date.now());const r=await fetch(u.toString(),{cache:'no-store',redirect:'follow'}),j=await r.json();if(!j?.ok)throw new Error(j?.error||'雲端讀取失敗');return j}
function currentMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function setStatus(s){$('status').textContent=s}
function pills(items){$('stats').innerHTML=items.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
let progressTimer=null,progressValue=0,progressStartedAt=0;
function progressPhase(p){if(p<18)return['建立雲端連線…','正在連接 Google Apps Script'];if(p<40)return['尋找年度檔案…','正在定位 Google Drive 年度試算表'];if(p<68)return['讀取月份資料…','正在讀取月份分頁與船舶／人員明細'];if(p<90)return['整理資料…','正在解析欄位、合併摘要與明細'];return['完成前檢查…','正在準備顯示資料']}
function paintProgress(p,text,detail){progressValue=Math.max(0,Math.min(100,Math.round(p)));$('progressBox').classList.add('show');$('progressFill').style.width=progressValue+'%';$('progressPct').textContent=progressValue+'%';const phase=progressPhase(progressValue);$('progressText').textContent=text||phase[0];$('progressDetail').textContent=detail||phase[1]}
function startProgress(month){if(progressTimer)clearInterval(progressTimer);progressValue=5;progressStartedAt=Date.now();paintProgress(progressValue,'開始讀取 '+month,'準備向 Google Drive 讀取資料');progressTimer=setInterval(()=>{const elapsed=Date.now()-progressStartedAt;let target=8+Math.min(82,Math.floor(elapsed/260));if(target>90)target=90;if(target>progressValue)paintProgress(target)},260)}
function finishProgress(ok,detail){if(progressTimer){clearInterval(progressTimer);progressTimer=null}paintProgress(ok?100:progressValue,ok?'讀取完成':'讀取失敗',detail||'');if(ok)setTimeout(()=>{$('progressBox').classList.remove('show')},1400)}
let activeTable={cols:[],rows:[],filters:[],sortIndex:-1,sortDir:'desc'};
function cellValue(c,r){return fmt(typeof c.get==='function'?c.get(r):r[c.key])}
function sortValue(c,r){
  try{
    if(typeof c.sortGet==='function')return c.sortGet(r);
    const v=typeof c.get==='function'?c.get(r):r[c.key];
    if(typeof v==='number')return v;
    const n=Number(v);if(v!==''&&Number.isFinite(n))return n;
    return String(v??'').toLowerCase();
  }catch(e){return ''}
}
function renderFilteredTable(){
  const {cols,rows,filters,sortIndex,sortDir}=activeTable;
  let visible=rows.filter(r=>cols.every((c,i)=>{const q=String(filters[i]||'').trim().toLowerCase();if(!q)return true;return cellValue(c,r).toLowerCase().includes(q)}));
  if(sortIndex>=0&&cols[sortIndex]){
    const c=cols[sortIndex],dir=sortDir==='asc'?1:-1;
    visible=visible.slice().sort((a,b)=>{
      const x=sortValue(c,a),y=sortValue(c,b);
      if(typeof x==='number'&&typeof y==='number')return (x-y)*dir;
      return String(x).localeCompare(String(y),'zh-Hant',{numeric:true,sensitivity:'base'})*dir;
    });
  }
  const tbody=$('historyTableBody');
  if(!tbody)return;
  tbody.innerHTML=visible.length?visible.map(r=>`<tr>${cols.map(c=>`<td>${esc(cellValue(c,r))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">沒有符合篩選條件的資料</td></tr>`;
  const counter=$('filterCount');if(counter)counter.textContent=`顯示 ${visible.length} / ${rows.length} 筆`;
  document.querySelectorAll('.sortable-head').forEach(th=>{
    const i=Number(th.dataset.col),c=cols[i];
    th.textContent=c.label+(sortIndex===i?(sortDir==='asc'?' ↑':' ↓'):' ↕');
  });
}
function table(cols,rows){
  if(!rows.length){$('result').innerHTML='<div class="empty">這個月份沒有資料</div>';activeTable={cols:[],rows:[],filters:[],sortIndex:-1,sortDir:'desc'};return}
  const defaultIndex=cols.findIndex(c=>c.defaultSort);
  activeTable={cols,rows,filters:new Array(cols.length).fill(''),sortIndex:defaultIndex,sortDir:defaultIndex>=0?(cols[defaultIndex].defaultSort||'desc'):'desc'};
  $('result').innerHTML=`<div style="padding:7px 10px;text-align:center;border-bottom:1px solid #eef2f7;color:#64748b;font-size:10px">每個欄位都可篩選；可點日期切換排序 <span id="filterCount" class="filterhint">顯示 ${rows.length} / ${rows.length} 筆</span></div><table><thead><tr>${cols.map((c,i)=>`<th ${c.sortable?'class="sortable-head" data-col="'+i+'" style="cursor:pointer;user-select:none" title="點擊切換排序"':''}>${esc(c.label)}${c.sortable?' ↕':''}</th>`).join('')}</tr><tr class="filterrow">${cols.map((c,i)=>`<th><input class="colfilter" data-col="${i}" placeholder="篩選${esc(c.label)}"></th>`).join('')}</tr></thead><tbody id="historyTableBody"></tbody></table>`;
  document.querySelectorAll('.colfilter').forEach(inp=>inp.addEventListener('input',e=>{activeTable.filters[Number(e.target.dataset.col)]=e.target.value;renderFilteredTable()}));
  document.querySelectorAll('.sortable-head').forEach(th=>th.addEventListener('click',()=>{
    const i=Number(th.dataset.col);
    if(activeTable.sortIndex===i)activeTable.sortDir=activeTable.sortDir==='desc'?'asc':'desc';
    else{activeTable.sortIndex=i;activeTable.sortDir='desc'}
    renderFilteredTable();
  }));
  renderFilteredTable();
}
function recordTime(r){return r.timeStr||r.datetime||r.dateTime||r.timestamp||r.time||r.fullTime||r.attendanceTime||r.clockTime||''}
function attendanceType(r){const s=String(r.status||r.type||r.action||'').trim();if(/上班簽到|加班上班|(^|[^未])上班|簽到/.test(s))return'IN';if(/下班簽退|加班下班|(^|[^未])下班|簽退/.test(s))return'OUT';return'OTHER'}
function timeMs(v){const s=String(v||'').trim();if(!s)return NaN;const d=new Date(s.replace(/\//g,'-').replace(' ','T'));return d.getTime()}
function datePart(v){const s=String(v||'').trim();const m=s.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);return m?`${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}`:''}
function monthPart(v){const s=String(v||'').trim();const m=s.match(/(\d{4})[\/-](\d{1,2})/);return m?`${m[1]}-${String(m[2]).padStart(2,'0')}`:''}

function timePart(v){const s=String(v||'').trim();const m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?`${String(m[1]).padStart(2,'0')}:${m[2]}${m[3]?':'+m[3]:''}`:''}
function durationText(a,b){const x=timeMs(a),y=timeMs(b);if(!Number.isFinite(x)||!Number.isFinite(y)||y<x)return'';const mins=Math.round((y-x)/60000),h=Math.floor(mins/60),m=mins%60;return `${h}小時${m?String(m).padStart(2,'0')+'分':''}`}
function attendanceIdentity(r){return String(r.empId||r.employeeId||r.attNo||r.name||r.employeeName||'').trim().toUpperCase()}
function pairAttendanceRecords(raw){
  const groups=new Map();raw.forEach(r=>{const k=attendanceIdentity(r);if(!k)return;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
  const out=[];
  for(const items of groups.values()){
    items.sort((a,b)=>(timeMs(recordTime(a))||0)-(timeMs(recordTime(b))||0));
    const cleaned=[];
    for(const r of items){
      const typ=attendanceType(r),ts=timeMs(recordTime(r)),prev=cleaned[cleaned.length-1],pt=prev?attendanceType(prev):'',pts=prev?timeMs(recordTime(prev)):NaN;
      if(prev&&typ!=='OTHER'&&typ===pt&&Number.isFinite(ts)&&Number.isFinite(pts)&&Math.abs(ts-pts)<=10*60000){
        if(typ==='OUT'&&ts>=pts)cleaned[cleaned.length-1]=r;
        continue;
      }
      cleaned.push(r);
    }
    let open=null;
    for(const r of cleaned){const typ=attendanceType(r),t=recordTime(r);
      if(typ==='IN'){if(open)out.push(makeShift(open,null));open=r;continue}
      if(typ==='OUT'){if(open){const gap=timeMs(t)-timeMs(recordTime(open));if(Number.isFinite(gap)&&gap>=0&&gap<=36*3600000){out.push(makeShift(open,r));open=null}else{out.push(makeShift(open,null));open=null;out.push(makeShift(null,r))}}else out.push(makeShift(null,r));continue}
      out.push(makeShift(r,null,true));
    }
    if(open)out.push(makeShift(open,null));
  }
  return out.sort((a,b)=>(timeMs(b.clockInTime||b.clockOutTime)||0)-(timeMs(a.clockInTime||a.clockOutTime)||0));
}
function makeShift(i,o,other=false){const r=i||o||{};const ins=i?recordTime(i):'',outs=o?recordTime(o):'';const notes=[i?.note||i?.remark,o?.note||o?.remark].filter(Boolean).filter((v,k,a)=>a.indexOf(v)===k).join('；');const loc=[i?.location||i?.place||i?.address,o?.location||o?.place||o?.address].filter(Boolean).filter((v,k,a)=>a.indexOf(v)===k).join(' → ');return{date:datePart(ins||outs),empId:r.empId||r.employeeId||'',name:r.name||r.employeeName||'',dept:r.dept||r.department||'',clockInTime:ins,clockOutTime:outs,duration:durationText(ins,outs),status:other?String(r.status||r.type||r.action||'其他'):(i&&o?'正常':i?'缺少簽退':'缺少簽到'),location:loc,note:notes}}
async function loadAttendance(month){
  const d=await api('historyGetMonthData',{type:'attendance',month});
  const raw=Array.isArray(d.records)?d.records:[];
  const paired=pairAttendanceRecords(raw);
  // 歷史資料中心採「嚴格月份」：選 2026-10 就只顯示日期屬於 2026-10 的班次。
  // API 可為跨月配對帶入前月邊界資料，但那些資料不可直接顯示成所選月份歷史。
  const rows=paired.filter(r=>monthPart(r.clockInTime||r.clockOutTime||r.date)===month);
  const rawInMonth=raw.filter(r=>monthPart(recordTime(r))===month);
  pills([`${month}`,`${rows.length} 個班次`,`${rawInMonth.length} 筆本月原始打卡`,d.sourceLabel||'Google Drive']);
  table([{label:'日期',get:r=>r.date,sortable:true,defaultSort:'desc',sortGet:r=>timeMs(r.clockInTime||r.clockOutTime||r.date)||0},{label:'工號',get:r=>r.empId},{label:'姓名',get:r=>r.name},{label:'部門',get:r=>r.dept},{label:'上班時間',get:r=>timePart(r.clockInTime)},{label:'下班時間',get:r=>timePart(r.clockOutTime)},{label:'工時',get:r=>r.duration},{label:'狀態',get:r=>r.status},{label:'地點',get:r=>r.location},{label:'備註',get:r=>r.note}],rows)
}
async function loadSchedule(month){const d=await api('historyGetMonthData',{type:'schedule',month}),rows=Array.isArray(d.schedules)?d.schedules:[];pills([month,`${rows.length} 名人員班表`,d.sourceLabel||'Google Drive']);const cols=[{label:'工號',get:r=>r.empId||''},{label:'姓名',get:r=>r.name||r.employeeName||''},{label:'組別',get:r=>r.group||r.schedule?.__personnel?.group||''},{label:'職務',get:r=>r.role||r.schedule?.__personnel?.role||''}];for(let i=1;i<=31;i++)cols.push({label:String(i),get:r=>r.schedule?.[i]??r.schedule?.[String(i)]??''});table(cols,rows)}
async function loadVessel(month){
  const d=await api('historyGetMonthData',{type:'vessel',month}),
        masters=Array.isArray(d.shipMasters)?d.shipMasters:[],
        records=Array.isArray(d.records)?d.records:[];
  pills([month,`${masters.length} 艘船舶`,`${records.length} 筆作業明細`,d.sourceLabel||'Google Drive']);
  const sourceRows=masters.length?masters:records;

  // 船舶櫃數不可能是日期毫秒值；只接受合理非負數字。
  const num=v=>{
    if(v===null||v===undefined||v==='')return null;
    const x=Number(v);
    return Number.isFinite(x)?x:null;
  };
  const saneCount=v=>{
    const x=num(v);
    return x!==null && x>=0 && x<=20000 ? x : null;
  };
  const n=v=>{const x=saneCount(v);return x===null?'':x};

  const normalizeShip=r=>{
    const disc=saneCount(r.disc);
    let load=saneCount(r.load);
    let containers=saneCount(r.totalContainers??r.ttlCtnr??r.TTLCtnr??r.containerCount);
    const shift=saneCount(r.shiftMoves??r.sheetShiftMoves) ?? 0;
    const totalMoves=saneCount(r.totalMoves??r.sheetTotalMoves);

    // 請款櫃數：若來源欄位被日期/錯欄污染，依「總Moves - SHIFT」回推。
    if(containers===null && totalMoves!==null){
      containers=Math.max(0,totalMoves-shift);
    }

    // 裝船櫃數：正常情況 DISC + LOAD = 請款櫃數。
    // 若 LOAD 為 0/異常、且可由請款櫃數與 DISC 合理回推，就採回推值。
    if(containers!==null && disc!==null){
      const derived=Math.max(0,containers-disc);
      if(load===null || Math.abs((disc+load)-containers)>1){
        load=derived;
      }
    }

    return Object.assign({},r,{
      __disc:disc,
      __load:load,
      __containers:containers,
      __shift:shift,
      __totalMoves:totalMoves
    });
  };

  const rows=sourceRows.map(normalizeShip);
  const voyage=r=>String(r.voyageE||r.voyageI||r.voyage||r.tfcCodeE||r.tfcCodeI||'').trim();
  const dateOrTime=(r,a,b,c,d)=>r[a]||r[b]||r[c]||r[d]||'';

  table([
    {label:'船名',get:r=>r.vesselName||r.shipName||r.vessel||r.name||''},
    {label:'航次',get:voyage},
    {label:'WORKING NO',get:r=>r.workingNo||r.WORKING_NO||''},
    {label:'開始',get:r=>dateOrTime(r,'firstDate','startDate','startTime','beginTime')},
    {label:'結束',get:r=>dateOrTime(r,'lastDate','endDate','endTime','finishTime')},
    {label:'卸船櫃數',get:r=>r.__disc??''},
    {label:'裝船櫃數',get:r=>r.__load??''},
    {label:'請款櫃數',get:r=>r.__containers??''},
    {label:'艙蓋 H/C',get:r=>n(r.hatches??r.sheetHatches)},
    {label:'翻艙 SHIFT',get:r=>r.__shift??''},
    {label:'總 Moves',get:r=>r.__totalMoves??''},
    {label:'AQC台數',get:r=>n(r.aqcCount??r.sheetAqcCount)},
    {label:'GPH',get:r=>{const x=num(r.gph??r.shipGph);return x===null?'':x}},
    {label:'GPH含H/C',get:r=>{const x=num(r.gphHC??r.shipGphHC);return x===null?'':x}},
    {label:'VPH',get:r=>{const x=num(r.vph??r.shipVph);return x===null?'':x}},
    {label:'VPH含H/C',get:r=>{const x=num(r.vphHC??r.shipVphHC);return x===null?'':x}},
    {label:'碼頭',get:r=>r.wharf||''}
  ],rows)
}
async function load(){const m=$('month').value;if(!/^\d{4}-\d{2}$/.test(m))return;setStatus(`讀取 ${m} 中…`);$('loadBtn').disabled=true;startProgress(m);try{if(type==='attendance')await loadAttendance(m);else if(type==='schedule')await loadSchedule(m);else await loadVessel(m);setStatus(`${m} 已完成；下次同月份會優先使用本機保存資料`);finishProgress(true,`${m} 資料已整理完成`)}catch(e){setStatus(`讀取失敗：${e.message||e}`);$('result').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`;finishProgress(false,e.message||String(e))}finally{$('loadBtn').disabled=false}}
function applyPerms(){const p=perms();document.querySelectorAll('.tab').forEach(b=>{b.disabled=p.level==='none'||!p[b.dataset.type]});const first=[...document.querySelectorAll('.tab')].find(b=>!b.disabled);if(!first){$('loadBtn').disabled=true;setStatus('目前帳號沒有「歷史資料」查詢權限，請至人資權限開啟');return}if(document.querySelector('.tab.active')?.disabled){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));first.classList.add('active');type=first.dataset.type}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;$('panelTitle').textContent=type==='attendance'?'考勤歷史':type==='schedule'?'排班歷史':'船舶歷史';$('result').innerHTML='<div class="empty">按「讀取月份」查看資料</div>';pills([]);setStatus('已切換資料類型')}));
$('loadBtn').addEventListener('click',load);$('month').value=currentMonth();applyPerms();
})();
</script>
