<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe3ee;--nav:#07162a;--blue:#2563eb;--green:#059669;--orange:#d97706;--shadow:0 12px 32px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC",system-ui,-apple-system,sans-serif}.top{background:linear-gradient(135deg,#07162a,#102b4b);color:#fff;padding:14px 18px;box-shadow:0 8px 24px rgba(2,6,23,.18)}.topin{max-width:1600px;margin:auto;display:flex;gap:14px;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:24px}.title{font-size:20px;font-weight:900}.sub{font-size:11px;color:#cbd5e1;margin-top:3px}.nav{display:flex;gap:5px;overflow:auto}.nav a{color:#cbd5e1;text-decoration:none;padding:8px 10px;border-radius:10px;white-space:nowrap;font-size:12px;font-weight:800}.nav a.active,.nav a:hover{background:rgba(255,255,255,.12);color:#fff}.wrap{max-width:1600px;margin:18px auto;padding:0 14px}.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.hero h1{font-size:24px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:13px}.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.picker input,.picker button{min-height:42px;border-radius:11px;border:1px solid var(--line);font:inherit}.picker input{padding:8px 12px;background:#fff}.picker button{padding:8px 15px;background:#0f172a;color:#fff;border:0;font-weight:900;cursor:pointer}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.tab{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;text-align:center;cursor:pointer;box-shadow:0 6px 18px rgba(15,23,42,.05)}.tab strong{font-size:16px}.tab small{display:block;color:var(--muted);margin-top:5px}.tab.active{outline:3px solid rgba(37,99,235,.16);border-color:#93c5fd}.tab[disabled]{opacity:.45;cursor:not-allowed}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panelhead{display:flex;justify-content:center;gap:18px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);text-align:center;flex-wrap:wrap}.panelhead>div:first-child{flex:1;min-width:260px}.stats{justify-content:center}.status{font-size:12px;color:var(--muted)}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.tablewrap{overflow:auto;max-height:68vh}.empty{padding:50px 20px;text-align:center;color:var(--muted)}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #eef2f7;text-align:center;vertical-align:middle}th{position:sticky;top:0;background:#f8fafc;z-index:2;font-size:11px;color:#475569}.note{margin-top:12px;color:var(--muted);font-size:11px;text-align:center}.cache{font-size:11px;color:#0f766e;font-weight:800}@media(max-width:850px){.topin{display:block}.nav{margin-top:10px}.hero{grid-template-columns:1fr}.tabs{grid-template-columns:1fr}.picker{width:100%}.picker input,.picker button{flex:1}.title{font-size:17px}}

.progressbox{display:none;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fafc;text-align:center}
.progressbox.show{display:block}.progressline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:7px;font-size:12px;font-weight:800;color:#334155}.progressbar{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.08)}.progressfill{height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,#0ea5e9,#2563eb,#7c3aed);transition:width .35s ease}.progressdetail{margin-top:6px;font-size:11px;color:#64748b}.num{font-variant-numeric:tabular-nums}
</style>

<body data-p79-system="history">
<header class="top"><div class="topin"><div class="brand"><div class="logo">🗄️</div><div><div class="title">歷史資料中心</div><div class="sub">考勤歷史・排班歷史・船舶歷史｜已讀月份會保存在本機</div></div></div><nav class="nav"><a href="../attendance/">🕒 考勤</a><a href="../work-hours/">📊 工時統計</a><a href="../leave/">📝 請假</a><a href="../schedule/">📅 排班</a><a href="../aqc-efficiency/">🚢 效率</a><a href="../hr/">👥 人資</a><a class="active" href="./">🗄️ 歷史資料</a><a href="../">⌂ 首頁</a></nav></div></header>
<main class="wrap">
<section class="hero"><div><h1>歷史資料集中查詢</h1><p>歷史資料直接從 Google Drive 的「79號碼頭－出勤資料／排班資料／船舶資料」年度試算表讀取；第一次讀取後會保存本機快取。</p></div><div class="picker"><input id="month" type="month"><button id="loadBtn" type="button">讀取月份</button></div></section>
<div class="tabs"><button class="tab active" data-type="attendance"><strong>🕒 考勤歷史</strong><small>依月份讀取完整考勤紀錄</small></button><button class="tab" data-type="schedule"><strong>📅 排班歷史</strong><small>依月份查看人員班表</small></button><button class="tab" data-type="vessel"><strong>🚢 船舶歷史</strong><small>依月份讀取船舶主檔與作業明細</small></button></div>
<section class="panel"><div class="panelhead"><div><strong id="panelTitle">考勤歷史</strong><div id="status" class="status">選擇月份後按「讀取月份」</div></div><div class="stats" id="stats"></div></div><div id="progressBox" class="progressbox"><div class="progressline"><span id="progressText">準備讀取…</span><span id="progressPct" class="num">0%</span></div><div class="progressbar"><div id="progressFill" class="progressfill"></div></div><div id="progressDetail" class="progressdetail">等待開始</div></div><div class="tablewrap" id="result"><div class="empty">尚未讀取資料</div></div></section>
<div class="note"><span class="cache">● 共用快取啟用</span>｜GitHub 資料夾：<b>history-data/</b>｜歷史月份只需下載一次，後續切換直接使用本機保存資料。</div>
</main>
<script>
(function(){
'use strict';
const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';
const $=id=>document.getElementById(id);let type='attendance';
function session(){try{return JSON.parse(sessionStorage.getItem('port79_user_session')||sessionStorage.getItem('admin_session')||'null')}catch(e){return null}}
function perms(){const s=session(),r=String(s?.adminRole||s?.role||'').toLowerCase(),p=s?.systemPermissions||{},f=s?.finePermissions?.history||{};if(r==='superadmin')return{level:'manage',attendance:true,schedule:true,vessel:true};const level=String(p.history||'none');return{level,attendance:!!f['attendance.view'],schedule:!!f['schedule.view'],vessel:!!f['vessel.view']}}
function token(){return String(sessionStorage.getItem('port79_gc_superadmin_token')||sessionStorage.getItem('port79_admin_token')||sessionStorage.getItem('port79_gc_token')||sessionStorage.getItem('port79_user_token')||'').trim()}
function gas(){return String(sessionStorage.getItem('port79_gas_url')||GAS_DEFAULT).trim()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){if(v==null)return '';if(typeof v==='object')return JSON.stringify(v);return String(v)}
async function api(action,params={}){const u=new URL(gas()),tk=token();u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));if(tk){u.searchParams.set('token',tk);u.searchParams.set('gcToken',tk)}u.searchParams.set('_',Date.now());const r=await fetch(u.toString(),{cache:'no-store',redirect:'follow'}),j=await r.json();if(!j?.ok)throw new Error(j?.error||'雲端讀取失敗');return j}
function currentMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function setStatus(s){$('status').textContent=s}
function pills(items){$('stats').innerHTML=items.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
let progressTimer=null,progressValue=0,progressStartedAt=0;
function progressPhase(p){if(p<18)return['建立雲端連線…','正在連接 Google Apps Script'];if(p<40)return['尋找年度檔案…','正在定位 Google Drive 年度試算表'];if(p<68)return['讀取月份資料…','正在讀取月份分頁與船舶／人員明細'];if(p<90)return['整理資料…','正在解析欄位、合併摘要與明細'];return['完成前檢查…','正在準備顯示資料']}
function paintProgress(p,text,detail){progressValue=Math.max(0,Math.min(100,Math.round(p)));$('progressBox').classList.add('show');$('progressFill').style.width=progressValue+'%';$('progressPct').textContent=progressValue+'%';const phase=progressPhase(progressValue);$('progressText').textContent=text||phase[0];$('progressDetail').textContent=detail||phase[1]}
function startProgress(month){if(progressTimer)clearInterval(progressTimer);progressValue=5;progressStartedAt=Date.now();paintProgress(progressValue,'開始讀取 '+month,'準備向 Google Drive 讀取資料');progressTimer=setInterval(()=>{const elapsed=Date.now()-progressStartedAt;let target=8+Math.min(82,Math.floor(elapsed/260));if(target>90)target=90;if(target>progressValue)paintProgress(target)},260)}
function finishProgress(ok,detail){if(progressTimer){clearInterval(progressTimer);progressTimer=null}paintProgress(ok?100:progressValue,ok?'讀取完成':'讀取失敗',detail||'');if(ok)setTimeout(()=>{$('progressBox').classList.remove('show')},1400)}
function table(cols,rows){if(!rows.length){$('result').innerHTML='<div class="empty">這個月份沒有資料</div>';return}$('result').innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(fmt(typeof c.get==='function'?c.get(r):r[c.key]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function recordTime(r){return r.datetime||r.dateTime||r.timestamp||r.time||r.fullTime||r.attendanceTime||r.clockTime||''}
async function loadAttendance(month){const d=await api('historyGetMonthData',{type:'attendance',month}),rows=Array.isArray(d.records)?d.records:[];pills([`${month}`,`${rows.length} 筆考勤`,d.sourceLabel||'Google Drive']);table([{label:'日期/時間',get:recordTime},{label:'工號',get:r=>r.empId||r.employeeId||r.id||''},{label:'姓名',get:r=>r.name||r.employeeName||''},{label:'部門',get:r=>r.dept||r.department||''},{label:'狀態',get:r=>r.type||r.status||r.action||''},{label:'地點',get:r=>r.location||r.place||r.address||''},{label:'備註',get:r=>r.note||r.remark||''}],rows)}
async function loadSchedule(month){const d=await api('historyGetMonthData',{type:'schedule',month}),rows=Array.isArray(d.schedules)?d.schedules:[];pills([month,`${rows.length} 名人員班表`,d.sourceLabel||'Google Drive']);const cols=[{label:'工號',get:r=>r.empId||''},{label:'姓名',get:r=>r.name||r.employeeName||''},{label:'組別',get:r=>r.group||r.schedule?.__personnel?.group||''},{label:'職務',get:r=>r.role||r.schedule?.__personnel?.role||''}];for(let i=1;i<=31;i++)cols.push({label:String(i),get:r=>r.schedule?.[i]??r.schedule?.[String(i)]??''});table(cols,rows)}
async function loadVessel(month){
  const d=await api('historyGetMonthData',{type:'vessel',month}),masters=Array.isArray(d.shipMasters)?d.shipMasters:[],records=Array.isArray(d.records)?d.records:[];
  pills([month,`${masters.length} 艘船舶`,`${records.length} 筆作業明細`,d.sourceLabel||'Google Drive']);
  const rows=masters.length?masters:records;
  const n=v=>{const x=Number(v);return Number.isFinite(x)?x:''};
  const voyage=r=>String(r.voyageE||r.voyageI||r.voyage||r.tfcCodeE||r.tfcCodeI||'').trim();
  const dateOrTime=(r,a,b,c,d)=>r[a]||r[b]||r[c]||r[d]||'';
  table([
    {label:'船名',get:r=>r.vesselName||r.shipName||r.vessel||r.name||''},
    {label:'航次',get:voyage},
    {label:'WORKING NO',get:r=>r.workingNo||r.WORKING_NO||''},
    {label:'開始',get:r=>dateOrTime(r,'firstDate','startDate','startTime','beginTime')},
    {label:'結束',get:r=>dateOrTime(r,'lastDate','endDate','endTime','finishTime')},
    {label:'卸船櫃數',get:r=>n(r.disc)},
    {label:'裝船櫃數',get:r=>n(r.load)},
    {label:'請款櫃數',get:r=>n(r.totalContainers??r.ttlCtnr??r.TTLCtnr??r.containerCount)},
    {label:'艙蓋 H/C',get:r=>n(r.hatches??r.sheetHatches)},
    {label:'翻艙 SHIFT',get:r=>n(r.shiftMoves??r.sheetShiftMoves)},
    {label:'總 Moves',get:r=>n(r.totalMoves??r.sheetTotalMoves)},
    {label:'AQC台數',get:r=>n(r.aqcCount??r.sheetAqcCount)},
    {label:'GPH',get:r=>n(r.gph??r.shipGph)},
    {label:'GPH含H/C',get:r=>n(r.gphHC??r.shipGphHC)},
    {label:'VPH',get:r=>n(r.vph??r.shipVph)},
    {label:'VPH含H/C',get:r=>n(r.vphHC??r.shipVphHC)},
    {label:'碼頭',get:r=>r.wharf||''}
  ],rows)
}
async function load(){const m=$('month').value;if(!/^\d{4}-\d{2}$/.test(m))return;setStatus(`讀取 ${m} 中…`);$('loadBtn').disabled=true;startProgress(m);try{if(type==='attendance')await loadAttendance(m);else if(type==='schedule')await loadSchedule(m);else await loadVessel(m);setStatus(`${m} 已完成；下次同月份會優先使用本機保存資料`);finishProgress(true,`${m} 資料已整理完成`)}catch(e){setStatus(`讀取失敗：${e.message||e}`);$('result').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`;finishProgress(false,e.message||String(e))}finally{$('loadBtn').disabled=false}}
function applyPerms(){const p=perms();document.querySelectorAll('.tab').forEach(b=>{b.disabled=p.level==='none'||!p[b.dataset.type]});const first=[...document.querySelectorAll('.tab')].find(b=>!b.disabled);if(!first){$('loadBtn').disabled=true;setStatus('目前帳號沒有「歷史資料」查詢權限，請至人資權限開啟');return}if(document.querySelector('.tab.active')?.disabled){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));first.classList.add('active');type=first.dataset.type}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;$('panelTitle').textContent=type==='attendance'?'考勤歷史':type==='schedule'?'排班歷史':'船舶歷史';$('result').innerHTML='<div class="empty">按「讀取月份」查看資料</div>';pills([]);setStatus('已切換資料類型')}));
$('loadBtn').addEventListener('click',load);$('month').value=currentMonth();applyPerms();
})();
</script>

const C=window.Port79CalendarRange;if(!C)return;
C.mountMonth({inputId:'month'});

});
