<script>
(function(){
'use strict';
const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbxbS8GGm19JZQG_7Y2c6bTFY_SK5qg9gkvygKEJ1_zw-0Rlryd3-hEZ7sDvjRpFogt4HA/exec';
const $=id=>document.getElementById(id);let type='attendance';
function session(){try{return JSON.parse(sessionStorage.getItem('port79_user_session')||sessionStorage.getItem('admin_session')||'null')}catch(e){return null}}
function perms(){const s=session(),r=String(s?.adminRole||s?.role||'').toLowerCase(),p=s?.systemPermissions||{},f=s?.finePermissions?.history||{};if(r==='superadmin')return{level:'manage',attendance:true,schedule:true,vessel:true};const level=String(p.history||'none');return{level,attendance:!!f['attendance.view'],schedule:!!f['schedule.view'],vessel:!!f['vessel.view']}}
function token(){return String(sessionStorage.getItem('port79_gc_superadmin_token')||sessionStorage.getItem('port79_admin_token')||sessionStorage.getItem('port79_gc_token')||sessionStorage.getItem('port79_user_token')||'').trim()}
function gas(){return String(sessionStorage.getItem('port79_gas_url')||GAS_DEFAULT).trim()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){if(v==null)return '';if(typeof v==='object')return JSON.stringify(v);return String(v)}
async function api(action,params={}){const u=new URL(gas()),tk=token();u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));if(tk){u.searchParams.set('token',tk);u.searchParams.set('gcToken',tk)}u.searchParams.set('_',Date.now());const r=await fetch(u.toString(),{cache:'no-store',redirect:'follow'}),j=await r.json();if(!j?.ok)throw new Error(j?.error||'雲端讀取失敗');return j}
function currentMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function setStatus(s){$('status').textContent=s}
function pills(items){$('stats').innerHTML=items.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
let progressTimer=null,progressValue=0,progressStartedAt=0;
function progressPhase(p){if(p<18)return['建立雲端連線…','正在連接 Google Apps Script'];if(p<40)return['尋找年度檔案…','正在定位 Google Drive 年度試算表'];if(p<68)return['讀取月份資料…','正在讀取月份分頁與船舶／人員明細'];if(p<90)return['整理資料…','正在解析欄位、合併摘要與明細'];return['完成前檢查…','正在準備顯示資料']}
function paintProgress(p,text,detail){progressValue=Math.max(0,Math.min(100,Math.round(p)));$('progressBox').classList.add('show');$('progressFill').style.width=progressValue+'%';$('progressPct').textContent=progressValue+'%';const phase=progressPhase(progressValue);$('progressText').textContent=text||phase[0];$('progressDetail').textContent=detail||phase[1]}
function startProgress(month){if(progressTimer)clearInterval(progressTimer);progressValue=5;progressStartedAt=Date.now();paintProgress(progressValue,'開始讀取 '+month,'準備向 Google Drive 讀取資料');progressTimer=setInterval(()=>{const elapsed=Date.now()-progressStartedAt;let target=8+Math.min(82,Math.floor(elapsed/260));if(target>90)target=90;if(target>progressValue)paintProgress(target)},260)}
function finishProgress(ok,detail){if(progressTimer){clearInterval(progressTimer);progressTimer=null}paintProgress(ok?100:progressValue,ok?'讀取完成':'讀取失敗',detail||'');if(ok)setTimeout(()=>{$('progressBox').classList.remove('show')},1400)}
let activeTable={cols:[],rows:[],filters:[]};
function cellValue(c,r){return fmt(typeof c.get==='function'?c.get(r):r[c.key])}
function renderFilteredTable(){
  const {cols,rows,filters}=activeTable;
  const visible=rows.filter(r=>cols.every((c,i)=>{const q=String(filters[i]||'').trim().toLowerCase();if(!q)return true;return cellValue(c,r).toLowerCase().includes(q)}));
  const tbody=$('historyTableBody');
  if(!tbody)return;
  tbody.innerHTML=visible.length?visible.map(r=>`<tr>${cols.map(c=>`<td>${esc(cellValue(c,r))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">沒有符合篩選條件的資料</td></tr>`;
  const counter=$('filterCount');if(counter)counter.textContent=`顯示 ${visible.length} / ${rows.length} 筆`
}
function table(cols,rows){
  if(!rows.length){$('result').innerHTML='<div class="empty">這個月份沒有資料</div>';activeTable={cols:[],rows:[],filters:[]};return}
  activeTable={cols,rows,filters:new Array(cols.length).fill('')};
  $('result').innerHTML=`<div style="padding:7px 10px;text-align:center;border-bottom:1px solid #eef2f7;color:#64748b;font-size:10px">每個欄位都可篩選 <span id="filterCount" class="filterhint">顯示 ${rows.length} / ${rows.length} 筆</span></div><table><thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr><tr class="filterrow">${cols.map((c,i)=>`<th><input class="colfilter" data-col="${i}" placeholder="篩選${esc(c.label)}"></th>`).join('')}</tr></thead><tbody id="historyTableBody"></tbody></table>`;
  document.querySelectorAll('.colfilter').forEach(inp=>inp.addEventListener('input',e=>{activeTable.filters[Number(e.target.dataset.col)]=e.target.value;renderFilteredTable()}));
  renderFilteredTable();
}
function recordTime(r){return r.timeStr||r.datetime||r.dateTime||r.timestamp||r.time||r.fullTime||r.attendanceTime||r.clockTime||''}
function attendanceType(r){const s=String(r.status||r.type||r.action||'').trim();if(/上班簽到|加班上班|(^|[^未])上班|簽到/.test(s))return'IN';if(/下班簽退|加班下班|(^|[^未])下班|簽退/.test(s))return'OUT';return'OTHER'}
function timeMs(v){const s=String(v||'').trim();if(!s)return NaN;const d=new Date(s.replace(/\//g,'-').replace(' ','T'));return d.getTime()}
function datePart(v){const s=String(v||'').trim();const m=s.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);return m?`${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}`:''}
function timePart(v){const s=String(v||'').trim();const m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?`${String(m[1]).padStart(2,'0')}:${m[2]}${m[3]?':'+m[3]:''}`:''}
function durationText(a,b){const x=timeMs(a),y=timeMs(b);if(!Number.isFinite(x)||!Number.isFinite(y)||y<x)return'';const mins=Math.round((y-x)/60000),h=Math.floor(mins/60),m=mins%60;return `${h}小時${m?String(m).padStart(2,'0')+'分':''}`}
function attendanceIdentity(r){return String(r.empId||r.employeeId||r.attNo||r.name||r.employeeName||'').trim().toUpperCase()}
function pairAttendanceRecords(raw){
  const groups=new Map();raw.forEach(r=>{const k=attendanceIdentity(r);if(!k)return;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
  const out=[];
  for(const items of groups.values()){
    items.sort((a,b)=>(timeMs(recordTime(a))||0)-(timeMs(recordTime(b))||0));
    const cleaned=[];
    for(const r of items){
      const typ=attendanceType(r),ts=timeMs(recordTime(r)),prev=cleaned[cleaned.length-1],pt=prev?attendanceType(prev):'',pts=prev?timeMs(recordTime(prev)):NaN;
      if(prev&&typ!=='OTHER'&&typ===pt&&Number.isFinite(ts)&&Number.isFinite(pts)&&Math.abs(ts-pts)<=10*60000){
        if(typ==='OUT'&&ts>=pts)cleaned[cleaned.length-1]=r;
        continue;
      }
      cleaned.push(r);
    }
    let open=null;
    for(const r of cleaned){const typ=attendanceType(r),t=recordTime(r);
      if(typ==='IN'){if(open)out.push(makeShift(open,null));open=r;continue}
      if(typ==='OUT'){if(open){const gap=timeMs(t)-timeMs(recordTime(open));if(Number.isFinite(gap)&&gap>=0&&gap<=36*3600000){out.push(makeShift(open,r));open=null}else{out.push(makeShift(open,null));open=null;out.push(makeShift(null,r))}}else out.push(makeShift(null,r));continue}
      out.push(makeShift(r,null,true));
    }
    if(open)out.push(makeShift(open,null));
  }
  return out.sort((a,b)=>(timeMs(b.clockInTime||b.clockOutTime)||0)-(timeMs(a.clockInTime||a.clockOutTime)||0));
}
function makeShift(i,o,other=false){const r=i||o||{};const ins=i?recordTime(i):'',outs=o?recordTime(o):'';const notes=[i?.note||i?.remark,o?.note||o?.remark].filter(Boolean).filter((v,k,a)=>a.indexOf(v)===k).join('；');const loc=[i?.location||i?.place||i?.address,o?.location||o?.place||o?.address].filter(Boolean).filter((v,k,a)=>a.indexOf(v)===k).join(' → ');return{date:datePart(ins||outs),empId:r.empId||r.employeeId||'',name:r.name||r.employeeName||'',dept:r.dept||r.department||'',clockInTime:ins,clockOutTime:outs,duration:durationText(ins,outs),status:other?String(r.status||r.type||r.action||'其他'):(i&&o?'正常':i?'缺少簽退':'缺少簽到'),location:loc,note:notes}}
async function loadAttendance(month){const d=await api('historyGetMonthData',{type:'attendance',month}),raw=Array.isArray(d.records)?d.records:[],rows=pairAttendanceRecords(raw);pills([`${month}`,`${rows.length} 個班次`,`${raw.length} 筆原始打卡`,d.sourceLabel||'Google Drive']);table([{label:'日期',get:r=>r.date},{label:'工號',get:r=>r.empId},{label:'姓名',get:r=>r.name},{label:'部門',get:r=>r.dept},{label:'上班時間',get:r=>timePart(r.clockInTime)},{label:'下班時間',get:r=>timePart(r.clockOutTime)},{label:'工時',get:r=>r.duration},{label:'狀態',get:r=>r.status},{label:'地點',get:r=>r.location},{label:'備註',get:r=>r.note}],rows)}
async function loadSchedule(month){const d=await api('historyGetMonthData',{type:'schedule',month}),rows=Array.isArray(d.schedules)?d.schedules:[];pills([month,`${rows.length} 名人員班表`,d.sourceLabel||'Google Drive']);const cols=[{label:'工號',get:r=>r.empId||''},{label:'姓名',get:r=>r.name||r.employeeName||''},{label:'組別',get:r=>r.group||r.schedule?.__personnel?.group||''},{label:'職務',get:r=>r.role||r.schedule?.__personnel?.role||''}];for(let i=1;i<=31;i++)cols.push({label:String(i),get:r=>r.schedule?.[i]??r.schedule?.[String(i)]??''});table(cols,rows)}
async function loadVessel(month){
  const d=await api('historyGetMonthData',{type:'vessel',month}),masters=Array.isArray(d.shipMasters)?d.shipMasters:[],records=Array.isArray(d.records)?d.records:[];
  pills([month,`${masters.length} 艘船舶`,`${records.length} 筆作業明細`,d.sourceLabel||'Google Drive']);
  const rows=masters.length?masters:records;
  const n=v=>{const x=Number(v);return Number.isFinite(x)?x:''};
  const voyage=r=>String(r.voyageE||r.voyageI||r.voyage||r.tfcCodeE||r.tfcCodeI||'').trim();
  const dateOrTime=(r,a,b,c,d)=>r[a]||r[b]||r[c]||r[d]||'';
  table([
    {label:'船名',get:r=>r.vesselName||r.shipName||r.vessel||r.name||''},
    {label:'航次',get:voyage},
    {label:'WORKING NO',get:r=>r.workingNo||r.WORKING_NO||''},
    {label:'開始',get:r=>dateOrTime(r,'firstDate','startDate','startTime','beginTime')},
    {label:'結束',get:r=>dateOrTime(r,'lastDate','endDate','endTime','finishTime')},
    {label:'卸船櫃數',get:r=>n(r.disc)},
    {label:'裝船櫃數',get:r=>n(r.load)},
    {label:'請款櫃數',get:r=>n(r.totalContainers??r.ttlCtnr??r.TTLCtnr??r.containerCount)},
    {label:'艙蓋 H/C',get:r=>n(r.hatches??r.sheetHatches)},
    {label:'翻艙 SHIFT',get:r=>n(r.shiftMoves??r.sheetShiftMoves)},
    {label:'總 Moves',get:r=>n(r.totalMoves??r.sheetTotalMoves)},
    {label:'AQC台數',get:r=>n(r.aqcCount??r.sheetAqcCount)},
    {label:'GPH',get:r=>n(r.gph??r.shipGph)},
    {label:'GPH含H/C',get:r=>n(r.gphHC??r.shipGphHC)},
    {label:'VPH',get:r=>n(r.vph??r.shipVph)},
    {label:'VPH含H/C',get:r=>n(r.vphHC??r.shipVphHC)},
    {label:'碼頭',get:r=>r.wharf||''}
  ],rows)
}
async function load(){const m=$('month').value;if(!/^\d{4}-\d{2}$/.test(m))return;setStatus(`讀取 ${m} 中…`);$('loadBtn').disabled=true;startProgress(m);try{if(type==='attendance')await loadAttendance(m);else if(type==='schedule')await loadSchedule(m);else await loadVessel(m);setStatus(`${m} 已完成；下次同月份會優先使用本機保存資料`);finishProgress(true,`${m} 資料已整理完成`)}catch(e){setStatus(`讀取失敗：${e.message||e}`);$('result').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`;finishProgress(false,e.message||String(e))}finally{$('loadBtn').disabled=false}}
function applyPerms(){const p=perms();document.querySelectorAll('.tab').forEach(b=>{b.disabled=p.level==='none'||!p[b.dataset.type]});const first=[...document.querySelectorAll('.tab')].find(b=>!b.disabled);if(!first){$('loadBtn').disabled=true;setStatus('目前帳號沒有「歷史資料」查詢權限，請至人資權限開啟');return}if(document.querySelector('.tab.active')?.disabled){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));first.classList.add('active');type=first.dataset.type}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;$('panelTitle').textContent=type==='attendance'?'考勤歷史':type==='schedule'?'排班歷史':'船舶歷史';$('result').innerHTML='<div class="empty">按「讀取月份」查看資料</div>';pills([]);setStatus('已切換資料類型')}));
$('loadBtn').addEventListener('click',load);$('month').value=currentMonth();applyPerms();
})();
</script>

<script id="p79-seven-system-unified-script-v20261004">
(function(){
'use strict';
const CURRENT='history';
const NAV=[
 ['attendance','🕒','考勤','../attendance/'],
 ['workhours','📊','工時統計','../work-hours/'],
 ['leave','📝','請假','../leave/'],
 ['schedule','📅','排班','../schedule/'],
 ['efficiency','🚢','效率','../aqc-efficiency/'],
 ['hr','👥','人資','../hr/'],
 ['history','🗄️','歷史資料','../history-data/']
];
const SYSTEMS=[
 ['attendance','考勤'],['workhours','工時統計'],['leave','請假'],
 ['schedule','排班'],['efficiency','效率'],['hr','人資'],['history','歷史資料']
];
const LEADER='p79_seven_live_leader_v1',SNAP='p79_seven_live_snapshot_v1';
const TAB='seven_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
let timer=null;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navHtml(){
 return NAV.map(n=>`<a class="${n[0]===CURRENT?'active':''}" href="${n[3]}">${n[1]} ${n[2]}</a>`).join('');
}
function patchNav(){
 const html=navHtml();
 const v103=document.querySelector('#p79UnifiedShellV103 .p79v103-nav');
 if(v103){v103.innerHTML=html;return v103}
 const old=document.querySelector('#p79UnifiedShell .p79u-nav');
 if(old){old.innerHTML=html;return old}
 const history=document.querySelector('header.top .nav, header .nav');
 if(history){history.classList.add('p79-seven-nav');history.innerHTML=html;return history}
 let fallback=document.getElementById('p79SevenFallbackNav');
 if(!fallback){
   fallback=document.createElement('nav');fallback.id='p79SevenFallbackNav';fallback.className='p79-seven-nav';
   fallback.style.cssText='background:#112843;padding:8px 12px;color:#fff;position:relative;z-index:9996';
   fallback.innerHTML=html;
   const h=document.querySelector('header');
   if(h)h.insertAdjacentElement('afterend',fallback);else document.body.prepend(fallback);
 }
 return fallback;
}
function gasUrl(){
 try{if(typeof GAS_URL!=='undefined'&&GAS_URL)return String(GAS_URL)}catch(e){}
 try{if(typeof sysConfig!=='undefined'&&sysConfig?.gasUrl)return String(sysConfig.gasUrl)}catch(e){}
 try{if(window.GAS_URL)return String(window.GAS_URL);if(window.API_URL)return String(window.API_URL)}catch(e){}
 try{for(const k of ['port79_gas_url','gasUrl','GAS_URL']){const v=localStorage.getItem(k)||sessionStorage.getItem(k);if(v&&/script\.google\.com/i.test(v))return v}}catch(e){}
 return '';
}
function ensureRow(){
 let row=document.getElementById('p79SevenLiveRow');if(row)return row;
 row=document.createElement('div');row.id='p79SevenLiveRow';
 row.innerHTML='<span class="p79-seven-cloud-title">☁️ 雲端</span>'+SYSTEMS.map(([k,l])=>`<span class="p79-seven-live-item idle" data-sys="${k}"><b>${l}</b><span>● 待命</span></span>`).join('');
 const shell=document.getElementById('p79UnifiedShellV103')||document.getElementById('p79UnifiedShell');
 if(shell)shell.insertAdjacentElement('afterend',row);
 else {
   const nav=patchNav(),h=document.querySelector('header.top,header');
   if(nav&&nav.id==='p79SevenFallbackNav')nav.insertAdjacentElement('afterend',row);
   else if(h)h.insertAdjacentElement('afterend',row);
   else document.body.prepend(row);
 }
 return row;
}
function elapsed(ms){const s=Math.max(0,Math.floor(Number(ms||0)/1000));return s<60?s+'秒':Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'}
function icon(op){return op==='write'?'✍️':op==='read'?'↙':op==='auth'?'🔐':'⚙️'}
function cls(op){return op==='write'?'write':op==='read'?'read':op==='auth'?'auth':'read'}
function render(data){
 const row=ensureRow(),systems={...(data?.systems||{})};
 // 工時統計直接讀考勤資料，因此狀態同步考勤。
 if(!systems.workhours&&systems.attendance)systems.workhours=systems.attendance;
 const items=row.querySelectorAll('.p79-seven-live-item');
 items.forEach(el=>{
   const key=el.dataset.sys,label=SYSTEMS.find(x=>x[0]===key)?.[1]||key,s=systems[key]||{};
   const jobs=Array.isArray(s.active)?s.active:[];
   el.className='p79-seven-live-item';
   if(jobs.length){
     const job=jobs.find(x=>x.operation==='write')||jobs.find(x=>x.operation==='read')||jobs[0];
     const op=job?.operation||'read';el.classList.add(cls(op));
     el.innerHTML=`<b>${label}</b><span>${icon(op)} ${esc(job?.operationLabel||'讀取')}中｜${esc(job?.label||job?.action||'雲端資料')} ${elapsed(job?.elapsedMs)}</span>`;
     return;
   }
   const last=s.lastCompleted;
   if(last&&Number(last.ageMs||0)<16000){
     const ok=last.ok!==false;el.classList.add(ok?'done':'error');
     el.innerHTML=`<b>${label}</b><span>${ok?'✓':'!'} ${esc(last.operationLabel||'讀取')}完成｜${esc(last.label||last.action||'')}</span>`;
   }else{
     el.classList.add('idle');el.innerHTML=`<b>${label}</b><span>● 待命</span>`;
   }
 });
}
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function leader(){
 if(document.visibilityState==='hidden')return false;
 const now=Date.now(),cur=read(LEADER);
 if(cur&&cur.id!==TAB&&Number(cur.until||0)>now)return false;
 write(LEADER,{id:TAB,until:now+14000});return read(LEADER)?.id===TAB;
}
function cached(){const s=read(SNAP);if(s?.data&&Date.now()-Number(s.at||0)<45000){render(s.data);return true}return false}
async function tick(){
 clearTimeout(timer);patchNav();ensureRow();
 if(document.visibilityState==='hidden'){timer=setTimeout(tick,20000);return}
 if(!leader()){cached();timer=setTimeout(tick,5000);return}
 const url=gasUrl();
 if(!url){cached();timer=setTimeout(tick,15000);return}
 try{
   const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),5500);
   const res=await fetch(url+(url.includes('?')?'&':'?')+'action=getCloudActivity&_='+Date.now(),{cache:'no-store',signal:ctrl.signal});
   clearTimeout(to);const data=await res.json();if(!data?.ok)throw new Error(data?.error||'status error');
   render(data);write(SNAP,{at:Date.now(),data});write(LEADER,{id:TAB,until:Date.now()+14000});
   timer=setTimeout(tick,Number(data.activeCount||0)>0?2500:8000);
 }catch(e){cached();timer=setTimeout(tick,20000)}
}
function start(){patchNav();ensureRow();tick()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){clearTimeout(timer);tick()}});
window.addEventListener('focus',()=>{clearTimeout(timer);tick()});
window.addEventListener('storage',e=>{if(e.key===SNAP)cached()});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(start,80),{once:true});else setTimeout(start,80);
})();
</script>


<script id="p79-global-logout-to-seven-home-v20261004">
(function(){
'use strict';
const P79_LOGOUT_KEYS=[
  'admin_session','aqc_admin_logged_in','aqc_admin_id','aqc_admin_role','aqc_admin_name',
  'aqc_admin_active_tab','port79_admin_token','port79_user_token','port79_gc_token',
  'port79_gc_superadmin_token','port79_sso_verified','p79_workhours_permission'
];
window.p79LogoutToSevenSystemHome=function(){
  try{
    P79_LOGOUT_KEYS.forEach(k=>{
      try{sessionStorage.removeItem(k)}catch(e){}
      try{localStorage.removeItem(k)}catch(e){}
    });
  }catch(e){}
  // 保留 GAS URL / UI 主題，不清除使用者系統設定；只登出身分。
  location.replace('../?logout=1&t='+Date.now());
};
document.addEventListener('click',function(e){
  const btn=e.target?.closest?.('button,a');
  if(!btn)return;
  const txt=String(btn.textContent||'').replace(/\s+/g,'').trim();
  // 只攔真正登出鈕；不攔「登入／登出紀錄」「清除登入登出紀錄」等管理按鈕。
  if(!/^(↪)?登出(後台)?$/.test(txt))return;
  e.preventDefault();
  e.stopImmediatePropagation();
  window.p79LogoutToSevenSystemHome();
},true);
})();
</script>
